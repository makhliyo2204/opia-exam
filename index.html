<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр C++ — Студент</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>

:root{
  color-scheme:dark;
  --bg:#090e1d;
  --surface:rgba(20,29,54,.62);
  --surface-strong:rgba(25,37,68,.82);
  --ink:#f4f7ff;
  --muted:#a8b4d0;
  --edge:rgba(180,202,255,.24);
  --shadow:0 18px 55px rgba(0,0,0,.28);
  --accent:#8b9cff;
  --on-accent:#10172e;
  --accent-soft:rgba(139,156,255,.18);
  --a:#ff83b5;--b:#68c8ff;--c:#ffc978;--d:#b49aff;
  --good:#5ce0ae;--good-soft:rgba(52,211,153,.14);
  --bad:#ff8293;--bad-soft:rgba(255,100,125,.14);
  --warn:#ffd18a;--warn-soft:rgba(255,190,92,.14);
  --code-bg:rgba(5,10,24,.88);--code-ink:#eaf1ff;
  --font-display:"Onest","Segoe UI",sans-serif;
  --font-body:"Onest","Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth;background:var(--bg)}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  background:
    radial-gradient(ellipse at 12% 5%,rgba(80,112,255,.28),transparent 34rem),
    radial-gradient(ellipse at 88% 18%,rgba(0,211,201,.16),transparent 31rem),
    radial-gradient(ellipse at 50% 95%,rgba(153,91,255,.15),transparent 35rem),
    linear-gradient(135deg,#080d1b 0%,#101a32 48%,#0b1225 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.22;
  background-image:linear-gradient(rgba(190,210,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(190,210,255,.055) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,black,transparent 85%);
}
main{max-width:900px;margin:0 auto;padding:28px 18px 76px;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--font-display);font-weight:800;letter-spacing:-.045em;font-size:clamp(27px,6vw,42px);line-height:1.12;margin:0}
h2{font-family:var(--font-display);font-weight:750;letter-spacing:-.025em;font-size:19px;margin:0}
p{margin:0}.muted{color:var(--muted)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums}
.card{
  position:relative;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035));
  border:1px solid rgba(194,211,255,.24);border-radius:22px;padding:23px;
  display:flex;flex-direction:column;gap:16px;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(22px) saturate(145%);-webkit-backdrop-filter:blur(22px) saturate(145%);
}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.spread{justify-content:space-between}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid rgba(104,200,255,.8);outline-offset:3px}
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(125deg,rgba(66,91,205,.88),rgba(91,105,231,.68) 52%,rgba(36,183,195,.48));
  color:#fff;border:1px solid rgba(218,229,255,.34);border-radius:25px;padding:27px 25px;
  box-shadow:0 20px 55px rgba(45,77,190,.25),inset 0 1px 0 rgba(255,255,255,.28);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
}
.hero:after{
  content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-65px;top:-135px;
  background:radial-gradient(circle,rgba(255,255,255,.23),rgba(255,255,255,0) 68%);
  border:1px solid rgba(255,255,255,.15);pointer-events:none
}
.hero>*{position:relative;z-index:1}
.hero.warn{background:linear-gradient(125deg,rgba(151,104,35,.78),rgba(204,143,58,.42))}
.hero.bad{background:linear-gradient(125deg,rgba(156,54,83,.82),rgba(219,91,116,.43))}
.hero.good{background:linear-gradient(125deg,rgba(25,126,101,.82),rgba(47,190,151,.42))}
.hero .eyebrow{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,.78)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{
  background:rgba(9,17,39,.42);color:#fff;font-family:var(--font-mono);font-size:12px;font-weight:650;
  padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.19);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(10px)
}
.btn{
  border:1px solid rgba(198,215,255,.25);background:rgba(255,255,255,.10);color:var(--ink);
  border-radius:12px;padding:9px 17px;font-weight:650;font-size:13px;
  box-shadow:0 5px 16px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .18s,background .18s,border-color .18s,box-shadow .18s
}
.btn:hover:not(:disabled){transform:translateY(-2px);background:rgba(255,255,255,.17);border-color:rgba(198,215,255,.48);box-shadow:0 9px 22px rgba(0,0,0,.18)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn.primary{background:linear-gradient(120deg,#9baaff,#73cfff);border-color:rgba(220,233,255,.55);color:#101a36;font-weight:800}
.btn.primary:hover:not(:disabled){background:linear-gradient(120deg,#b1bcff,#8cdbff)}
.btn.big{font-size:15px;padding:13px 23px;border-radius:14px}
.btn.bad{background:rgba(255,100,125,.14);border-color:rgba(255,130,147,.32);color:#ffb2bd}
.btn.mini{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
input[type=text]{
  font:inherit;color:var(--ink);background:rgba(6,13,30,.36);
  border:1px solid rgba(190,210,255,.28);border-radius:12px;padding:11px 14px;width:100%;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.12)
}
input[type=text]::placeholder{color:#8290b2}
.form-group{display:flex;flex-direction:column;gap:7px}
.form-group>label{font-weight:650;font-size:13px;color:#dbe5ff}
/* STATUS BAR */
.status{
  position:sticky;top:0;z-index:5;
  background:rgba(10,17,35,.78);padding:13px 14px 12px;
  display:flex;flex-direction:column;gap:10px;
  border:1px solid rgba(190,210,255,.22);border-radius:17px;
  box-shadow:0 12px 32px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%)
}
.clock{
  font-family:var(--font-mono);font-weight:750;
  background:rgba(122,145,255,.18);color:#eaf0ff;
  border:1px solid rgba(165,184,255,.34);padding:5px 13px;border-radius:999px;font-size:14px
}
.clock.danger{background:rgba(255,83,110,.22);border-color:rgba(255,130,147,.55);color:#ffc1ca;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.68}}
.bar{height:10px;background:rgba(255,255,255,.08);border:1px solid rgba(190,210,255,.2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#718bff,#62d5e9);box-shadow:0 0 12px rgba(105,180,255,.5);transition:width .3s}
.nav{display:flex;flex-wrap:wrap;gap:7px}
.nav button{
  width:34px;height:30px;border-radius:9px;border:1px solid rgba(190,210,255,.27);
  background:rgba(255,255,255,.07);color:#dbe5ff;
  font-family:var(--font-mono);font-size:11px;font-weight:650;padding:0;
  transition:.15s
}
.nav button:hover{background:rgba(255,255,255,.15)}
.nav button.done{background:rgba(75,205,158,.22);border-color:rgba(92,224,174,.48);color:#8ff0c7}
.nav button.cur{background:rgba(117,143,255,.28);border-color:#9eafff;box-shadow:0 0 0 2px rgba(139,156,255,.16),0 0 16px rgba(111,139,255,.22)}
.nav button.expired{background:rgba(255,100,125,.18);border-color:rgba(255,130,147,.45);color:#ffabb8}
.tag{
  display:inline-block;font-family:var(--font-mono);font-size:11px;font-weight:650;
  padding:5px 11px;border-radius:999px;border:1px solid rgba(190,210,255,.25);
  background:rgba(255,255,255,.08);color:#dce7ff
}
.tag.lec{background:rgba(104,200,255,.14);border-color:rgba(104,200,255,.35);color:#9ddfff}
.tag.kind{background:rgba(180,154,255,.15);border-color:rgba(180,154,255,.34);color:#d0bfff}
.tag.time{background:rgba(255,255,255,.1);color:#fff}
.qtext{
  font-size:20px;font-weight:720;line-height:1.42;max-width:66ch;letter-spacing:-.015em;
  padding:17px 18px;border-radius:16px;
  background:linear-gradient(130deg,rgba(255,255,255,.095),rgba(255,255,255,.035));
  border:1px solid rgba(185,207,255,.26);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 8px 24px rgba(0,0,0,.10);
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)
}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  --lc:var(--a);position:relative;display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;
  background:linear-gradient(135deg,rgba(255,255,255,.105),rgba(255,255,255,.035));
  color:var(--ink);border:1px solid rgba(190,210,255,.28);border-radius:17px;padding:15px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 22px rgba(0,0,0,.12);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  transition:transform .18s,border-color .18s,background .18s,box-shadow .18s
}
.opt.l1{--lc:var(--b)}.opt.l2{--lc:var(--c)}.opt.l3{--lc:var(--d)}
.opt:hover:not(:disabled){
  transform:translateY(-2px);border-color:rgba(139,170,255,.7);
  background:linear-gradient(135deg,rgba(124,151,255,.19),rgba(255,255,255,.055));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 12px 28px rgba(0,0,0,.2),0 0 0 1px rgba(139,156,255,.12)
}
.opt:disabled{cursor:default}
.opt .let{
  flex:none;width:38px;height:38px;border-radius:11px;
  border:1px solid color-mix(in srgb,var(--lc) 65%,white);
  background:color-mix(in srgb,var(--lc) 22%,transparent);color:var(--lc);
  display:grid;place-items:center;font-family:var(--font-display);font-size:15px;font-weight:800;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13)
}
.opt .body{flex:1;min-width:0;padding-top:6px;font-weight:550;text-align:left;color:#edf2ff}
.opt:has(pre) .body{padding-top:0}
.opt.sel{
  background:linear-gradient(135deg,rgba(111,139,255,.25),rgba(85,205,220,.10));
  border-color:rgba(148,171,255,.8);box-shadow:0 0 0 2px rgba(139,156,255,.16),0 12px 28px rgba(0,0,0,.18)
}
pre{
  margin:0;font-family:var(--font-mono);font-size:12.5px;line-height:1.6;
  background:var(--code-bg);color:var(--code-ink);border:1px solid rgba(150,178,255,.2);
  border-radius:12px;padding:13px 14px;overflow-x:auto;white-space:pre;tab-size:4
}
pre .k{color:#ff9cbd}pre .s{color:#a9ef9a}pre .n{color:#ffd18a}pre .c{color:#8d9bc2;font-style:italic}
pre.qcode{
  border:1px solid rgba(155,181,255,.34);
  box-shadow:0 9px 24px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.08);
  max-width:100%;position:relative;padding-top:31px;
  background:linear-gradient(145deg,rgba(5,10,24,.96),rgba(16,25,48,.96))
}
pre.qcode::before{content:"main.cpp";position:absolute;top:7px;left:14px;font-size:10px;color:#8494bd;letter-spacing:.06em}
/* RESULTS */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.tile{
  background:linear-gradient(140deg,rgba(255,255,255,.11),rgba(255,255,255,.04));
  border:1px solid rgba(190,210,255,.25);border-radius:16px;padding:14px 16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 8px 22px rgba(0,0,0,.12);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)
}
.tile .big{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:650;margin-top:3px}
.tile:nth-child(2){background:linear-gradient(140deg,rgba(104,200,255,.15),rgba(255,255,255,.035))}
.tile:nth-child(3){background:linear-gradient(140deg,rgba(255,131,181,.15),rgba(255,255,255,.035))}
.tile:nth-child(4){background:linear-gradient(140deg,rgba(180,154,255,.16),rgba(255,255,255,.035))}
.tile.grade{background:linear-gradient(135deg,rgba(139,156,255,.35),rgba(104,200,255,.18));border-color:rgba(165,184,255,.52)}
.tile.grade .big{font-size:48px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 62px;gap:12px;align-items:center;font-size:13px}
.lrow .bar>i.low{background:linear-gradient(90deg,#ff7189,#ff9c9c)}
.lrow .bar>i.high{background:linear-gradient(90deg,#43c99b,#78e8c0)}
.note{
  border:1px solid rgba(190,210,255,.25);padding:12px 16px;
  background:rgba(255,255,255,.07);border-radius:13px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)
}
.note.ok{background:var(--good-soft);border-color:rgba(92,224,174,.3);color:#a8f3d4}
.note.no{background:var(--bad-soft);border-color:rgba(255,130,147,.3);color:#ffc0ca}
.note.wait{background:var(--warn-soft);border-color:rgba(255,209,138,.3);color:#ffe0ad}
.review{
  display:flex;flex-direction:column;gap:8px;padding:13px 14px;
  border:1px solid rgba(190,210,255,.2);border-radius:13px;
  background:rgba(255,255,255,.045);font-size:13px
}
.review:last-child{border-bottom:1px solid rgba(190,210,255,.2)}
.review .ok-tag{color:#6ee7b7;font-weight:750}
.review .no-tag{color:#ff9aa9;font-weight:750}
@media(max-width:600px){
  main{padding:16px 11px 48px;gap:15px}
  .card{padding:17px;border-radius:18px}
  .hero{padding:22px 18px;border-radius:20px}
  .qtext{font-size:18px;padding:14px}
  .opt{padding:12px;gap:11px}
  .opt .let{width:34px;height:34px}
  .score{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lrow{grid-template-columns:minmax(0,1fr) 85px 48px;gap:8px}
  .status{padding:10px;border-radius:14px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}
}

.review pre{margin:6px 0;white-space:pre-wrap;word-break:break-word}
.opt:disabled{cursor:default}

/* ===== v3: красивый студенческий интерфейс ===== */
body:after{content:"";position:fixed;width:560px;height:560px;right:-180px;top:-140px;border-radius:50%;pointer-events:none;z-index:-1;
  background:radial-gradient(circle,rgba(139,156,255,.34),transparent 66%);filter:blur(24px);animation:orb 16s ease-in-out infinite alternate}
@keyframes orb{to{transform:translate(-90px,120px) scale(1.18)}}
main>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(2){animation-delay:.06s}main>*:nth-child(3){animation-delay:.12s}main>*:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.boot{display:flex;flex-direction:column;align-items:center;gap:14px;padding:90px 0;color:var(--muted)}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{background:linear-gradient(100deg,#fff,#d9e4ff 60%,#aef0ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.hero .eyebrow:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#7dffd0;margin-right:9px;box-shadow:0 0 12px #7dffd0;vertical-align:1px}
.card h2{display:flex;align-items:center;gap:10px}
.card h2:before{content:"";width:5px;height:20px;border-radius:4px;background:linear-gradient(#8b9cff,#62d5e9)}
input[type=text]:focus{border-color:#9eafff;box-shadow:0 0 0 3px rgba(139,156,255,.25),inset 0 2px 8px rgba(0,0,0,.12);outline:none}
.btn.primary{box-shadow:0 10px 26px rgba(104,170,255,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.primary.big{width:100%;padding:15px 24px;font-size:16px;letter-spacing:.01em}
.tbar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.tbar>i{display:block;height:100%;background:linear-gradient(90deg,#5ce0ae,#ffd18a 60%,#ff8293);transition:width .5s linear}
.opt:active:not(:disabled){transform:scale(.99)}
.opt.sel .let{background:var(--lc);color:#10172e}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(190,210,255,.16)}
.kv span{color:var(--muted)}
.tile .big{background:linear-gradient(120deg,#fff,#b9c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
@media(max-width:520px){main{padding:18px 12px 60px}.qtext{font-size:18px}.hero{padding:22px 18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== безопасность ===== */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input[type=text]{-webkit-user-select:text;user-select:text}
#shield{position:fixed;inset:0;background:#000;z-index:2147483646;display:none;align-items:center;justify-content:center;color:#6b7390;font-weight:700;text-align:center;padding:20px}
body.shielded #shield{display:flex}
#wm{position:fixed;inset:0;z-index:9990;pointer-events:none;display:none;background-repeat:repeat}
#fsgate{position:fixed;inset:0;z-index:2147483645;background:#05070f;display:none;place-items:center;text-align:center;padding:24px;color:#fff}
#fsgate>div{max-width:420px;display:flex;flex-direction:column;gap:16px}
body.gated #fsgate{display:grid}
@media print{body{display:none!important}}
#startModal{position:fixed;inset:0;z-index:2147483000;background:rgba(3,6,16,.78);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
#startModal .card{max-width:440px;width:100%}
#startModal .row{flex-wrap:nowrap}#startModal .btn.big{flex:1}
</style>

{"l":6,"k":"code","q":"В каком фрагменте операция присваивания записана правильно?","o":["int a = 5, b = 3;\nint sum;\nsum = a + b;\ncout << sum;","int a = 5, b = 3;\nint sum;\na + b = sum;\ncout << sum;","int a = 5, b = 3;\nint sum;\n8 = sum;\ncout << sum;","int a = 5, b = 3;\nint sum;\nsum == a + b;\ncout << sum;"],"e":"Слева от = должен стоять объект (переменная), а не выражение или литерал; == - это сравнение, оно ничего не записывает в sum."},
{"l":6,"k":"code","q":"Какой фрагмент правильно меняет местами значения a и b (должно получиться 7 3)?","o":["int a = 3, b = 7;\nint t = a;\na = b;\nb = t;\ncout << a << \" \" << b;","int a = 3, b = 7;\na = b;\nb = a;\ncout << a << \" \" << b;","int a = 3, b = 7;\nint t = a;\nb = t;\na = b;\ncout << a << \" \" << b;","int a = 3, b = 7;\nint t = a;\na = b;\nb = a;\ncout << a << \" \" << b;"],"e":"Без временной переменной старое значение a теряется; в конце нужно записать в b сохранённое значение t."},
{"l":6,"k":"code","q":"Какой фрагмент компилируется и увеличивает x на 5 (выводит 15)?","o":["int x = 10;\nx += 5;\ncout << x;","int x = 10;\nx =+ 5;\ncout << x;","int x = 10;\nx + 5;\ncout << x;","int x = 10;\nx + = 5;\ncout << x;"],"e":"x =+ 5 присваивает +5; x + 5 вычисляет значение, но не сохраняет его; оператор += пишется без пробела."},
{"l":6,"k":"code","q":"Даны оценки 4, 5 и 5. Какой фрагмент выводит правильный средний балл 4.66667?","o":["int a = 4, b = 5, c = 5;\ndouble avg = (a + b + c) / 3.0;\ncout << avg;","int a = 4, b = 5, c = 5;\ndouble avg = (a + b + c) / 3;\ncout << avg;","int a = 4, b = 5, c = 5;\ndouble avg = a + b + c / 3.0;\ncout << avg;","int a = 4, b = 5, c = 5;\nint avg = (a + b + c) / 3.0;\ncout << avg;"],"e":"Ошибки: целочисленное деление на 3; без скобок делится только c; результат записан в int и теряет дробную часть."},
{"l":6,"k":"code","q":"Нужно перевести 25 градусов Цельсия в Фаренгейты по формуле F = C * 9 / 5 + 32 (ответ 77). Какой фрагмент считает верно?","o":["int c = 25;\ndouble f = c * 9.0 / 5 + 32;\ncout << f;","int c = 25;\ndouble f = c * (9 / 5) + 32;\ncout << f;","int c = 25;\ndouble f = c * 9.0 / (5 + 32);\ncout << f;","int c = 25;\ndouble f = 9 / 5 * c + 32;\ncout << f;"],"e":"9 / 5 для целых равно 1, поэтому получается 57; лишние скобки (5 + 32) меняют порядок действий."},
{"l":6,"k":"code","q":"Нужно перевести 3725 секунд в часы, минуты и секунды (1 2 5). Какой фрагмент компилируется и считает верно?","o":["int total = 3725;\nint h = total / 3600;\nint m = total % 3600 / 60;\nint s = total % 60;\ncout << h << \" \" << m << \" \" << s;","int total = 3725;\nint h = total / 3600;\nint m = total / 60;\nint s = total % 60;\ncout << h << \" \" << m << \" \" << s;","int total = 3725;\nint h = total % 3600;\nint m = total % 3600 / 60;\nint s = total % 60;\ncout << h << \" \" << m << \" \" << s;","double total = 3725;\nint h = total / 3600;\nint m = total % 3600 / 60;\nint s = total % 60;\ncout << h << \" \" << m << \" \" << s;"],"e":"Ошибки: минуты посчитаны без вычитания целых часов (62); часы найдены через остаток вместо деления; операция % не применяется к double."},
{"l":6,"k":"code","q":"Цена товара 200, скидка 10 %. Какой фрагмент компилируется и выводит цену со скидкой 180?","o":["const double DISCOUNT = 0.1;\ndouble price = 200;\ndouble total = price - price * DISCOUNT;\ncout << total;","const int DISCOUNT = 10;\ndouble price = 200;\ndouble total = price - price * (DISCOUNT / 100);\ncout << total;","const double DISCOUNT = 0.1;\ndouble price = 200;\nDISCOUNT = DISCOUNT * price;\ndouble total = price - DISCOUNT;\ncout << total;","const double DISCOUNT = 0.1;\ndouble price = 200;\ndouble total = price - DISCOUNT;\ncout << total;"],"e":"Ошибки: 10 / 100 для целых равно 0; константу нельзя изменять; из цены вычтена доля 0.1, а не сумма скидки."},

{"l":6,"k":"theory","q":"Чем constexpr отличается от const?","o":["Значение constexpr должно быть известно на этапе компиляции","constexpr можно изменять","const работает только с целыми числами","Ничем"],"e":"const можно инициализировать и значением, которое станет известно при выполнении."},
{"l":6,"k":"code","q":"Какой фрагмент с цепочкой присваиваний компилируется и выводит 15?","o":["int a, b, c;\na = b = c = 5;\ncout << a + b + c;","int a, b, c;\n5 = a = b = c;\ncout << a + b + c;","int a, b, c;\na = b = 5 = c;\ncout << a + b + c;","int a;\nb;\nc;\na = b = c = 5;\ncout << a + b + c;"],"e":"Литерал 5 не может стоять слева от =; переменные перечисляют через запятую после одного типа."},
{"l":6,"k":"code","q":"Какой фрагмент компилируется и выводит 7?","o":["int x = 5;\nx++;\n++x;\ncout << x;","int x = 5;\nx+;\n++x;\ncout << x;","int x = 5;\nx++;\n+x+;\ncout << x;","int x = 5;\n5++;\n++x;\ncout << x;"],"e":"Инкремент - два плюса подряд; применять его можно только к переменной."},
{"l":6,"k":"code","q":"Стороны прямоугольника 3 и 4. Какой фрагмент компилируется и выводит периметр и площадь: 14 12?","o":["double a = 3, b = 4;\ndouble p = 2 * (a + b);\ndouble s = a * b;\ncout << p << \" \" << s;","double a = 3, b = 4;\ndouble p = 2 * a + b;\ndouble s = a * b;\ncout << p << \" \" << s;","double a = 3, b = 4;\ndouble p = 2(a + b);\ndouble s = a * b;\ncout << p << \" \" << s;","double a = 3, b = 4;\ndouble p = 2 * (a + b);\ndouble s = a x b;\ncout << p << \" \" << s;"],"e":"Без скобок на 2 умножается только a; знак умножения * обязателен."},
{"l":6,"k":"code","q":"Какой фрагмент компилируется и правильно находит 15 % от 200 (выводит 30)?","o":["int total = 200;\nint percent = 15;\ncout << total * percent / 100;","int total = 200;\nint percent = 15;\ncout << total * (percent / 100);","int total = 200;\nint percent = 15;\ncout << total * percent % 100;","int total = 200;\nint percent = 15;\ncout << total * percent / 100%;"],"e":"15 / 100 для целых равно 0; % - остаток от деления, а не знак процента."},
{"l":6,"k":"code","q":"Пользователь вводит радиус 3. Какой фрагмент компилируется и выводит площадь круга 28.2743?","o":["const double PI = 3.14159;\ndouble r;\ncin >> r;\ncout << PI * r * r;","const double PI = 3.14159;\ndouble r;\ncin >> r;\ncout << PI * (r ^ 2);","const double PI = 3.14159;\ndouble r;\ncin >> r;\ncout << PI * r * 2;","const double PI = 3,14159;\ndouble r;\ncin >> r;\ncout << PI * r * r;"],"e":"В C++ нет оператора возведения в степень (^ - другая операция); r * 2 - это не квадрат; дробная часть пишется через точку."},
{"l":6,"k":"code","q":"Дано n = 537. Какой фрагмент компилируется и выводит цифру десятков и цифру единиц: 37?","o":["int n = 537;\nint last = n % 10;\nint tens = n / 10 % 10;\ncout << tens << last;","int n = 537;\nint last = n % 10;\nint tens = n % 10 / 10;\ncout << tens << last;","int n = 537;\nint last = n / 10;\nint tens = n / 10 % 10;\ncout << tens << last;","int n = 537;\nint last = n mod 10;\nint tens = n / 10 % 10;\ncout << tens << last;"],"e":"Последняя цифра - n % 10; цифра десятков - (n / 10) % 10; оператора mod в C++ нет."},
{"l":6,"k":"code","q":"Даны sum = 14 и count = 4. Какой фрагмент компилируется и выводит среднее 3.5?","o":["int sum = 14, count = 4;\ndouble avg = 1.0 * sum / count;\ncout << avg;","int sum = 14, count = 4;\ndouble avg = sum / count * 1.0;\ncout << avg;","int sum = 14, count = 4;\ndouble avg = sum / count;\ncout << avg;","int sum = 14, count = 4;\ndouble avg = 1,0 * sum / count;\ncout << avg;"],"e":"Вещественным должен стать операнд до деления; sum / count для целых даёт 3."},
{"l":6,"k":"code","q":"Какой фрагмент с составными операциями компилируется и выводит 1?","o":["int x = 20;\nx -= 5;\nx /= 3;\nx %= 4;\ncout << x;","int x = 20;\nx -= 5;\nx =/ 3;\nx %= 4;\ncout << x;","int x = 20;\nx -= 5;\nx /= 3;\nx % = 4;\ncout << x;","int x = 20;\nx =- 5;\nx /= 3;\nx %= 4;\ncout << x;"],"e":"Составные операции пишут слитно и знаком операции вперёд: -=, /=, %=; запись =- присваивает минус пять."},
{"l":6,"k":"out","q":"Что выведет этот код?","o":["14 20","20 20","14 14","20 14"],"e":"Умножение выполняется раньше сложения; скобки меняют порядок.","c":"int a = 2 + 3 * 4;\nint b = (2 + 3) * 4;\ncout << a << \" \" << b;"},

{"l":6,"k":"out","q":"Что выведет этот код?","o":["12","12.5","5","13"],"e":"10 / 4 = 2 (целое деление), 10 + 2 = 12.","c":"int x = 10;\nx = x + x / 4;\ncout << x;"},
{"l":6,"k":"out","q":"Что выведет этот код?","o":["8","9","4.5","4"],"e":"9 / 2 = 4 (целые), d = 4.0, 4.0 * 2 = 8.","c":"double d = 9 / 2;\ncout << d * 2;"},

{"l":7,"k":"theory","q":"Какой спецификатор формата используют в scanf для ввода значения типа double?","o":["%lf","%d","%f","%c"],"e":"В scanf для double нужен %lf; %f - для float, %d - для int, %c - для символа."},
{"l":7,"k":"theory","q":"Зачем перед именем переменной в scanf(\"%d\", &a) ставят знак &?","o":["Чтобы передать адрес переменной, по которому scanf запишет введённое значение","Чтобы вывести значение переменной на экран","Чтобы преобразовать переменную к целому типу","Это логическая операция И, которая проверяет правильность ввода"],"e":"scanf должен знать адрес памяти, куда записать значение."},
{"l":7,"k":"code","q":"Какая программа компилируется и правильно выводит x = 10?","o":["#include <cstdio>\n\nint main() {\n    int x = 10;\n    printf(\"x = %d\\n\", x);\n    return 0;\n}","int main() {\n    int x = 10;\n    printf(\"x = %d\\n\", x);\n    return 0;\n}","#include <cstdio>\n\nint main() {\n    int x = 10;\n    printf(\"x = %f\\n\", x);\n    return 0;\n}","#include <cstdio>\n\nint main() {\n    int x = 10;\n    print(\"x = %d\\n\", x);\n    return 0;\n}"],"e":"Ошибки: не подключён <cstdio>; для int указан формат %f; функция называется printf."},
{"l":7,"k":"code","q":"Какой фрагмент правильно считывает целое число и выводит его?","o":["int a;\nscanf(\"%d\", &a);\nprintf(\"%d\\n\", a);","int a;\nscanf(\"%d\", a);\nprintf(\"%d\\n\", a);","int a;\nscanf(\"%f\", &a);\nprintf(\"%d\\n\", a);","int a;\nscanf(%d, &a);\nprintf(\"%d\\n\", a);"],"e":"Ошибки: забыт знак & перед переменной; для int указан формат %f; строка формата записана без кавычек."},
{"l":7,"k":"code","q":"Какой фрагмент правильно считывает число типа double и выводит его с двумя знаками после точки?","o":["double d;\nscanf(\"%lf\", &d);\nprintf(\"%.2f\\n\", d);","double d;\nscanf(\"%f\", &d);\nprintf(\"%.2f\\n\", d);","double d;\nscanf(\"%d\", &d);\nprintf(\"%.2f\\n\", d);","double d;\nscanf(\"%lf\", d);\nprintf(\"%.2f\\n\", d);"],"e":"Для double в scanf нужен именно %lf и адрес переменной (&d); %f и %d записывают данные неверно."},
{"l":7,"k":"code","q":"Дано double pi = 3.14159;. Какой фрагмент выводит 3.14?","o":["double pi = 3.14159;\nprintf(\"%.2f\\n\", pi);","double pi = 3.14159;\nprintf(\"%2f\\n\", pi);","double pi = 3.14159;\nprintf(\"%.2d\\n\", pi);","double pi = 3.14159;\nprintf(\"%f.2\\n\", pi);"],"e":"Точность задают как %.2f; %2f - это ширина поля, %d - формат для int, а .2 после %f выводится как обычный текст."},
{"l":7,"k":"code","q":"Дано int p = 50;. Какой фрагмент компилируется и выводит строку Progress 50% ?","o":["int p = 50;\nprintf(\"Progress %d%%\\n\", p);","int p = 50;\nprintf(\"Progress p%%\\n\");","int p = 50;\nprintf(\"Progress %%d\\n\", p);","int p = 50;\nprintf(\"Progress %d%%\\n\" p);"],"e":"Значение подставляется вместо %d, а знак процента выводится как %%; запись %%d печатает текст %d; между строкой формата и аргументом нужна запятая."},
{"l":7,"k":"code","q":"Пользователь вводит число, нажимает Enter и вводит знак операции. Какой фрагмент правильно считывает оба значения?","o":["int n;\nchar op;\nscanf(\"%d\", &n);\nscanf(\" %c\", &op);\nprintf(\"%d %c\\n\", n, op);","int n;\nchar op;\nscanf(\"%d\", &n);\nscanf(\"%c\", &op);\nprintf(\"%d %c\\n\", n, op);","int n;\nchar op;\nscanf(\"%d\", &n);\nscanf(\" %c\", op);\nprintf(\"%d %c\\n\", n, op);","int n;\nchar op;\nscanf(\"%d\", &n);\nscanf(\" %d\", &op);\nprintf(\"%d %c\\n\", n, op);"],"e":"%c без пробела считывает оставшийся в буфере Enter; пробел перед %c пропускает его. Также нужны & и формат %c для char."},
{"l":7,"k":"code","q":"Какой фрагмент правильно считывает два целых числа и выводит их сумму?","o":["int a, b;\nscanf(\"%d %d\", &a, &b);\nprintf(\"%d\\n\", a + b);","int a, b;\nscanf(\"%d %d\", &a);\nprintf(\"%d\\n\", a + b);","int a, b;\nscanf(\"%d %d\", &a, &b);\nprintf(\"%d\\n\", a, b);","int a, b;\nscanf(\"%d %d\", a, b);\nprintf(\"%d\\n\", a + b);"],"e":"Количество спецификаторов должно совпадать с количеством аргументов; в scanf передают адреса (&a, &b)."},
{"l":7,"k":"code","q":"Какой фрагмент правильно считывает слово в массив символов и выводит приветствие?","o":["char name[20];\nscanf(\"%19s\", name);\nprintf(\"Hello, %s!\\n\", name);","char name;\nscanf(\"%19s\", &name);\nprintf(\"Hello, %s!\\n\", name);","char name[20];\nscanf(\"%19s\", name);\nprintf(\"Hello, %d!\\n\", name);","char name[20];\nscanf(\"%19s\", name);\nprintf(\"Hello, name!\\n\");"],"e":"Для слова нужен массив char, а не один символ; строку выводят через %s; имя переменной внутри кавычек выводится как обычный текст."},
{"l":7,"k":"theory","q":"Какой спецификатор формата используют для вывода одного символа?","o":["%c","%s","%d","%f"],"e":"%c - символ, %s - строка, %d - целое, %f - вещественное."},
{"l":7,"k":"theory","q":"Какой спецификатор формата используют для вывода C-строки?","o":["%s","%c","%d","%lf"],"e":"%s выводит строку до нулевого символа."},

{"l":7,"k":"code","q":"Какой фрагмент компилируется и выводит 3 + 4 = 7?","o":["int a = 3, b = 4;\nprintf(\"%d + %d = %d\\n\", a, b, a + b);","int a = 3, b = 4;\nprintf(\"%d + %d = %d\\n\", a + b, a, b);","int a = 3, b = 4;\nprintf(\"%d + %d = %d\\n\" a, b, a + b);","int a = 3, b = 4;\nprintf(%d + %d = %d\\n, a, b, a + b);"],"e":"Аргументы подставляются по порядку спецификаторов; после строки формата нужна запятая; строка формата пишется в кавычках."},
{"l":7,"k":"code","q":"Дано avg = 4.6667. Какой фрагмент выводит Average: 4.7?","o":["double avg = 4.6667;\nprintf(\"Average: %.1f\\n\", avg);","double avg = 4.6667;\nprintf(\"Average: %.1d\\n\", avg);","double avg = 4.6667;\nprintf(\"Average: %1.f\\n\", avg);","double avg = 4.6667;\nprintf(\"Average: %f.1\\n\", avg);"],"e":"Точность пишут после точки: %.1f; %d - формат для целых; %1.f выводит число без дробной части."},
{"l":7,"k":"code","q":"Пользователь вводит 2 + 3. Какой фрагмент компилируется и выводит 5?","o":["int a, b;\nchar op;\nscanf(\"%d %c %d\", &a, &op, &b);\nif (op == '+') printf(\"%d\\n\", a + b);","int a, b;\nchar op;\nscanf(\"%d %c %d\", &a, op, &b);\nif (op == '+') printf(\"%d\\n\", a + b);","int a, b;\nchar op;\nscanf(\"%d %c %d\", &a, &op, &b);\nif (op == \"+\") printf(\"%d\\n\", a + b);","int a, b;\nchar op;\nscanf(\"%d %d %d\", &a, &op, &b);\nif (op == '+') printf(\"%d\\n\", a + b);"],"e":"В scanf передают адреса всех переменных; символ сравнивают с литералом в одинарных кавычках; для знака операции нужен формат %c."},
{"l":7,"k":"code","q":"Какой фрагмент компилируется и правильно выводит число 5000000000?","o":["long long big = 5000000000LL;\nprintf(\"%lld\\n\", big);","long long big = 5000000000LL;\nprintf(\"%d\\n\", big);","long long big = 5000000000LL;\nprintf(\"%ll\\n\", big);","long long big = 5000000000LL;\nprintf(\"%lld\\n\" big);"],"e":"Для long long нужен формат %lld; между строкой формата и аргументом ставится запятая."},
{"l":7,"k":"code","q":"Пользователь вводит abc вместо числа. Какой фрагмент компилируется и выводит bad input?","o":["int x;\nif (scanf(\"%d\", &x) == 1) printf(\"ok %d\\n\", x);\nelse printf(\"bad input\\n\");","int x;\nif (scanf(\"%d\", &x) = 1) printf(\"ok %d\\n\", x);\nelse printf(\"bad input\\n\");","int x;\nif (scanf(\"%d\", &x) == 0) printf(\"ok %d\\n\", x);\nelse printf(\"bad input\\n\");","int x;\nif (scanf(\"%d\", &x) == \"1\") printf(\"ok %d\\n\", x);\nelse printf(\"bad input\\n\");"],"e":"scanf возвращает количество считанных значений: при удачном вводе одного числа это 1, при неудаче 0; результат сравнивают с числом, а не со строкой."},
{"l":7,"k":"code","q":"Пользователь вводит 2.5 и 4. Какой фрагмент выводит площадь 10.00?","o":["double w, h;\nscanf(\"%lf %lf\", &w, &h);\nprintf(\"%.2f\\n\", w * h);","double w, h;\nscanf(\"%f %f\", &w, &h);\nprintf(\"%.2f\\n\", w * h);","double w, h;\nscanf(\"%lf %lf\", w, h);\nprintf(\"%.2f\\n\", w * h);","double w, h;\nscanf(\"%lf %lf\", &w, &h);\nprintf(\"%.2f\\n\", w, h);"],"e":"Для double в scanf нужен %lf и адреса переменных; в printf один спецификатор - одно значение."},
{"l":7,"k":"code","q":"Пользователь вводит Ali 18. Какой фрагмент компилируется и выводит Ali is 18?","o":["char name[20];\nint age;\nscanf(\"%19s %d\", name, &age);\nprintf(\"%s is %d\\n\", name, age);","char name[20];\nint age;\nscanf(\"%19s %d\", name, &age);\nprintf(\"%s is %d\\n\", age, name);","char name[20];\nint age;\nscanf(\"%19s %d\", name, age);\nprintf(\"%s is %d\\n\", name, age);","char name[20] int age;\nscanf(\"%19s %d\", name, &age);\nprintf(\"%s is %d\\n\", name, age);"],"e":"Порядок аргументов должен совпадать с порядком спецификаторов; для int в scanf нужен &; объявление заканчивается точкой с запятой."},
{"l":7,"k":"code","q":"Какой фрагмент компилируется и выводит Name: \"Ali\" вместе с кавычками?","o":["printf(\"Name: \\\"%s\\\"\\n\", \"Ali\");","printf(\"Name: \"%s\"\\n\", \"Ali\");","printf(\"Name: \\\"%s\\\"\\n\", Ali);","printf(\"Name: /\"%s/\"\\n\", \"Ali\");"],"e":"Кавычки внутри строки формата пишут как \\\"; строковый аргумент тоже пишется в кавычках."},

{"l":8,"k":"theory","q":"Какое выражение по закону де Моргана равносильно !(a && b)?","o":["!a || !b","!a && !b","a || b","!(a || b)"],"e":"При отрицании И заменяется на ИЛИ, и отрицается каждое условие."},
{"l":8,"k":"theory","q":"Вычисляется условие a != 0 && b / a > 2 при a = 0. Что произойдёт?","o":["Вторая часть не вычисляется, результат false - это короткое вычисление","Произойдёт деление на ноль","Сначала вычисляется b / a > 2, затем a != 0","Программа не скомпилируется"],"e":"Если левая часть && равна false, правая часть не вычисляется."},
{"l":8,"k":"code","q":"Дано int x = 3. Какой фрагмент компилируется и выводит other?","o":["int x = 3;\nif (x == 5) cout << \"five\";\nelse cout << \"other\";","int x = 3;\nif (x = 5) cout << \"five\";\nelse cout << \"other\";","int x = 3;\nif (x === 5) cout << \"five\";\nelse cout << \"other\";","int x = 3;\nif x == 5 cout << \"five\";\nelse cout << \"other\";"],"e":"= - это присваивание (условие становится истинным), сравнение - это ==; оператора === в C++ нет; условие пишут в круглых скобках."},
{"l":8,"k":"code","q":"Дано int x = 150. Какой фрагмент правильно проверяет, что x лежит в диапазоне от 1 до 100 (должен вывести no)?","o":["int x = 150;\nif (x >= 1 && x <= 100) cout << \"yes\";\nelse cout << \"no\";","int x = 150;\nif (1 <= x <= 100) cout << \"yes\";\nelse cout << \"no\";","int x = 150;\nif (x >= 1 || x <= 100) cout << \"yes\";\nelse cout << \"no\";","int x = 150;\nif (x >= 1 && <= 100) cout << \"yes\";\nelse cout << \"no\";"],"e":"Запись 1 <= x <= 100 сравнивает с 100 результат первого сравнения (0 или 1); с || условие истинно всегда; в каждом сравнении нужны оба операнда."},
{"l":8,"k":"code","q":"Дано int x = 5. Какой фрагмент правильно проверяет, что x находится ВНЕ отрезка от 10 до 20 (должен вывести outside)?","o":["int x = 5;\nif (x < 10 || x > 20) cout << \"outside\";\nelse cout << \"inside\";","int x = 5;\nif (x < 10 && x > 20) cout << \"outside\";\nelse cout << \"inside\";","int x = 5;\nif (x < 10 | | x > 20) cout << \"outside\";\nelse cout << \"inside\";","int x = 5;\nif (!(x < 10 || x > 20)) cout << \"outside\";\nelse cout << \"inside\";"],"e":"Число не может быть одновременно меньше 10 и больше 20; оператор || пишут без пробела; лишнее отрицание меняет смысл на противоположный."},
{"l":8,"k":"code","q":"Какой фрагмент компилируется и правильно определяет, что 0.1 + 0.2 примерно равно 0.3 (выводит equal)?","o":["double a = 0.1 + 0.2;\ndouble eps = 1e-9;\nif (fabs(a - 0.3) < eps) cout << \"equal\";\nelse cout << \"different\";","double a = 0.1 + 0.2;\nif (a == 0.3) cout << \"equal\";\nelse cout << \"different\";","double a = 0.1 + 0.2;\ndouble eps = 1e-9;\nif (fabs(a - 0.3) > eps) cout << \"equal\";\nelse cout << \"different\";","double a = 0.1 + 0.2;\ndouble eps = 1e-9;\nif (fabs(a - 0.3) < eps) cout << \"equal\"\nelse cout << \"different\";"],"e":"Дробные числа хранятся приближённо, поэтому == даёт false; сравнивают модуль разности с малым eps, знак должен быть <."},
{"l":8,"k":"code","q":"Даны login = \"admin\" и password = \"0000\". Вход разрешён только при логине admin и пароле 1234. Какой фрагмент компилируется и выводит denied?","o":["string login = \"admin\", password = \"0000\";\nif (login == \"admin\" && password == \"1234\") cout << \"ok\";\nelse cout << \"denied\";","string login = \"admin\", password = \"0000\";\nif (login == \"admin\" || password == \"1234\") cout << \"ok\";\nelse cout << \"denied\";","string login = \"admin\", password = \"0000\";\nif (login == 'admin' && password == '1234') cout << \"ok\";\nelse cout << \"denied\";","string login = \"admin\", password = \"0000\";\nif (login = \"admin\" && password = \"1234\") cout << \"ok\";\nelse cout << \"denied\";"],"e":"Оба условия должны выполняться одновременно (&&); строки пишут в двойных кавычках и сравнивают через ==."},
{"l":8,"k":"code","q":"Дано int x = -3. Какой фрагмент компилируется и правильно проверяет, что x НЕ положительное (выводит not positive)?","o":["int x = -3;\nif (!(x > 0)) cout << \"not positive\";\nelse cout << \"positive\";","int x = -3;\nif (!x > 0) cout << \"not positive\";\nelse cout << \"positive\";","int x = -3;\nif (x !> 0) cout << \"not positive\";\nelse cout << \"positive\";","int x = -3;\nif (!(x < 0)) cout << \"not positive\";\nelse cout << \"positive\";"],"e":"Операция ! выполняется раньше сравнения, поэтому отрицаемое условие берут в скобки; оператора !> не существует."},
{"l":8,"k":"code","q":"Дано int x = 8. Какой фрагмент компилируется и правильно проверяет, что число чётное и положительное (выводит yes)?","o":["int x = 8;\nif (x % 2 == 0 && x > 0) cout << \"yes\";\nelse cout << \"no\";","int x = 8;\nif (x % 2 = 0 && x > 0) cout << \"yes\";\nelse cout << \"no\";","int x = 8;\nif (x / 2 == 0 && x > 0) cout << \"yes\";\nelse cout << \"no\";","int x = 8;\nif (x % 2 == 0 & & x > 0) cout << \"yes\";\nelse cout << \"no\";"],"e":"Чётность проверяют остатком x % 2 == 0, а не делением; = вместо == и пробел внутри && - ошибки."},

{"l":8,"k":"code","q":"Дано age = 25. Какой фрагмент компилируется и правильно проверяет, что возраст от 13 до 19 (выводит 0)?","o":["int age = 25;\nbool teen = age >= 13 && age <= 19;\ncout << teen;","int age = 25;\nbool teen = age => 13 && age <= 19;\ncout << teen;","int age = 25;\nbool teen = 13 <= age <= 19;\ncout << teen;","int age = 25;\nbool teen = age >= 13 && age =< 19;\ncout << teen;"],"e":"Операторы пишутся >= и <=; двойное неравенство сравнивает с 19 результат первого сравнения (0 или 1)."},
{"l":8,"k":"code","q":"Даны a = 3 и b = 5. Какой фрагмент компилируется и выводит different?","o":["int a = 3, b = 5;\nif (a != b) cout << \"different\";\nelse cout << \"same\";","int a = 3, b = 5;\nif (a <> b) cout << \"different\";\nelse cout << \"same\";","int a = 3, b = 5;\nif (a =! b) cout << \"different\";\nelse cout << \"same\";","int a = 3, b = 5;\nif (a !== b) cout << \"different\";\nelse cout << \"same\";"],"e":"«Не равно» пишется !=; запись =! присваивает a значение !b."},
{"l":8,"k":"code","q":"Права выдают с 18 лет и только при наличии документа. Даны age = 20, hasId = false. Какой фрагмент компилируется и выводит no?","o":["int age = 20;\nbool hasId = false;\nif (age >= 18 && hasId) cout << \"yes\";\nelse cout << \"no\";","int age = 20;\nbool hasId = false;\nif (age >= 18 || hasId) cout << \"yes\";\nelse cout << \"no\";","int age = 20;\nbool hasId = false;\nif (age >= 18 && hasId = true) cout << \"yes\";\nelse cout << \"no\";","int age = 20;\nbool hasId = \"false\";\nif (age >= 18 && hasId) cout << \"yes\";\nelse cout << \"no\";"],"e":"Оба условия должны выполняться (&&); строка \"false\" в кавычках - это не false, а ненулевой адрес, то есть true."},
{"l":8,"k":"code","q":"Какой фрагмент компилируется и правильно определяет, является ли введённый символ цифрой?","o":["char c;\ncin >> c;\nif (c >= '0' && c <= '9') cout << \"digit\";\nelse cout << \"other\";","char c;\ncin >> c;\nif (c >= 0 && c <= 9) cout << \"digit\";\nelse cout << \"other\";","char c;\ncin >> c;\nif (c >= \"0\" && c <= \"9\") cout << \"digit\";\nelse cout << \"other\";","char c;\ncin >> c;\nif ('0' <= c <= '9') cout << \"digit\";\nelse cout << \"other\";"],"e":"Символы-цифры сравнивают с '0' и '9' в одинарных кавычках; числа 0 и 9 - это другие коды; двойное неравенство всегда истинно."},
{"l":8,"k":"code","q":"Даны a = 5, b = -1. Какой фрагмент компилируется и правильно проверяет, что НЕ оба числа положительные (выводит not both)?","o":["int a = 5, b = -1;\nif (!(a > 0 && b > 0)) cout << \"not both\";\nelse cout << \"both\";","int a = 5, b = -1;\nif (!(a > 0) && !(b > 0)) cout << \"not both\";\nelse cout << \"both\";","int a = 5, b = -1;\nif (!a > 0 && b > 0) cout << \"not both\";\nelse cout << \"both\";","int a = 5, b = -1;\nif (!(a > 0 && b > 0) cout << \"not both\"; else cout << \"both\";"],"e":"По закону де Моргана !(A && B) равно !A || !B, а не !A && !B; отрицание всего условия требует скобок."},
{"l":8,"k":"code","q":"Какой фрагмент компилируется и выводит строку, которая идёт раньше по алфавиту (apple)?","o":["string a = \"apple\", b = \"banana\";\nif (a < b) cout << a;\nelse cout << b;","string a = \"apple\", b = \"banana\";\nif (a - b < 0) cout << a;\nelse cout << b;","string a = \"apple\", b = \"banana\";\nif (a > b) cout << a;\nelse cout << b;","string a = 'apple', b = 'banana';\nif (a < b) cout << a;\nelse cout << b;"],"e":"Строки string сравнивают операторами < и >; вычитать строки нельзя; строки пишут в двойных кавычках."},
{"l":8,"k":"code","q":"Даны a = 0, b = 10. Какой фрагмент безопасен при a = 0 и выводит skip?","o":["int a = 0, b = 10;\nif (a != 0 && b / a > 2) cout << \"big\";\nelse cout << \"skip\";","int a = 0, b = 10;\nif (b / a > 2 && a != 0) cout << \"big\";\nelse cout << \"skip\";","int a = 0, b = 10;\nif (a != 0 & b / a > 2) cout << \"big\";\nelse cout << \"skip\";","int a = 0, b = 10;\nif (a != 0 || b / a > 2) cout << \"big\";\nelse cout << \"skip\";"],"e":"Проверка a != 0 должна стоять первой и соединяться через &&: тогда при a = 0 деление не выполняется. Одиночный & и || вычисляют деление на ноль."},

{"l":9,"k":"theory","q":"Какое условие удобнее записать через if-else, а не через switch?","o":["Проверку диапазона, например score >= 80","Выбор пункта меню по номеру 1, 2, 3","Выбор дня недели по номеру","Выбор операции по символу +, -, *, /"],"e":"switch сравнивает выражение с фиксированными константами; диапазоны и сложные условия записывают через if-else."},
{"l":9,"k":"code","q":"В каком фрагменте оператор if-else записан без синтаксических ошибок?","o":["int x = 4;\nif (x > 0) {\n    cout << \"positive\";\n} else {\n    cout << \"not positive\";\n}","int x = 4;\nif (x > 0); {\n    cout << \"positive\";\n} else {\n    cout << \"not positive\";\n}","int x = 4;\nif x > 0 {\n    cout << \"positive\";\n} else {\n    cout << \"not positive\";\n}","int x = 4;\nif (x > 0) then {\n    cout << \"positive\";\n} else {\n    cout << \"not positive\";\n}"],"e":"Ошибки: точка с запятой после условия отрывает else от if; условие должно быть в круглых скобках; слова then в C++ нет."},
{"l":9,"k":"code","q":"Дано int x = -1. Какой фрагмент компилируется и при таком x ничего не выводит?","o":["int x = -1;\nif (x > 0) {\n    cout << \"positive\";\n    cout << \" number\";\n}","int x = -1;\nif (x > 0)\n    cout << \"positive\";\n    cout << \" number\";","int x = -1;\nif (x > 0); {\n    cout << \"positive\";\n    cout << \" number\";\n}","int x = -1;\nif (x > 0) {\n    cout << \"positive\";\n    cout << \" number\";"],"e":"Без фигурных скобок к if относится только один оператор; ; после условия делает тело if пустым; блок должен быть закрыт."},
{"l":9,"k":"code","q":"Дано int score = 85. Какой фрагмент компилируется и выводит оценку B (90 и выше - A, 80 и выше - B, 70 и выше - C, иначе D)?","o":["int score = 85;\nif (score >= 90) cout << \"A\";\nelse if (score >= 80) cout << \"B\";\nelse if (score >= 70) cout << \"C\";\nelse cout << \"D\";","int score = 85;\nif (score >= 70) cout << \"C\";\nelse if (score >= 80) cout << \"B\";\nelse if (score >= 90) cout << \"A\";\nelse cout << \"D\";","int score = 85;\nif (score >= 90) cout << \"A\";\nif (score >= 80) cout << \"B\";\nif (score >= 70) cout << \"C\";\nelse cout << \"D\";","int score = 85;\nif (score >= 90) cout << \"A\";\nelse (score >= 80) cout << \"B\";\nelse (score >= 70) cout << \"C\";\nelse cout << \"D\";"],"e":"Ошибки: проверки идут от меньшей границы, и первая же срабатывает; без else выполняются несколько ветвей (BC); после else условие пишут только через else if."},
{"l":9,"k":"code","q":"Даны a = 3, b = 5, c = 9. Какой фрагмент компилируется и находит максимум из трёх чисел (9)?","o":["int a = 3, b = 5, c = 9;\nint mx = a;\nif (b > mx) mx = b;\nif (c > mx) mx = c;\ncout << mx;","int a = 3, b = 5, c = 9;\nint mx = a;\nif (b > mx) mx = b;\nelse if (c > mx) mx = c;\ncout << mx;","int a = 3, b = 5, c = 9;\nint mx = a;\nif (c > mx) mx = c;\nif (b > a) mx = b;\ncout << mx;","int a = 3, b = 5, c = 9;\nint mx = a;\nif (b > mx) mx = b\nif (c > mx) mx = c;\ncout << mx;"],"e":"Ошибки: из-за else число c не проверяется, если b > a; b сравнивается с a, а не с текущим максимумом; пропущена точка с запятой."},
{"l":9,"k":"code","q":"Дано int day = 1. Какой фрагмент компилируется и выводит только Mon?","o":["int day = 1;\nswitch (day) {\n    case 1: cout << \"Mon\"; break;\n    case 2: cout << \"Tue\"; break;\n    default: cout << \"?\";\n}","int day = 1;\nswitch (day) {\n    case 1: cout << \"Mon\";\n    case 2: cout << \"Tue\";\n    default: cout << \"?\";\n}","int day = 1;\nswitch (day) {\n    case 1; cout << \"Mon\"; break;\n    case 2; cout << \"Tue\"; break;\n    default; cout << \"?\";\n}","int day = 1;\nswitch day {\n    case 1: cout << \"Mon\"; break;\n    case 2: cout << \"Tue\"; break;\n    default: cout << \"?\";\n}"],"e":"Ошибки: без break выводится MonTue?; после метки case ставят двоеточие; выражение switch пишут в круглых скобках."},
{"l":9,"k":"code","q":"Какой фрагмент калькулятора со switch компилируется?","o":["char op = '+';\nint a = 6, b = 2;\nswitch (op) {\n    case '+': cout << a + b; break;\n    case '-': cout << a - b; break;\n    default: cout << \"error\";\n}","string op = \"+\";\nint a = 6, b = 2;\nswitch (op) {\n    case \"+\": cout << a + b; break;\n    case \"-\": cout << a - b; break;\n    default: cout << \"error\";\n}","char op = '+';\nint a = 6, b = 2;\nswitch (op) {\n    case \"+\": cout << a + b; break;\n    case \"-\": cout << a - b; break;\n    default: cout << \"error\";\n}","char op = '+';\nint a = 6, b = 2;\nswitch (op) {\n    case +: cout << a + b; break;\n    case -: cout << a - b; break;\n    default: cout << \"error\";\n}"],"e":"switch работает с целыми и символьными значениями, но не со string; метки для char пишут в одинарных кавычках."},
{"l":9,"k":"code","q":"Даны a = 10, b = 0. Какой фрагмент компилируется и защищает программу от деления на ноль (выводит error)?","o":["int a = 10, b = 0;\nif (b != 0) cout << a / b;\nelse cout << \"error\";","int a = 10, b = 0;\nif (b = 0) cout << \"error\";\nelse cout << a / b;","int a = 10, b = 0;\ncout << a / b;\nif (b == 0) cout << \"error\";","int a = 10, b = 0;\nif (b != 0) cout << a / b\nelse cout << \"error\";"],"e":"Ошибки: b = 0 - присваивание, условие ложно, и выполняется деление; проверка стоит после деления; пропущена точка с запятой."},
{"l":9,"k":"code","q":"Какой фрагмент компилируется и правильно определяет високосный год (1900 - нет, 2000 - да, 2024 - да)?","o":["int year;\ncin >> year;\nif ((year % 4 == 0 && year % 100 != 0) || year % 400 == 0)\n    cout << \"leap\";\nelse\n    cout << \"not leap\";","int year;\ncin >> year;\nif (year % 4 == 0)\n    cout << \"leap\";\nelse\n    cout << \"not leap\";","int year;\ncin >> year;\nif (year % 4 == 0 && year % 100 != 0 && year % 400 == 0)\n    cout << \"leap\";\nelse\n    cout << \"not leap\";","int year;\ncin >> year;\nif ((year % 4 = 0 && year % 100 != 0) || year % 400 = 0)\n    cout << \"leap\";\nelse\n    cout << \"not leap\";"],"e":"Год високосный, если делится на 4 и не делится на 100, либо делится на 400; одно условие % 4 ошибается на 1900, три && - на 2000 и 2024."},
{"l":9,"k":"theory","q":"К какому if относится else, если фигурных скобок нет?","o":["К ближайшему предыдущему if","К самому первому if","Ко всем if сразу","Это ошибка компиляции"],"e":"Чтобы изменить привязку, используют фигурные скобки."},
{"l":9,"k":"theory","q":"Каким должно быть значение в метке case?","o":["Константой","Переменной","Условием со знаком сравнения","Строкой string"],"e":"Метки case - целочисленные или символьные константы."},
{"l":9,"k":"theory","q":"Когда выполняется ветвь default в switch?","o":["Когда ни одна метка case не совпала","Всегда первой","Всегда последней, после любой ветви","Только при ошибке"],"e":"default - вариант «во всех остальных случаях»."},
{"l":9,"k":"theory","q":"Сколько ветвей выполнится в цепочке if - else if - else?","o":["Ровно одна","Все, условия которых истинны","Ни одной","Всегда две"],"e":"После первой сработавшей ветви остальные пропускаются."},
{"l":9,"k":"code","q":"Дано x = 5. Какой фрагмент компилируется и выводит только plus?","o":["int x = 5;\nif (x > 0) cout << \"plus\";\nelse if (x < 0) cout << \"minus\";\nelse cout << \"zero\";","int x = 5;\nif (x > 0) cout << \"plus\";\nelseif (x < 0) cout << \"minus\";\nelse cout << \"zero\";","int x = 5;\nif (x > 0) cout << \"plus\";\nelse (x < 0) cout << \"minus\";\nelse cout << \"zero\";","int x = 5;\nif (x > 0) cout << \"plus\";\nif (x < 0) cout << \"minus\";\nelse cout << \"zero\";"],"e":"else if пишется двумя словами; после else условие без if недопустимо; без else второй if проверяется отдельно, и выводится pluszero."},
{"l":9,"k":"code","q":"Дано m = 1 (номер месяца). Какой фрагмент компилируется и выводит только winter?","o":["int m = 1;\nswitch (m) {\n    case 12: case 1: case 2: cout << \"winter\";\n    break;\n    case 3: case 4: case 5: cout << \"spring\";\n    break;\n    default: cout << \"other\";\n}","int m = 1;\nswitch (m) {\n    case 12, 1, 2: cout << \"winter\";\n    break;\n    case 3: case 4: case 5: cout << \"spring\";\n    break;\n    default: cout << \"other\";\n}","int m = 1;\nswitch (m) {\n    case 12: case 1: case 2: cout << \"winter\";\n    case 3: case 4: case 5: cout << \"spring\";\n    break;\n    default: cout << \"other\";\n}","int m = 1;\nswitch (m) {\n    case 12: case 1: case 2: cout << \"winter\";\n    break;\n    case 3: case 4: case 5: cout << \"spring\";\n    break;\n    else: cout << \"other\";\n}"],"e":"Несколько значений записывают отдельными метками case; без break выполнение проваливается в spring; ветвь «иначе» в switch называется default."},
{"l":9,"k":"code","q":"Дано c = 'e'. Какой фрагмент компилируется и выводит только vowel?","o":["char c = 'e';\nswitch (c) {\n    case 'a': case 'e': case 'i': case 'o': case 'u': cout << \"vowel\";\n    break;\n    default: cout << \"consonant\";\n}","char c = 'e';\nswitch (c) {\n    case 'a': case \"e\": case 'i': case 'o': case 'u': cout << \"vowel\";\n    break;\n    default: cout << \"consonant\";\n}","char c = 'e';\nswitch (c) {\n    case 'a' || 'e': case 'i': case 'o': case 'u': cout << \"vowel\";\n    break;\n    default: cout << \"consonant\";\n}","char c = 'e';\nswitch (c) {\n    case 'a': case 'e': case 'i': case 'o': case 'u': cout << \"vowel\";\n    default: cout << \"consonant\";\n}"],"e":"Метки для char - в одинарных кавычках; 'a' || 'e' - это логическое выражение, равное 1; без break выполнится и default."},
{"l":9,"k":"code","q":"Дано age = 5. Билет: до 7 лет бесплатно, до 60 лет 100, иначе 50. Какой фрагмент компилируется и выводит 0?","o":["int age = 5;\nint price;\nif (age < 7) price = 0;\nelse if (age < 60) price = 100;\nelse price = 50;\ncout << price;","int age = 5;\nint price;\nif (age < 7) price = 0;\nif (age < 60) price = 100;\nelse price = 50;\ncout << price;","int age = 5;\nint price;\nif (age < 7) price = 0;\nelse if (age < 60) price = 100;\nprice = 50;\ncout << price;","int age = 5;\nif (age < 7) price = 0;\nelse if (age < 60) price = 100;\nelse price = 50;\ncout << price;"],"e":"Без else второе условие проверяется заново и заменяет цену; без последнего else цена всегда 50; переменную нужно объявить."},
{"l":9,"k":"code","q":"Какой фрагмент со switch компилируется?","o":["int n = 2;\nswitch (n) {\n    case 1: cout << \"one\";\n    break;\n    case 2: cout << \"two\";\n    break;\n}","int n = 2;\nswitch (n) {\n    case 1: cout << \"one\";\n    break;\n    case 1:  cout << \"two\";\n    break;\n}","int n = 2;\nswitch (n) {\n    case 1: cout << \"one\";\n    break;\n    case n: cout << \"two\";\n    break;\n}","int n = 2;\nswitch (n) {\n    case 1: cout << \"one\";\n    break;\n    case 2: cout << \"two\";\n    break\n}"],"e":"Метки case не должны повторяться и должны быть константами; после break нужна точка с запятой."},
{"l":9,"k":"code","q":"Дано score = 85. Какой фрагмент компилируется и выводит B (90-100 - A, 80-89 - B, иначе C)?","o":["int score = 85;\nswitch (score / 10) {\n    case 10: case 9: cout << \"A\";\n    break;\n    case 8: cout << \"B\";\n    break;\n    default: cout << \"C\";\n}","int score = 85;\nswitch (score) {\n    case 10: case 9: cout << \"A\";\n    break;\n    case 8: cout << \"B\";\n    break;\n    default: cout << \"C\";\n}","int score = 85;\nswitch (score / 10) {\n    case 10: case 9: cout << \"A\";\n    break;\n    case 80..89: cout << \"B\";\n    break;\n    default: cout << \"C\";\n}","int score = 85;\nswitch (score / 10) {\n    case 10: case 9: cout << \"A\";\n    break;\n    case >= 8: cout << \"B\";\n    break;\n    default: cout << \"C\";\n}"],"e":"switch не умеет проверять диапазоны: баллы делят на 10 и сравнивают десятки с константами."},
{"l":9,"k":"code","q":"Даны t = 30, rain = false. Какой фрагмент компилируется и при этих данных ничего не выводит?","o":["int t = 30;\nbool rain = false;\nif (t > 25) {\n    if (rain) cout << \"umbrella\";\n} else {\n    cout << \"coat\";\n}","int t = 30;\nbool rain = false;\nif (t > 25) if (rain) cout << \"umbrella\";\nelse cout << \"coat\";","int t = 30;\nbool rain = false;\nif (t > 25) {\n    if rain cout << \"umbrella\";\n} else {\n    cout << \"coat\";\n}","int t = 30;\nbool rain = false;\nif (t > 25) {\n    if (rain) cout << \"umbrella\";\n};\nelse {\n    cout << \"coat\";\n}"],"e":"Без фигурных скобок else относится к ближайшему if (rain), и выводится coat; условие пишут в скобках; ; перед else отрывает его от if."},
{"l":9,"k":"code","q":"Даны a = 4, b = 9. Какой фрагмент компилируется и выводит меньшее число (4)?","o":["int a = 4, b = 9;\nint mn;\nif (a < b) mn = a;\nelse mn = b;\ncout << mn;","int a = 4, b = 9;\nint mn;\nif (a < b) mn = a;\nmn = b;\ncout << mn;","int a = 4, b = 9;\nint mn;\nif (a < b) mn = a else mn = b;\ncout << mn;","int a = 4, b = 9;\nint mn;\nif (a < b) mn == a;\nelse mn == b;\ncout << mn;"],"e":"Без else значение mn всегда заменяется на b; перед else нужна ; оператор == сравнивает, а не присваивает."},
{"l":9,"k":"out","q":"Что выведет этот код?","o":["BC","B","BCD","ABC"],"e":"Выполнение начинается с case 2 и идёт до первого break.","c":"int x = 2;\nswitch (x) {\n    case 1: cout << \"A\";\n    case 2: cout << \"B\";\n    case 3: cout << \"C\";\n    break;\n    default: cout << \"D\";\n}"},
{"l":9,"k":"out","q":"Что выведет этот код?","o":["Y","X","(ничего не выведет)","XY"],"e":"else относится к ближайшему if (a > 10).","c":"int a = 5;\nif (a > 3) if (a > 10) cout << \"X\";\nelse cout << \"Y\";"},
{"l":9,"k":"out","q":"Что выведет этот код?","o":["done","evendone","even","(ничего не выведет)"],"e":"Без скобок к if относится только первый оператор; done выводится всегда.","c":"int x = 7;\nif (x % 2 == 0) cout << \"even\";\ncout << \"done\";"},
{"l":9,"k":"out","q":"Что выведет этот код?","o":["FizzBuzz","Fizz","Fizz15","15"],"e":"15 делится и на 3, и на 5; else относится ко второму if.","c":"int n = 15;\nif (n % 3 == 0) cout << \"Fizz\";\nif (n % 5 == 0) cout << \"Buzz\";\nelse cout << n;"},
{"l":9,"k":"out","q":"Что выведет этот код?","o":["manytwo","many","two","onemanytwo"],"e":"После default нет break, поэтому выполняется и case 2.","c":"int k = 5;\nswitch (k) {\n    case 1: cout << \"one\";\n    break;\n    default: cout << \"many\";\n    case 2: cout << \"two\";\n}"},
{"l":9,"k":"out","q":"Что выведет этот код?","o":["10","20","0","-10"],"e":"a < b, выполняется последняя ветвь: 20 - 10.","c":"int a = 10, b = 20;\nif (a > b) cout << a;\nelse if (a == b) cout << 0;\nelse cout << b - a;"},
/* ===== MAVZU 10: while va do-while tsikllari (28) ===== */
{"l":10,"k":"theory","q":"Чем цикл do-while отличается от цикла while?","o":["В do-while условие проверяется после тела цикла, поэтому тело выполняется минимум один раз","В do-while условие проверяется до тела цикла","do-while всегда выполняется бесконечно","В do-while нельзя использовать break и continue"],"e":"while сначала проверяет условие, do-while сначала выполняет тело."},
{"l":10,"k":"theory","q":"Что делает оператор continue внутри цикла?","o":["Пропускает оставшуюся часть тела и переходит к следующей итерации","Немедленно завершает цикл","Завершает всю программу","Запускает цикл заново с начальным значением счётчика"],"e":"continue переходит к следующей итерации, цикл завершает break."},
{"l":10,"k":"code","q":"Какой фрагмент компилируется и выводит числа 1 2 3 4 5?","o":["int i = 1;\nwhile (i <= 5) {\n    cout << i << \" \";\n    i++;\n}","int i = 1;\nwhile (i <= 5) {\n    cout << i << \" \";\n}","int i = 1;\nwhile (i < 5) {\n    cout << i << \" \";\n    i++;\n}","int i = 1;\nwhile i <= 5 {\n    cout << i << \" \";\n    i++;\n}"],"e":"Ошибки: счётчик не изменяется - бесконечный цикл; условие i < 5 не выводит 5; условие while пишут в круглых скобках."},
{"l":10,"k":"code","q":"Пользователь вводит n = 5. Какой фрагмент правильно находит сумму чисел от 1 до n (15)?","o":["int n, sum = 0, i = 1;\ncin >> n;\nwhile (i <= n) {\n    sum += i;\n    i++;\n}\ncout << sum;","int n, sum, i = 1;\ncin >> n;\nwhile (i <= n) {\n    sum += i;\n    i++;\n}\ncout << sum;","int n, sum = 0, i = 1;\ncin >> n;\nwhile (i <= n) {\n    sum = i;\n    i++;\n}\ncout << sum;","int n, sum = 0, i = 1;\ncin >> n;\nwhile (i < n) {\n    sum += i;\n    i++;\n}\ncout << sum;"],"e":"Ошибки: sum не инициализирована нулём; sum = i не накапливает сумму; при i < n последнее число не прибавляется."},
{"l":10,"k":"code","q":"Какой фрагмент правильно вычисляет факториал числа 5 (120)?","o":["int n = 5, i = 1;\nlong long f = 1;\nwhile (i <= n) {\n    f *= i;\n    i++;\n}\ncout << f;","int n = 5, i = 1;\nlong long f = 0;\nwhile (i <= n) {\n    f *= i;\n    i++;\n}\ncout << f;","int n = 5, i = 1;\nlong long f = 1;\nwhile (i <= n) {\n    i++;\n    f *= i;\n}\ncout << f;","int n = 5, i = 1;\nlong long f = 1;\nwhile (i <= n)\n    f *= i;\n    i++;\ncout << f;"],"e":"Ошибки: при f = 0 произведение всегда 0; i увеличивается до умножения (получается 720); без { } в теле цикла только f *= i - цикл бесконечный."},
{"l":10,"k":"code","q":"В каком фрагменте цикл do-while записан без синтаксических ошибок?","o":["int age;\ndo {\n    cin >> age;\n} while (age < 0);\ncout << age;","int age;\ndo {\n    cin >> age;\n} while (age < 0)\ncout << age;","int age;\ndo {\n    cin >> age;\n} (age < 0);\ncout << age;","int age;\ndo while (age < 0) {\n    cin >> age;\n}\ncout << age;"],"e":"Форма записи: do { тело } while (условие); - со словом while после тела и обязательной точкой с запятой."},
{"l":10,"k":"code","q":"Какой фрагмент правильно считает количество цифр числа 4096 (4)?","o":["int n = 4096, count = 0;\nwhile (n > 0) {\n    count++;\n    n /= 10;\n}\ncout << count;","int n = 4096, count = 0;\nwhile (n > 0) {\n    count++;\n    n %= 10;\n}\ncout << count;","int n = 4096, count = 0;\nwhile (n > 0) {\n    n /= 10;\n}\ncount++;\ncout << count;","int n = 4096, count = 0;\nwhile (n >= 0) {\n    count++;\n    n /= 10;\n}\ncout << count;"],"e":"Ошибки: n %= 10 не уменьшает число до нуля - цикл бесконечный; count++ стоит вне цикла; при n >= 0 цикл не завершается."},
{"l":10,"k":"code","q":"Какой фрагмент правильно переворачивает число 123 (выводит 321)?","o":["int n = 123, rev = 0;\nwhile (n > 0) {\n    rev = rev * 10 + n % 10;\n    n /= 10;\n}\ncout << rev;","int n = 123, rev = 0;\nwhile (n > 0) {\n    rev = rev + n % 10;\n    n /= 10;\n}\ncout << rev;","int n = 123, rev = 0;\nwhile (n > 0) {\n    rev = rev * 10 + n / 10;\n    n /= 10;\n}\ncout << rev;","int n = 123, rev = 0;\nwhile (n > 0) {\n    n /= 10;\n    rev = rev * 10 + n % 10;\n}\ncout << rev;"],"e":"Ошибки: без умножения на 10 получается сумма цифр; последняя цифра - это n % 10, а не n / 10; цифру нужно взять до деления n на 10."},
{"l":10,"k":"code","q":"Какой фрагмент правильно находит НОД чисел 48 и 18 по алгоритму Евклида (6)?","o":["int a = 48, b = 18;\nwhile (b != 0) {\n    int t = a % b;\n    a = b;\n    b = t;\n}\ncout << a;","int a = 48, b = 18;\nwhile (b != 0) {\n    a = b;\n    b = a % b;\n}\ncout << a;","int a = 48, b = 18;\nwhile (b = 0) {\n    int t = a % b;\n    a = b;\n    b = t;\n}\ncout << a;","int a = 48, b = 18;\nwhile (b != 0) {\n    int t = a / b;\n    a = b;\n    b = t;\n}\ncout << a;"],"e":"Ошибки: остаток считается уже после изменения a; b = 0 - присваивание, цикл не выполняется; в алгоритме нужен остаток %, а не частное."},
{"l":10,"k":"code","q":"Какой фрагмент компилируется и выводит только нечётные числа 1 3 5 7 9?","o":["int i = 0;\nwhile (i < 9) {\n    i++;\n    if (i % 2 == 0) continue;\n    cout << i << \" \";\n}","int i = 1;\nwhile (i <= 9) {\n    if (i % 2 == 0) continue;\n    cout << i << \" \";\n    i++;\n}","int i = 0;\nwhile (i < 9) {\n    i++;\n    if (i % 2 == 0) break;\n    cout << i << \" \";\n}","int i = 0;\nwhile (i < 9) {\n    i++;\n    if (i % 2 == 0) continue\n    cout << i << \" \";\n}"],"e":"Ошибки: continue срабатывает до i++ - цикл зависает на числе 2; break завершает цикл после первого числа; пропущена точка с запятой."},
{"l":10,"k":"theory","q":"Сколько раз выполнится тело цикла while (false) { ... } ?","o":["Ни разу","Один раз","Бесконечно","Два раза"],"e":"while проверяет условие до первого выполнения тела."},
{"l":10,"k":"theory","q":"Сколько раз выполнится тело цикла do { ... } while (false); ?","o":["Один раз","Ни разу","Бесконечно","Два раза"],"e":"В do-while тело выполняется до первой проверки условия."},
{"l":10,"k":"theory","q":"В каком случае цикл while становится бесконечным?","o":["Когда условие никогда не становится ложным","Когда в теле больше одной команды","Когда счётчик начинается с нуля","Когда в цикле есть break"],"e":"Типичная причина - забыли изменить счётчик."},
{"l":10,"k":"theory","q":"Какой цикл удобнее для меню, которое нужно показать хотя бы один раз?","o":["do-while","while","Любой, разницы нет","Цикл здесь не нужен"],"e":"do-while выполняет тело минимум один раз."},
{"l":10,"k":"code","q":"Пользователь вводит 3 4 5 0. Какой фрагмент суммирует числа до нуля и выводит 12?","o":["int x, sum = 0;\ncin >> x;\nwhile (x != 0) {\n    sum += x;\n    cin >> x;\n}\ncout << sum;","int x, sum = 0;\ncin >> x;\nwhile (x != 0) {\n    sum += x;\n}\ncout << sum;","int x, sum = 0;\ncin >> x;\nwhile (x = 0) {\n    sum += x;\n    cin >> x;\n}\ncout << sum;","int x, sum = 0;\ncin >> x;\nwhile (x != 0) {\n    sum = x;\n    cin >> x;\n}\ncout << sum;"],"e":"Внутри цикла нужно считывать следующее число, иначе цикл бесконечный; x = 0 - присваивание; сумму накапливают оператором +=."},
{"l":10,"k":"code","q":"Пользователь вводит 0000, затем 1234. Даётся не больше трёх попыток. Какой фрагмент компилируется и выводит число попыток 2?","o":["string pass;\nint tries = 0;\ndo {\n    cin >> pass;\n    tries++;\n} while (pass != \"1234\" && tries < 3);\ncout << tries;","string pass;\nint tries = 0;\ndo {\n    cin >> pass;\n    tries++;\n} while (pass != \"1234\" || tries < 3);\ncout << tries;","string pass;\nint tries = 0;\ndo {\n    cin >> pass;\n    tries++;\n} while (pass != \"1234\" && tries < 3) cout << tries;","string pass;\nint tries = 0;\ndo {\n    cin >> pass;\n    tries++;\n} while (pass != 1234 && tries < 3);\ncout << tries;"],"e":"Цикл продолжается, пока пароль неверный И попытки остались; после while в do-while нужна ; строку сравнивают со строкой."},
{"l":10,"k":"code","q":"Какой фрагмент выводит степени двойки меньше 100: 1 2 4 8 16 32 64?","o":["int p = 1;\nwhile (p < 100) {\n    cout << p << \" \";\n    p *= 2;\n}","int p = 1;\nwhile (p < 100) {\n    cout << p << \" \";\n    p * 2;\n}","int p = 0;\nwhile (p < 100) {\n    cout << p << \" \";\n    p *= 2;\n}","int p = 1;\nwhile (p < 100);\n{\n    cout << p << \" \";\n    p *= 2;\n}"],"e":"p * 2 не изменяет p; ноль при умножении остаётся нулём; ; после условия делает тело цикла пустым - во всех трёх случаях цикл бесконечный."},
{"l":10,"k":"code","q":"Какой фрагмент компилируется и выводит таблицу умножения на 7 от 7 до 70?","o":["int i = 1;\nwhile (i <= 10) {\n    cout << 7 * i << \" \";\n    i++;\n}","int i = 1;\nwhile (i <= 10;) {\n    cout << 7 * i << \" \";\n    i++;\n}","int i = 1;\nwhile (i <= 10) {\n    cout << 7 * i << \" \";\n    i--;\n}","int i = 1 while (i <= 10) {\n    cout << 7 * i << \" \";\n    i++;\n}"],"e":"Внутри скобок условия не ставят ; счётчик должен расти, иначе условие не станет ложным."},
{"l":10,"k":"code","q":"Пользователь вводит 4 -2 5 0. Какой фрагмент выводит среднее положительных чисел 4.5?","o":["int x, sum = 0, cnt = 0;\ncin >> x;\nwhile (x != 0) {\n    if (x > 0) {\n        sum += x;\n        cnt++;\n    }\n    cin >> x;\n}\nif (cnt > 0) cout << 1.0 * sum / cnt;","int x, sum = 0, cnt = 0;\ncin >> x;\nwhile (x != 0) {\n    if (x > 0) {\n        sum += x;\n        cnt++;\n    }\n    cin >> x;\n}\nif (cnt > 0) cout << sum / cnt;","int x, sum = 0, cnt = 0;\ncin >> x;\nwhile (x != 0) {\n    if (x > 0) sum += x;\n    cnt++;\n    cin >> x;\n}\nif (cnt > 0) cout << 1.0 * sum / cnt;","int x, sum = 0, cnt = 0;\ncin >> x;\nwhile (x != 0) {\n    if (x > 0) {\n        sum += x;\n        cnt++;\n    }\n}\nif (cnt > 0) cout << 1.0 * sum / cnt;"],"e":"Ошибки: целочисленное деление; без { } счётчик увеличивается для всех чисел; без ввода внутри цикла он бесконечный."},
{"l":10,"k":"code","q":"Загадано число 7, пользователь вводит 3 9 7. Какой фрагмент компилируется и выводит win после правильного ответа?","o":["int secret = 7, g;\ndo {\n    cin >> g;\n} while (g != secret);\ncout << \"win\";","int secret = 7, g;\ndo {\n    cin >> g;\n} while (g = secret);\ncout << \"win\";","int secret = 7, g;\ndo ( cin >> g;\n}\nwhile (g != secret); cout << \"win\";","int secret = 7, g;\ndo {\n    cin >> g;\n} until (g == secret);\ncout << \"win\";"],"e":"g = secret - присваивание, условие всегда истинно; тело do-while пишут в фигурных скобках; слова until в C++ нет."},
{"l":10,"k":"code","q":"Какой фрагмент компилируется и выводит прямоугольник из звёздочек: 2 строки по 3?","o":["int i = 0;\nwhile (i < 2) {\n    int j = 0;\n    while (j < 3) {\n        cout << \"*\";\n        j++;\n    }\n    cout << endl;\n    i++;\n}","int i = 0;\nwhile (i < 2) {\n    while (j < 3) {\n        cout << \"*\";\n        j++;\n    }\n    cout << endl;\n    i++;\n}","int i = 0;\nint j = 0;\nwhile (i < 2) {\n    while (j < 3) {\n        cout << \"*\";\n        j++;\n    }\n    cout << endl;\n    i++;\n}","int i = 0;\nwhile (i < 2) {\n    int j = 0;\n    while (j < 3) {\n        cout << \"*\";\n        i++;\n    }\n    cout << endl;\n    i++;\n}"],"e":"Счётчик внутреннего цикла нужно объявить и обнулять перед каждой строкой; внутренний цикл должен менять j, а не i."},
{"l":10,"k":"code","q":"Какой фрагмент компилируется и находит первое число больше 50, которое делится на 7 (56)?","o":["int n = 51;\nwhile (true) {\n    if (n % 7 == 0) break;\n    n++;\n}\ncout << n;","int n = 51;\nwhile (true) {\n    if (n % 7 == 0) continue;\n    n++;\n}\ncout << n;","int n = 51;\nwhile (True) {\n    if (n % 7 == 0) break;\n    n++;\n}\ncout << n;","int n = 51;\nwhile (true) {\n    if (n / 7 == 0) break;\n    n++;\n}\ncout << n;"],"e":"Из бесконечного цикла выходят через break; true пишется строчными; делимость проверяют остатком %."},
{"l":10,"k":"out","q":"Что выведет этот код?","o":["3","2","4","0"],"e":"Цикл заканчивается, когда i становится равным 3.","c":"int i = 0;\nwhile (i < 3) {\n    i++;\n}\ncout << i;"},
{"l":10,"k":"out","q":"Что выведет этот код?","o":["5","(ничего не выведет)","54321","54"],"e":"Тело выполняется один раз, затем условие 4 > 5 ложно.","c":"int n = 5;\ndo {\n    cout << n;\n    n--;\n} while (n > 5);"},
{"l":10,"k":"out","q":"Что выведет этот код?","o":["-2","1","0","-3"],"e":"10, 7, 4, 1, -2: цикл останавливается, когда i перестаёт быть положительным.","c":"int i = 10;\nwhile (i > 0) {\n    i -= 3;\n}\ncout << i;"},

{"l":10,"k":"out","q":"Что выведет этот код?","o":["6","7","5","50"],"e":"100, 50, 25, 12, 6, 3, 1 - шесть делений.","c":"int n = 100, k = 0;\nwhile (n > 1) {\n    n /= 2;\n    k++;\n}\ncout << k;"},
{"l":10,"k":"out","q":"Что выведет этот код?","o":["1245","12345","12","0124"],"e":"При i = 3 вывод пропускается, цикл продолжается.","c":"int i = 0;\nwhile (i < 5) {\n    i++;\n    if (i == 3) continue;\n    cout << i;\n}"},
