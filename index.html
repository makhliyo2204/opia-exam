{"l":18,"k":"code","q":"Какой фрагмент компилируется и изменяет b через массив указателей (выводит 24)?","o":["int a = 1, b = 2, c = 3;\nint* p[3] = {&a, &b, &c};\n*p[1] = 20;\ncout << a + b + c;","int a = 1, b = 2, c = 3;\nint* p[3] = {a, b, c};\n*p[1] = 20;\ncout << a + b + c;","int a = 1, b = 2, c = 3;\nint* p[3] = {&a, &b, &c};\np[1] = 20;\ncout << a + b + c;","int a = 1, b = 2, c = 3;\nint p[3] = {&a, &b, &c};\n*p[1] = 20;\ncout << a + b + c;"],"e":"Элементы массива указателей - адреса; значение изменяют через разыменование *p[1]."},
{"l":18,"k":"code","q":"Какой фрагмент компилируется и правильно выводит все дни из массива C-строк?","o":["const char* days[3] = {\"Mon\", \"Tue\", \"Wed\"};\nfor (int i = 0; i < 3; i++) cout << days[i] << \" \";","const char days[3] = {\"Mon\", \"Tue\", \"Wed\"};\nfor (int i = 0; i < 3; i++) cout << days[i] << \" \";","const char* days[3] = {'Mon', 'Tue', 'Wed'};\nfor (int i = 0; i < 3; i++) cout << days[i] << \" \";","const char* days[3] = {\"Mon\", \"Tue\", \"Wed\"};\nfor (int i = 0; i <= 3; i++) cout << days[i] << \" \";"],"e":"Массив строк - это массив указателей const char*; строки пишут в двойных кавычках; индексы от 0 до 2."},
{"l":18,"k":"code","q":"Какой фрагмент компилируется и выводит первые буквы слов и длину второго слова (ak4)?","o":["const char* w[2] = {\"apple\", \"kiwi\"};\ncout << w[0][0] << w[1][0] << strlen(w[1]);","const char* w[2] = {\"apple\", \"kiwi\"};\ncout << w[0][0] << w[1, 0] << strlen(w[1]);","const char* w[2] = {\"apple\", \"kiwi\"};\ncout << w[0][0] << w[1][0] << w[1].size();","const char* w[2] = {\"apple\", \"kiwi\"};\ncout << *w[0][0] << w[1][0] << strlen(w[1]);"],"e":"Символ строки получают двумя парами скобок: w[i][j]; у C-строк нет методов, длину даёт strlen."},
{"l":18,"k":"code","q":"Какой фрагмент компилируется и изменяет первую букву слова (выводит bat)?","o":["char a[] = \"cat\";\nchar* words[1] = {a};\nwords[0][0] = 'b';\ncout << words[0];","const char* words[1] = {\"cat\"};\nwords[0][0] = 'b';\ncout << words[0];","char a[] = \"cat\";\nchar* words[1] = {a};\nwords[0][0] = \"b\";\ncout << words[0];","char a[] = \"cat\";\nchar* words[1] = {a};\nwords[0] = 'b';\ncout << words[0];"],"e":"Строковый литерал изменять нельзя (const char*): изменяемый текст хранят в массиве char; символ пишут в одинарных кавычках."},
{"l":18,"k":"code","q":"Какая программа компилируется и правильно сортирует массив указателей на строки по алфавиту (выводит apple)?","o":["bool lessStr(const char* a, const char* b) {\n    return strcmp(a, b) < 0;\n}\n\nint main() {\n    const char* w[3] = {\"pear\", \"apple\", \"kiwi\"};\n    sort(w, w + 3, lessStr);\n    cout << w[0];\n    return 0;\n}","bool lessStr(const char* a, const char* b) {\n    return strcmp(a, b) > 0;\n}\n\nint main() {\n    const char* w[3] = {\"pear\", \"apple\", \"kiwi\"};\n    sort(w, w + 3, lessStr);\n    cout << w[0];\n    return 0;\n}","bool lessStr(const char* a, const char* b) {\n    return strcmp(a, b) < 0;\n}\n\nint main() {\n    const char* w[3] = {\"pear\", \"apple\", \"kiwi\"};\n    sort(w, w + 3);\n    cout << w[0];\n    return 0;\n}","bool lessStr(const char* a, const char* b) {\n    return strcmp(a, b) < 0;\n}\n\nint main() {\n    const char* w[3] = {\"pear\", \"apple\", \"kiwi\"};\n    sort(w, w + 3, lessStr(w[0], w[1]));\n    cout << w[0];\n    return 0;\n}"],"e":"Без функции сравнения сортируются адреса, а не текст; для порядка по алфавиту правило strcmp(a, b) < 0; в sort передают имя функции."},
{"l":18,"k":"code","q":"Какой фрагмент компилируется и меняет две строки местами через указатели (выводит two one)?","o":["const char* a = \"one\";\nconst char* b = \"two\";\nconst char* t = a;\na = b;\nb = t;\ncout << a << \" \" << b;","const char* a = \"one\";\nconst char* b = \"two\";\nchar t = a;\na = b;\nb = t;\ncout << a << \" \" << b;","const char* a = \"one\";\nconst char* b = \"two\";\nconst char* t = a;\n*a = *b;\n*b = *t;\ncout << a << \" \" << b;","const char* a = \"one\";\nconst char* b = \"two\";\nconst char* t = a;\nb = t;\na = b;\ncout << a << \" \" << b;"],"e":"Меняются местами адреса, поэтому временная переменная тоже указатель; сами литералы изменять нельзя; порядок обмена важен."},
{"l":18,"k":"code","q":"Программа запущена без параметров. Какой вариант компилируется и выводит количество аргументов (1)?","o":["int main(int argc, char* argv[]) {\n    for (int i = 1; i < argc; i++) cout << argv[i] << endl;\n    cout << argc;\n    return 0;\n}","int main(int argc, char* argv[]) {\n    for (int i = 1; i <= argc; i++) cout << argv[i] << endl;\n    cout << argc;\n    return 0;\n}","int main(int argc; char* argv[]) {\n    for (int i = 1; i < argc; i++) cout << argv[i] << endl;\n    cout << argc;\n    return 0;\n}","int main(int argc, char* argv[]) {\n    for (int i = 1; i < argc; i++) cout << argv[i].size() << endl;\n    cout << argc;\n    return 0;\n}"],"e":"Допустимые индексы argv - от 0 до argc - 1: элемент argv[argc] равен нулевому указателю; параметры функции разделяют запятой."},
{"l":18,"k":"code","q":"Какая программа компилируется и правильно находит лучшего студента через массив указателей на структуры (выводит Vali)?","o":["struct Student {\n    string name;\n    int score;\n};\n\nint main() {\n    Student a = {\"Ali\", 80}, b = {\"Vali\", 95};\n    Student* g[2] = {&a, &b};\n    Student* best = g[0];\n    for (int i = 1; i < 2; i++) if (g[i]->score > best->score) best = g[i];\n    cout << best->name;\n    return 0;\n}","struct Student {\n    string name;\n    int score;\n};\n\nint main() {\n    Student a = {\"Ali\", 80}, b = {\"Vali\", 95};\n    Student* g[2] = {&a, &b};\n    Student* best = g[0];\n    for (int i = 1; i < 2; i++) if (g[i].score > best.score) best = g[i];\n    cout << best->name;\n    return 0;\n}","struct Student {\n    string name;\n    int score;\n};\n\nint main() {\n    Student a = {\"Ali\", 80}, b = {\"Vali\", 95};\n    Student* g[2] = {a, b};\n    Student* best = g[0];\n    for (int i = 1; i < 2; i++) if (g[i]->score > best->score) best = g[i];\n    cout << best->name;\n    return 0;\n}","struct Student {\n    string name;\n    int score;\n};\n\nint main() {\n    Student a = {\"Ali\", 80}, b = {\"Vali\", 95};\n    Student* g[2] = {&a, &b};\n    Student* best = g[0];\n    for (int i = 1; i < 2; i++) if (g[i]->score < best->score) best = g[i];\n    cout << best->name;\n    return 0;\n}"],"e":"К полю через указатель обращаются оператором ->; в массиве указателей хранят адреса; для поиска лучшего нужен знак >."},
{"l":18,"k":"code","q":"Какой фрагмент компилируется и правильно работает с динамическим массивом указателей (выводит 5)?","o":["int** rows = new int*[2];\nrows[0] = new int[2]{1, 2};\nrows[1] = new int[3]{3, 4, 5};\ncout << rows[1][2];\ndelete[] rows[0];\ndelete[] rows[1];\ndelete[] rows;","int* rows = new int*[2];\nrows[0] = new int[2]{1, 2};\nrows[1] = new int[3]{3, 4, 5};\ncout << rows[1][2];\ndelete[] rows[0];\ndelete[] rows[1];\ndelete[] rows;","int** rows = new int*[2];\nrows[0] = new int[2]{1, 2};\nrows[1] = new int[3]{3, 4, 5};\ncout << rows[2][1];\ndelete[] rows[0];\ndelete[] rows[1];\ndelete[] rows;","int** rows = new int[2];\nrows[0] = new int[2]{1, 2};\nrows[1] = new int[3]{3, 4, 5};\ncout << rows[1][2];\ndelete[] rows[0];\ndelete[] rows[1];\ndelete[] rows;"],"e":"Массив указателей имеет тип int**; строк две, их индексы 0 и 1; каждую строку и сам массив освобождают через delete[]."},
{"l":18,"k":"code","q":"Какая программа с массивом указателей на функции компилируется и выводит 7 12?","o":["int add(int a, int b) {\n    return a + b;\n}\n\nint mul(int a, int b) {\n    return a * b;\n}\n\nint main() {\n    int (*ops[2])(int, int) = {add, mul};\n    cout << ops[0](3, 4) << \" \" << ops[1](3, 4);\n    return 0;\n}","int add(int a, int b) {\n    return a + b;\n}\n\nint mul(int a, int b) {\n    return a * b;\n}\n\nint main() {\n    int *ops[2](int, int) = {add, mul};\n    cout << ops[0](3, 4) << \" \" << ops[1](3, 4);\n    return 0;\n}","int add(int a, int b) {\n    return a + b;\n}\n\nint mul(int a, int b) {\n    return a * b;\n}\n\nint main() {\n    int (*ops[2])(int, int) = {add(), mul()};\n    cout << ops[0](3, 4) << \" \" << ops[1](3, 4);\n    return 0;\n}","int add(int a, int b) {\n    return a + b;\n}\n\nint mul(int a, int b) {\n    return a * b;\n}\n\nint main() {\n    int (*ops[2])(int, int) = {add, mul};\n    cout << ops[0](3, 4) << \" \" << ops[1];\n    return 0;\n}"],"e":"Скобки вокруг *ops[2] обязательны; в массив записывают имена функций без скобок; для вызова нужны аргументы."},
{"l":18,"k":"code","q":"Какая программа с таблицей команд компилируется и выводит bye?","o":["void hello() {\n    cout << \"hello\";\n}\n\nvoid bye() {\n    cout << \"bye\";\n}\n\nint main() {\n    void (*cmd[2])() = {hello, bye};\n    int k = 1;\n    if (k >= 0 && k < 2) cmd[k]();\n    return 0;\n}","void hello() {\n    cout << \"hello\";\n}\n\nvoid bye() {\n    cout << \"bye\";\n}\n\nint main() {\n    void (*cmd[2])() = {hello, bye};\n    int k = 1;\n    if (k >= 0 && k < 2) cmd[k];\n    return 0;\n}","void hello() {\n    cout << \"hello\";\n}\n\nvoid bye() {\n    cout << \"bye\";\n}\n\nint main() {\n    void cmd[2]() = {hello, bye};\n    int k = 1;\n    if (k >= 0 && k < 2) cmd[k]();\n    return 0;\n}","void hello() {\n    cout << \"hello\";\n}\n\nvoid bye() {\n    cout << \"bye\";\n}\n\nint main() {\n    void (*cmd[2])() = {hello, bye};\n    int k = 1;\n    if (k >= 0 && k < 2) cmd(k);\n    return 0;\n}"],"e":"Чтобы вызвать функцию из таблицы, после cmd[k] ставят скобки; массив объявляют как void (*cmd[2])()."},
{"l":18,"k":"code","q":"Какой фрагмент компилируется и правильно суммирует зубчатый массив (15)?","o":["int r1[] = {1, 2}, r2[] = {3, 4, 5};\nint* rows[] = {r1, r2};\nint len[] = {2, 3};\nint sum = 0;\nfor (int i = 0; i < 2; i++) for (int j = 0; j < len[i]; j++) sum += rows[i][j];\ncout << sum;","int r1[] = {1, 2}, r2[] = {3, 4, 5};\nint* rows[] = {r1, r2};\nint len[] = {2, 3};\nint sum = 0;\nfor (int i = 0; i < 2; i++) for (int j = 0; j < len[0]; j++) sum += rows[i][j];\ncout << sum;","int r1[] = {1, 2}, r2[] = {3, 4, 5};\nint* rows[] = {r1, r2};\nint len[] = {2, 3};\nint sum = 0;\nfor (int i = 0; i < 2; i++) for (int j = 0; j < 3; j++) sum += rows[i][j];\ncout << sum;","int r1[] = {1, 2}, r2[] = {3, 4, 5};\nint rows[] = {r1, r2};\nint len[] = {2, 3};\nint sum = 0;\nfor (int i = 0; i < 2; i++) for (int j = 0; j < len[i]; j++) sum += rows[i][j];\ncout << sum;"],"e":"У каждой строки своя длина len[i]; общая граница 3 выходит за пределы короткой строки; rows - массив указателей."},
{"l":18,"k":"code","q":"Какой фрагмент компилируется и правильно ищет имя Vali в массиве указателей на строки (выводит индекс 1)?","o":["const char* names[3] = {\"Ali\", \"Vali\", \"Sami\"};\nint pos = -1;\nfor (int i = 0; i < 3; i++) if (strcmp(names[i], \"Vali\") == 0) pos = i;\ncout << pos;","const char* names[3] = {\"Ali\", \"Vali\", \"Sami\"};\nint pos = -1;\nfor (int i = 0; i < 3; i++) if (names[i] = \"Vali\") pos = i;\ncout << pos;","const char* names[3] = {\"Ali\", \"Vali\", \"Sami\"};\nint pos = -1;\nfor (int i = 0; i < 3; i++) if (strcmp(names[i], \"Vali\")) pos = i;\ncout << pos;","const char* names[3] = {\"Ali\", \"Vali\", \"Sami\"};\nint pos = -1;\nfor (int i = 0; i < 3; i++) if (strcmp(names, \"Vali\") == 0) pos = i;\ncout << pos;"],"e":"Текст C-строк сравнивают функцией strcmp, которая возвращает 0 при совпадении; = - это присваивание; сравнивать нужно элемент names[i]."},

/* ========== UTILS ========== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function highlightCode(code){
  const kws = new Set(["int","double","float","char","bool","void","string","long","short","unsigned","signed","const","constexpr","if","else","for","while","do","switch","case","break","continue","return","using","namespace","include","struct","class","public","private","new","delete","true","false","nullptr","cout","cin","endl","std","sizeof","static_cast","getline","main","vector","auto","printf","scanf","fabs"]);
  const out=[];let i=0,n=code.length;
  while(i<n){
    if(code[i]==='/'&&code[i+1]==='/'){let j=i;while(j<n&&code[j]!=='\n')j++;out.push(['c',code.slice(i,j)]);i=j;continue;}
    if(code[i]==='"'||code[i]==="'"){const q=code[i];let j=i+1;while(j<n&&code[j]!==q){if(code[j]==='\\')j++;j++;}j++;out.push(['s',code.slice(i,j)]);i=j;continue;}
    if(/[a-zA-Z_]/.test(code[i])){let j=i;while(j<n&&/[a-zA-Z0-9_]/.test(code[j]))j++;const w=code.slice(i,j);out.push([kws.has(w)?'k':null,w]);i=j;continue;}
    if(/[0-9]/.test(code[i])){let j=i;while(j<n&&/[0-9a-fA-FxX']/.test(code[j]))j++;out.push(['n',code.slice(i,j)]);i=j;continue;}
    out.push([null,code[i]]);i++;
  }
  return out.map(([c,t])=>c?`<span class="${c}">${escapeHtml(t)}</span>`:escapeHtml(t)).join("");
}

function renderLoadError(){
  $("#app").innerHTML = `<header class="hero bad"><div><div class="eyebrow">ОШИБКА СОЕДИНЕНИЯ</div><h1>Не удалось подключиться к серверу</h1></div></header>

function boot(){
  if(LOAD_ERR){ renderLoadError(); return; }
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){ listenStudent(saved); }
  else { S.view = "register"; render(); }
}

/* ========== FIREBASE ========== */
async function registerStudent(name,surname,group){
  const id = "s_" + Date.now() + "_" + Math.random().toString(36).slice(2,8);
  await set(ref(db,"students/"+id), {
    name, surname, group,
    status: "waiting",
    joinedAt: Date.now(),
    attemptUsed: false
  });
  localStorage.setItem(STORAGE_KEY, id);
  listenStudent(id);
}

function listenStudent(id){
  if(S.unsubStudent) S.unsubStudent();
  S.unsubStudent = onValue(ref(db,"students/"+id), snap => {
    if(!snap.exists()){
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(QUIZ_STATE_KEY);
      if(S.quiz && S.quiz.timerHandle) clearInterval(S.quiz.timerHandle);
      S.quiz=null;S.results=null;S.studentId=null;S.student=null;S.view="register";render();return;
    }
    S.studentId = id;
    S.student = snap.val();
    handleStudentChange();
  }, err => { $("#app").innerHTML = `<section class="card"><p>Ошибка базы данных: ${escapeHtml(err.message)}</p></section>`; });
  if(S.unsubConfig) S.unsubConfig();
  S.unsubConfig = onValue(ref(db,"config"), snap => {
    S.config = snap.val() || {};
    handleStudentChange();
  });
}

function handleStudentChange(){
  const s = S.student;
  if(!s) return;
  const st = s.status;

  // O'qituvchi testni to'xtatsa — davom etayotgan test yakunlanadi
  if(S.quiz && S.view === "quiz" && S.config.active === false){ finishQuiz(true); return; }
  // O'qituvchi urinishni tiklagan bo'lsa — mahalliy holatni tozalaymiz
  if((st === "approved" || st === "waiting") && !s.attemptUsed && (S.quiz || S.results)){
    if(S.quiz && S.quiz.timerHandle) clearInterval(S.quiz.timerHandle);
    S.quiz = null; S.results = null; localStorage.removeItem(QUIZ_STATE_KEY);
  }

  // Agar test tugagan bo'lsa → natija ko'rsatiladi
  if(st === "finished" && s.result){
    S.results = s.result;
    S.quiz = null;
    if(S.view !== "results"){ S.view = "results"; render(); }
    return;
  }

  // Agar test davom etayotgan bo'lsa (resume)
  if(st === "started" && s.attemptUsed){
    if(!S.quiz && S.view !== "quiz"){
      // localStorage'dan resume qilishga urinamiz
      const canResume = tryResumeQuiz();
      if(!canResume){
        S.view = "resumeError"; render(); return;
      }
    }
    return;
  }

  // Agar o'qituvchi testni boshlagan va o'quvchi hali boshlanmagan bo'lsa
  if(S.config.active && (st === "waiting" || st === "rejected")){
    // Avtomatik "approved"ga o'tkazamiz
    update(ref(db,"students/"+S.studentId), {status:"approved"}).catch(()=>{});
    S.view = "ready"; render();
    return;
  }

  if(st === "approved"){
    if(!S.config.active){
      S.view = "waiting"; render();
    } else {
      S.view = "ready"; render();
    }
    return;
  }

  if(st === "waiting"){ S.view = "waiting"; render(); return; }
  if(st === "rejected"){ S.view = "rejected"; render(); return; }

  // Fallback
  if(S.view === "loading" || S.view === "register"){ S.view = "waiting"; render(); }
}

/* ========== RENDER ========== */
function render(){
  window.__booted = true;
  if(typeof setWatermark === "function") setWatermark();
  const app = $("#app");
  switch(S.view){
    case "loading": app.innerHTML = `<div class="card"><p>Загрузка…</p></div>`; break;
    case "register": renderRegister(app); break;
    case "waiting": renderWaiting(app); break;
    case "rejected": renderRejected(app); break;
    case "ready": renderReady(app); break;
    case "resumeError": renderResumeError(app); break;
    case "quiz": renderQuiz(app); break;
    case "results": renderResults(app); break;
    default: app.innerHTML = `<div class="card"><p>Состояние: ${escapeHtml(S.view)}</p></div>`;
  }
}

/* ========== QUIZ START ========== */
function poolSize(){
  const c = S.config || {}; const n = DATA.filter(q => (c.lectures||[]).includes(q.l)).length;
  return c.count === "all" ? n : Math.min(+c.count || 0, n);
}
function beginQuiz(){
  if(S.student.attemptUsed){ alert("Вы уже использовали свою попытку. Повторное прохождение невозможно."); return; }
  if(document.getElementById("startModal")) return;
  const m = document.createElement("div"); m.id = "startModal";
  m.innerHTML = '<div class="card"><h2>Начать тест?</h2><p>Тест откроется на весь экран (как при нажатии F11). Время пойдёт сразу.</p><div class="row"><button class="btn primary big" id="smYes">Да, начать</button><button class="btn big" id="smNo">Отмена</button></div></div>';
  document.body.appendChild(m);
  m.querySelector("#smNo").onclick = () => m.remove();
  m.querySelector("#smYes").onclick = () => { m.remove(); startQuiz(); };
}
async function startQuiz(){
  if(S.student.attemptUsed){ alert("Вы уже использовали свою попытку. Повторное прохождение невозможно."); return; }
  const cfg = S.config;
  const pool = DATA.filter(q => (cfg.lectures||[]).includes(q.l));
  if(pool.length === 0){ alert("По выбранным темам вопросов не найдено."); return; }
  enterFs(); S.fsGraceUntil = Date.now()+4000;
  const cnt = cfg.count === "all" ? pool.length : Math.min(+cfg.count || pool.length, pool.length);
  const questions = shuffle(pool).slice(0, cnt).map(q => {
    const idx = shuffle(Array.from({length:q.o.length},(_,i)=>i));
    return { l:q.l, k:q.k, q:q.q, e:q.e, c:q.c||null, displayOptions: idx.map(i=>q.o[i]), correctDisplayIdx: idx.indexOf(0) };
  });
  S.quiz = { questions, answers: Array(questions.length).fill(null), currentIdx: 0, deadline: Date.now()+QSEC*1000,
    timeLeft: QSEC, startedAt: Date.now(), timerHandle: null, finished: false, locked: false };
  S.secGraceUntil = Date.now()+5000;
  saveQuizState(); S.view = "quiz"; render();
  try{
    await update(ref(db,"students/"+S.studentId), { status:"started", attemptUsed:true, startedAt:Date.now(),
      progress:{answered:0,total:questions.length,current:1} });
  }catch(err){
    if(S.quiz && S.quiz.timerHandle) clearInterval(S.quiz.timerHandle);
    S.quiz = null; localStorage.removeItem(QUIZ_STATE_KEY); S.view = "ready"; render();
    alert("Ошибка: "+err.message);
  }
}

/* ========== QUIZ RENDER ========== */
function renderQuiz(app){
  const Q = S.quiz;
  if(!Q){ S.view="ready"; render(); return; }
  Q.timeLeft = leftNow();
  const q = Q.questions[Q.currentIdx];
  const a = Q.answers[Q.currentIdx];
  const answered = Q.answers.filter(x=>x).length;
  const progress = Math.round(((Q.currentIdx) / Q.answers.length)*100);

  const nav = Q.questions.map((_,i)=>{
    const an = Q.answers[i];
    let cls = "";
    if(an) cls = "done";
    if(i === Q.currentIdx) cls = "cur";
    else if(!an && i < Q.currentIdx) cls = "expired";
    return `<button class="${cls}" data-nav="${i}">${i+1}</button>`;
  }).join("");

  const kindLabel = {theory:"Теория",pseudo:"Псевдокод",code:"Код",out:"Вывод"}[q.k] || q.k;

  const optsHtml = q.displayOptions.map((opt,i)=>{
    const letCls = i===0?"":"l"+i;
    let extra = "";
    if(a && i===a.chosenIdx) extra = "sel";
    const isCode = q.k==="code" || q.k==="pseudo" || q.k==="out";
    const body = isCode ? `<pre>${highlightCode(opt)}</pre>` : escapeHtml(opt);
    return `<button class="opt ${letCls} ${extra}" data-opt="${i}">
      <span class="let">${String.fromCharCode(65+i)}</span>
      <span class="body">${body}</span>
    </button>`;
  }).join("");

  app.innerHTML = `
    <div class="status">
      <div class="row spread">
        <div class="row">
          <span class="clock ${Q.timeLeft<=10?'danger':''}" id="clock">⏱ ${Q.timeLeft} с</span>
          <span class="muted small">${Q.currentIdx+1} / ${Q.questions.length}</span>
        </div>
        <div class="row">
          <span class="tag time">На вопрос: 60 с</span>
        </div>
      </div>
      <div class="bar"><i style="width:${progress}%"></i></div>
      <div class="tbar"><i id="tbarI" style="width:${Math.round(Q.timeLeft/QSEC*100)}%"></i></div>
      <div class="nav">${nav}</div>
    </div>
    <section class="card" style="margin-top:16px;">
      <div class="row">
        <span class="tag lec">Тема ${q.l}</span>
        <span class="tag kind">${kindLabel}</span>
      </div>
      ${q.c ? `<pre class="qcode">${highlightCode(q.c)}</pre>` : ""}
      <p class="qtext">${escapeHtml(q.q)}</p>
      <div class="opts">${optsHtml}</div>
    </section>
  `;

  $$("[data-opt]").forEach(btn => btn.addEventListener("click", ()=> selectOption(+btn.dataset.opt)));
  $$("[data-nav]").forEach(btn => btn.addEventListener("click", ()=> navigateTo(+btn.dataset.nav)));

  startQuestionTimer();
}

/* ========== TIMER (deadline asosida: sahifa yangilansa ham, fonga o'tsa ham aniq) ========== */
function leftNow(){ const Q=S.quiz; return Math.max(0, Math.ceil((Q.deadline-Date.now())/1000)); }
function reportProgress(){
  const Q=S.quiz; if(!Q||!S.studentId||!S.student) return;
  update(ref(db,"students/"+S.studentId+"/progress"),{answered:Q.answers.filter(x=>x).length,total:Q.answers.length,current:Q.currentIdx+1}).catch(()=>{});
}
function advance(timedOut){
  const Q=S.quiz; if(!Q) return;
  if(Q.currentIdx < Q.answers.length-1){
    Q.currentIdx++; Q.deadline=Date.now()+QSEC*1000; Q.timeLeft=QSEC; Q.locked=false;
    saveQuizState(); render(); reportProgress();
  } else finishQuiz(!!timedOut);
}
function expire(){
  const Q=S.quiz; if(!Q) return;
  const n = 1 + Math.floor((Date.now()-Q.deadline)/(QSEC*1000));
  if(Q.currentIdx + n >= Q.answers.length){ finishQuiz(true); return; }
  Q.currentIdx += n; Q.deadline += n*QSEC*1000; Q.locked=false; Q.timeLeft=leftNow();
  saveQuizState(); render(); reportProgress();
}
function startQuestionTimer(){
  const Q=S.quiz; if(!Q) return;
  clearInterval(Q.timerHandle);
  Q.timerHandle = setInterval(()=>{
    if(S.quiz!==Q || S.view!=="quiz"){ clearInterval(Q.timerHandle); return; }
    if(Q.locked) return;
    Q.timeLeft = leftNow();
    if(Q.timeLeft<=0){ clearInterval(Q.timerHandle); expire(); return; }
    const clock=$("#clock");
    if(clock){ clock.textContent="⏱ "+Q.timeLeft+" с"; clock.classList.toggle("danger",Q.timeLeft<=10); }
    const tb=$("#tbarI"); if(tb) tb.style.width=Math.max(0,(Q.deadline-Date.now())/(QSEC*10))+"%";
    if(Q.timeLeft%5===0) saveQuizState();
  }, 500);
}
document.addEventListener("visibilitychange",()=>{
  const Q=S.quiz; if(!document.hidden && Q && S.view==="quiz" && !Q.locked && Date.now()>=Q.deadline){ clearInterval(Q.timerHandle); expire(); }
});

/* ========== OPTION / NAV ========== */
function selectOption(i){
  const Q=S.quiz; if(!Q||Q.locked||Q.answers[Q.currentIdx]) return;
  if(Date.now()>=Q.deadline){ clearInterval(Q.timerHandle); expire(); return; }
  Q.locked=true; clearInterval(Q.timerHandle);
  Q.answers[Q.currentIdx]={chosenIdx:i,answeredAt:Date.now()};
  saveQuizState(); reportProgress();
  $$("[data-opt]").forEach(b=>{ b.disabled=true; if(+b.dataset.opt===i) b.classList.add("sel"); });
  setTimeout(()=>{ if(S.quiz===Q) advance(false); }, 400);
}
function navigateTo(idx){
  const Q=S.quiz; if(!Q||Q.locked||idx<=Q.currentIdx||idx>=Q.answers.length) return;
  if(!askConfirm("Перейти к вопросу "+(idx+1)+"? К пропущенным вопросам вернуться нельзя.")) return;
  Q.currentIdx=idx; Q.deadline=Date.now()+QSEC*1000; Q.timeLeft=QSEC;
  saveQuizState(); render(); reportProgress();
}

/* ========== SAVE / RESUME ========== */
function saveQuizState(){
  const Q=S.quiz; if(!Q) return;
  try { localStorage.setItem(QUIZ_STATE_KEY, JSON.stringify({ studentId:S.studentId, questions:Q.questions, answers:Q.answers,
    currentIdx:Q.currentIdx, deadline:Q.deadline, startedAt:Q.startedAt })); } catch(e){ console.error("save fail",e); }
}
function tryResumeQuiz(){
  const raw=localStorage.getItem(QUIZ_STATE_KEY); if(!raw) return false;
  try{
    const d=JSON.parse(raw);
    if(d.studentId!==S.studentId || !Array.isArray(d.questions) || !d.questions.length) return false;
    S.quiz={ questions:d.questions, answers:d.answers, currentIdx:d.currentIdx, deadline:d.deadline||(Date.now()+QSEC*1000),
      timeLeft:QSEC, startedAt:d.startedAt||Date.now(), timerHandle:null, finished:false, locked:false };
    S.view="quiz"; S.secGraceUntil = Date.now()+3000;
    if(localStorage.getItem(LEFT_KEY)){ localStorage.removeItem(LEFT_KEY); finishQuiz(false,"Страница была закрыта или перезагружена во время теста"); return true; }
    if(Date.now()>=S.quiz.deadline) expire();
    else if(S.quiz.answers[S.quiz.currentIdx]) advance(false);
    else render();
    return true;
  }catch(e){ return false; }
}

/* ========== FINISH ========== */
async function finishQuiz(timedOut,violationReason){
  const Q = S.quiz;
  if(!Q || Q.finished) return;
  Q.finished = true; S.fsArmed = false; leaveFs();
  if(Q.timerHandle) clearInterval(Q.timerHandle);

  const answers = Q.questions.map((q,i)=>{
    const a = Q.answers[i];
    return {
      l: q.l,
      q: q.q,
      chosen: a ? q.displayOptions[a.chosenIdx] : null,
      chosenIdx: a ? a.chosenIdx : null,
      correct: a ? a.chosenIdx === q.correctDisplayIdx : false,
      correctText: q.displayOptions[q.correctDisplayIdx],
      explanation: q.e,
      k: q.k,
      c: q.c || null
    };
  });

  const correct = answers.filter(x=>x.correct).length;
  const wrong = answers.filter(x=>!x.correct && x.chosen !== null).length;
  const unanswered = answers.filter(x=>x.chosen === null).length;
  const total = answers.length;
  const percent = total ? Math.round((correct/total)*100) : 0;
  const grade = percent>=90?5:percent>=70?4:percent>=50?3:2;

  const byLecture = {};
  answers.forEach(x=>{
    if(!byLecture[x.l]) byLecture[x.l] = {correct:0,total:0};
    byLecture[x.l].total++;
    if(x.correct) byLecture[x.l].correct++;
  });

  const result = {
    score: correct, wrong, unanswered, total, percent, grade,
    mode: "Экзамен (60 с/вопрос)",
    byLecture, answers,
    timedOut: !!timedOut,
    violation: violationReason || null,
    duration: Math.round((Date.now() - Q.startedAt)/1000)
  };

  S.results = result; S.quiz = null; S.view = "results"; render();
  // Natijani yuborish: internet uzilsa ham ekran darrov ochiladi, yuborish qayta-qayta uriniladi
  (async()=>{
    for(let t=0;t<5;t++){
      try{
        await update(ref(db,"students/"+S.studentId),{status:"finished",finishedAt:Date.now(),result,progress:{answered:total-unanswered,total,current:total}});
        localStorage.removeItem(QUIZ_STATE_KEY); return;
      }catch(e){ await new Promise(r=>setTimeout(r,2000)); }
    }
    alert("Не удалось отправить результат. Проверьте интернет и сообщите преподавателю.");
  })();
}

/* ========== RESULTS ========== */
function ansBox(a,t){ t=(t==null?"—":String(t)); return (a.k&&a.k!=="theory") ? `<pre>${highlightCode(t)}</pre>` : `<b>${escapeHtml(t)}</b>`; }
function renderResults(app){
  const r = S.results;
  if(!r){ S.view = "waiting"; render(); return; }

  const lecRows = Object.entries(r.byLecture).sort((a,b)=>+a[0]-+b[0]).map(([l,v])=>{
    const p = v.total ? Math.round(v.correct/v.total*100) : 0;
    const cls = p>=70?"high":p>=40?"":"low";
    return `<div class="lrow"><b>Тема ${escapeHtml(l)}</b>
      <div class="bar"><i class="${cls}" style="width:${p}%"></i></div>
      <span class="num">${v.correct}/${v.total}</span></div>`;
  }).join("");

  const reviewRows = r.answers.map((a,i)=>{
    const ok = a.correct;
    return `<div class="review">
      <div><b>${i+1}.</b> Тема ${a.l} —
        <span class="${ok?'ok-tag':'no-tag'}">${ok?"Верно ✓":"Неверно ✕"}</span></div>
      <div>${escapeHtml(a.q)}</div>${a.c?`<pre>${highlightCode(a.c)}</pre>`:""}
      <div class="muted small">Ваш ответ:</div>${ansBox(a,a.chosen)}
      ${!ok?`<div class="muted small">Правильный ответ:</div>${ansBox(a,a.correctText)}`:""}
      <div class="muted small">${escapeHtml(a.explanation||"")}</div>
    </div>`;
  }).join("");

  app.innerHTML = `
    <header class="hero ${r.percent>=70?'good':r.percent>=50?'':'bad'}">
      <div>
        <div class="eyebrow">РЕЗУЛЬТАТ</div>
        <h1>Тест завершён</h1>
        ${r.timedOut?`<p style="font-weight:700;margin-top:6px;">⏰ Время вышло</p>`:""}
        ${r.violation?`<p style="font-weight:700;margin-top:6px;">⚠ Тест завершён досрочно: ${escapeHtml(r.violation)}</p>`:""}
      </div>
    </header>
    <section class="score">
      <div class="tile"><div class="big">${r.score}</div><div class="lbl">Верно</div></div>
      <div class="tile"><div class="big">${r.wrong}</div><div class="lbl">Неверно</div></div>
      <div class="tile"><div class="big">${r.unanswered}</div><div class="lbl">Пропущено</div></div>
      <div class="tile"><div class="big">${r.percent}%</div><div class="lbl">Процент</div></div>
      <div class="tile grade"><div class="big">${r.grade}</div><div class="lbl">Оценка</div></div>
    </section>
    <section class="card"><h2>Темы</h2>${lecRows}</section>
    <section class="card"><h2>Разбор вопросов</h2>${reviewRows}</section>
    <section class="note no">
      <b>Внимание:</b> Тест можно пройти только один раз. Повторная попытка невозможна.
    </section>
  `;
}

/* ========== БЕЗОПАСНОСТЬ ========== */
const LEFT_KEY = "cpp_left_flag_v1";
const secActive = () => !!(S.quiz && S.view === "quiz" && !S.quiz.finished);
const secScreen = () => secActive() || S.view === "results";
let secSuspend = false;
function askConfirm(msg){ secSuspend = true; const ok = confirm(msg); setTimeout(()=>{ secSuspend = false; }, 700); return ok; }
const shield = document.createElement("div"); shield.id = "shield"; shield.innerHTML = "<div>🔒 Экран скрыт в целях безопасности</div>"; document.body.appendChild(shield);
const wm = document.createElement("div"); wm.id = "wm"; document.body.appendChild(wm);
const gate = document.createElement("div"); gate.id = "fsgate";
gate.innerHTML = '<div><h2>Полноэкранный режим обязателен</h2><p>Тест идёт, время не останавливается. Нажмите кнопку, чтобы продолжить.</p><button class="btn primary big" id="fsBtn">Продолжить в полноэкранном режиме</button></div>';
document.body.appendChild(gate);
let shieldTimer = null;
function showShield(ms){ document.body.classList.add("shielded"); clearTimeout(shieldTimer); if(ms) shieldTimer = setTimeout(hideShield, ms); }
function hideShield(){ if(document.hasFocus() && !document.hidden) document.body.classList.remove("shielded"); }
function setWatermark(){
  const on = !!(S.student && (S.view === "quiz" || S.view === "results"));
  wm.style.display = on ? "block" : "none"; if(!on) return;
  const txt = escapeHtml((S.student.surname||"") + " " + (S.student.name||"") + " · " + (S.student.group||""));
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='340' height='190'><text x='20' y='105' transform='rotate(-24 170 95)' fill='white' fill-opacity='0.085' font-size='19' font-family='sans-serif' font-weight='600'>" + txt + "</text></svg>";
  wm.style.backgroundImage = 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
}
function violation(reason){
  if(secSuspend || Date.now() < (S.secGraceUntil||0)) return;
  showShield();
  if(secActive()) finishQuiz(false, reason);
}
/* Фуллскрин */
const fsOK = () => !!document.documentElement.requestFullscreen;
function enterFs(){ try{ const p = document.documentElement.requestFullscreen({navigationUI:"hide"}); if(p && p.catch) p.catch(()=>{}); }catch(e){} }
function leaveFs(){ try{ if(document.fullscreenElement){ const p = document.exitFullscreen(); if(p && p.catch) p.catch(()=>{}); } }catch(e){} }
document.addEventListener("fullscreenchange", () => {
  if(document.fullscreenElement){ S.fsArmed = true; document.body.classList.remove("gated"); }
  else if(S.fsArmed && secActive()){ S.fsArmed = false; if(Date.now() >= (S.secGraceUntil||0)) violation("выход из полноэкранного режима"); }
});
document.getElementById("fsBtn").addEventListener("click", enterFs);
document.addEventListener("pointerdown", () => { if(secActive() && fsOK() && !document.fullscreenElement) enterFs(); }, true);
setInterval(() => {
  const need = secActive() && fsOK() && !document.fullscreenElement && Date.now() > (S.fsGraceUntil||0);
  document.body.classList.toggle("gated", need);
}, 1000);
/* Уход со страницы / вкладки / окна */
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ if(secScreen()) showShield(); if(secActive()) violation("переход на другую вкладку или в другое окно"); }
  else hideShield();
});
window.addEventListener("blur", () => {
  if(secSuspend) return;
  if(secScreen() && Date.now() >= (S.secGraceUntil||0)) showShield();
  setTimeout(() => {
    if(secSuspend || !secActive()) return;
    if(!document.hasFocus() || document.hidden) violation("окно потеряло фокус (переход в другую программу)");
    else hideShield();
  }, 1000);
});
window.addEventListener("focus", hideShield);
window.addEventListener("beforeunload", e => { if(secActive()){ e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("pagehide", () => { if(secActive()) try{ localStorage.setItem(LEFT_KEY, "1"); }catch(_){} });
window.addEventListener("beforeprint", () => { showShield(); if(secActive()) violation("попытка печати"); });
history.pushState({q:1}, "", location.href);
window.addEventListener("popstate", () => { history.pushState({q:1}, "", location.href); });
/* Клавиши */
function onKey(e){
  const k = e.key || "", kl = k.toLowerCase(), c = e.ctrlKey || e.metaKey;
  const shot = k === "PrintScreen" || k === "Snapshot" || (e.metaKey && e.shiftKey && kl === "s") || (e.metaKey && e.shiftKey && (kl === "3" || kl === "4" || kl === "5"));
  if(shot){ e.preventDefault(); try{ navigator.clipboard.writeText("").catch(function(){}); }catch(_){} showShield(3000); if(secActive()) violation("попытка сделать снимок экрана"); return; }
  if(k === "F11" && e.type === "keydown"){ e.preventDefault(); if(secActive() && fsOK() && !document.fullscreenElement) enterFs(); return; }
  if(!secScreen() || e.type !== "keydown") return;
  const dev = k === "F12" || (c && e.shiftKey && /^(i|j|c)$/.test(kl)) || (c && kl === "u");
  if(dev){ e.preventDefault(); if(secActive()) violation("попытка открыть инструменты разработчика"); return; }
  if(k === "F5" || (c && /^(r|s|p|a|c|x|v|f|g)$/.test(kl))) e.preventDefault();
}
document.addEventListener("keydown", onKey, true);
document.addEventListener("keyup", onKey, true);
["contextmenu","copy","cut","paste","dragstart","selectstart"].forEach(ev => document.addEventListener(ev, e => {
  if(secScreen() && !(e.target.closest && e.target.closest("input,textarea"))) e.preventDefault();
}));

/* ========== INIT ========== */
boot();

});
</script>
