{"l":11,"k":"theory","q":"В каком порядке выполняются части цикла for (инициализация; условие; изменение)?","o":["Инициализация, затем по кругу: условие - тело - изменение счётчика","Инициализация - тело - условие - изменение","Условие - инициализация - тело - изменение","Изменение - условие - тело - инициализация"],"e":"Инициализация выполняется один раз; условие проверяется перед каждым повторением."},
{"l":11,"k":"theory","q":"Сколько раз выполнится тело цикла for (int i = 0; i < 5; i++) ?","o":["5","4","6","Бесконечно"],"e":"i принимает значения 0, 1, 2, 3, 4."},
{"l":11,"k":"theory","q":"Внешний цикл выполняется 3 раза, внутренний - 4 раза. Сколько раз выполнится тело внутреннего цикла?","o":["12","7","4","3"],"e":"Количество повторений перемножается: 3 * 4."},
{"l":11,"k":"theory","q":"Когда цикл for удобнее цикла while?","o":["Когда количество повторений известно заранее","Когда цикл должен выполниться хотя бы один раз","Когда условие зависит от ввода пользователя","Когда цикл бесконечный"],"e":"В for счётчик, условие и шаг записаны в одной строке."},
{"l":11,"k":"theory","q":"Где доступна переменная i, объявленная в заголовке for (int i = 0; ...)?","o":["Только внутри этого цикла","Во всей функции main","Во всей программе","Только в первой итерации"],"e":"После цикла имя i неизвестно компилятору."},
{"l":11,"k":"theory","q":"Что произойдёт, если после заголовка for поставить лишнюю точку с запятой: for (...); { ... } ?","o":["Тело цикла станет пустым, а блок в скобках выполнится один раз","Ошибка компиляции","Цикл выполнится в два раза больше","Ничего не изменится"],"e":"Точка с запятой - пустой оператор, который и становится телом цикла."},
{"l":11,"k":"theory","q":"Почему во вложенных циклах счётчикам дают разные имена (i и j)?","o":["Чтобы внутренний цикл не скрывал и не портил счётчик внешнего","Так требует компилятор для любых двух циклов","Буква j работает быстрее","Чтобы циклы выполнялись одновременно"],"e":"Один счётчик на два цикла приводит к неверному числу повторений."},
{"l":11,"k":"code","q":"Какой фрагмент компилируется и выводит обратный отсчёт 5 4 3 2 1?","o":["for (int i = 5; i >= 1; i--) cout << i << \" \";","for (int i = 5; i >= 1; i++) cout << i << \" \";","for (int i = 5; i <= 1; i--) cout << i << \" \";","for (int i = 5, i >= 1, i--) cout << i << \" \";"],"e":"Счётчик должен уменьшаться; условие i <= 1 сразу ложно; части заголовка разделяют точкой с запятой."},
{"l":11,"k":"code","q":"Какой фрагмент компилируется и выводит чётные числа 2 4 6 8 10?","o":["for (int i = 2; i <= 10; i += 2) cout << i << \" \";","for (int i = 2; i <= 10; i + 2) cout << i << \" \";","for (int i = 2; i <= 10; i++2) cout << i << \" \";","for (int i = 1; i <= 10; i += 2) cout << i << \" \";"],"e":"i + 2 не изменяет счётчик - цикл бесконечный; шаг 2 записывают как i += 2; начинать нужно с чётного числа."},
{"l":11,"k":"code","q":"Пользователь вводит n = 5. Какой фрагмент компилируется и выводит сумму от 1 до n (15)?","o":["int n, sum = 0;\ncin >> n;\nfor (int i = 1; i <= n; i++) sum += i;\ncout << sum;","int n, sum = 0;\ncin >> n;\nfor (int i = 1; i <= n; i++);\nsum += i;\ncout << sum;","int n, sum = 0;\ncin >> n;\nfor (int i = 1; i < n; i++) sum += i;\ncout << sum;","int n, sum = 0;\ncin >> n;\nfor (int i = 1; i <= n; i++) sum =+ i;\ncout << sum;"],"e":"Лишняя ; после for делает тело пустым, а i вне цикла не существует; i < n теряет последнее слагаемое; =+ присваивает, а не накапливает."},
{"l":11,"k":"code","q":"Какой фрагмент компилируется и вычисляет факториал 5 (120)?","o":["int n = 5;\nlong long f = 1;\nfor (int i = 2; i <= n; i++) f *= i;\ncout << f;","int n = 5;\nlong long f = 0;\nfor (int i = 2; i <= n; i++) f *= i;\ncout << f;","int n = 5;\nlong long f = 1;\nfor (int i = 2; i <= n) f *= i;\ncout << f;","int n = 5;\nlong long f = 1;\nfor (int i = 2; i <= n; i++) f = i;\ncout << f;"],"e":"Произведение начинают с 1; в заголовке for всегда две точки с запятой; f = i не накапливает произведение."},
{"l":11,"k":"code","q":"Какой фрагмент компилируется и выводит числа от 1 до 3 и их квадраты?","o":["for (int i = 1; i <= 3; i++) {\n    cout << i << \" \" << i * i << endl;\n}","for (int i = 1; i <= 3; i++) {\n    cout << i << \" \" << i ^ 2 << endl;\n}","for (int i = 1; i <= 3; i++) {\n    cout << i << \" \" << i * 2 << endl;\n}","for (int i = 1; i <= 3; i++);\n{\n    cout << i << \" \" << i * i << endl;\n}"],"e":"Оператора степени ^ в C++ нет; i * 2 - это удвоение; после ; переменная i в блоке уже не видна."},
{"l":11,"k":"code","q":"Пользователь вводит количество 3 и числа 4 5 7. Какой фрагмент компилируется и выводит среднее 5.33333?","o":["int n;\ncin >> n;\ndouble sum = 0;\nfor (int i = 0; i < n; i++) {\n    double x;\n    cin >> x;\n    sum += x;\n}\ncout << sum / n;","int n;\ncin >> n;\ndouble sum = 0;\nfor (int i = 1; i < n; i++) {\n    double x;\n    cin >> x;\n    sum += x;\n}\ncout << sum / n;","int n;\ncin >> n;\nint sum = 0;\nfor (int i = 0; i < n; i++) {\n    double x;\n    cin >> x;\n    sum += x;\n}\ncout << sum / n;","int n;\ncin >> n;\ndouble sum = 0;\nfor (int i = 0; i < n; i++) {\n    cin >> x;\n    double x;\n    sum += x;\n}\ncout << sum / n;"],"e":"Цикл от 1 до n - 1 считывает на одно число меньше; целая сумма даёт целочисленное деление; переменную объявляют до ввода."},
{"l":11,"k":"code","q":"Пользователь вводит 3 -1 4 0 -5. Какой фрагмент компилируется и выводит количество положительных чисел (2)?","o":["int cnt = 0;\nfor (int i = 0; i < 5; i++) {\n    int x;\n    cin >> x;\n    if (x > 0) cnt++;\n}\ncout << cnt;","int cnt = 0;\nfor (int i = 0; i < 5; i++) {\n    int x;\n    cin >> x;\n    if (x >= 0) cnt++;\n}\ncout << cnt;","int cnt = 0;\nfor (int i = 0; i < 5; i++) {\n    int x;\n    cin >> x;\n    if (x > 0);\n    cnt++;\n}\ncout << cnt;","int cnt = 0;\nfor (int i = 0; i < 5; i++) {\n    int x;\n    cin >> x;\n    if (x > 0) cnt++\n}\ncout << cnt;"],"e":"Ноль не является положительным числом; ; после условия делает увеличение счётчика безусловным; после оператора нужна точка с запятой."},
{"l":11,"k":"code","q":"Пользователь вводит количество 4 и числа -5 -2 -9 -3. Какой фрагмент правильно находит максимум (-2)?","o":["int n, x, mx;\ncin >> n >> mx;\nfor (int i = 1; i < n; i++) {\n    cin >> x;\n    if (x > mx) mx = x;\n}\ncout << mx;","int n, x, mx;\ncin >> n;\nmx = 0;\nfor (int i = 1; i < n; i++) {\n    cin >> x;\n    if (x > mx) mx = x;\n}\ncout << mx;","int n, x, mx;\ncin >> n >> mx;\nfor (int i = 1; i < n; i++) {\n    cin >> x;\n    if (x < mx) mx = x;\n}\ncout << mx;","int n, x, mx;\ncin >> n >> mx;\nfor (int i = 1; i < n; i++) {\n    cin >> x;\n    if (x > mx) x = mx;\n}\ncout << mx;"],"e":"Начальным максимумом берут первое число, а не 0 (иначе для отрицательных чисел ответ неверный); знак сравнения >; обновляется mx."},
{"l":11,"k":"code","q":"Какой фрагмент компилируется и выводит прямоугольник из звёздочек: 2 строки по 4?","o":["for (int i = 0; i < 2; i++) {\n    for (int j = 0; j < 4; j++) cout << \"*\";\n    cout << endl;\n}","for (int i = 0; i < 2; i++) {\n    for (int j = 0; j < 4; i++) cout << \"*\";\n    cout << endl;\n}","for (int i = 0; i < 2; i++) {\n    for (int j = 0; j < 4; j++) cout << \"*\" << endl;\n}","for (int i = 0; i < 2; i++) for (int j = 0; j < 4; j++) cout << \"*\";\ncout << endl;\n}"],"e":"Во внутреннем цикле должен меняться j; перевод строки делают после внутреннего цикла, а не после каждой звёздочки; скобки должны быть парными."},
{"l":11,"k":"code","q":"Какой фрагмент выводит треугольник: в первой строке 1 звёздочка, во второй 2, в третьей 3?","o":["for (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= i; j++) cout << \"*\";\n    cout << endl;\n}","for (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= 3; j++) cout << \"*\";\n    cout << endl;\n}","for (int i = 1; i <= 3; i++) {\n    for (int j = 1; j < i; j++) cout << \"*\";\n    cout << endl;\n}","for (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= i; j--) cout << \"*\";\n    cout << endl;\n}"],"e":"Граница внутреннего цикла зависит от номера строки i; при j < i звёздочек на одну меньше; j-- делает цикл бесконечным."},
{"l":11,"k":"code","q":"Какой фрагмент компилируется и выводит таблицу умножения 3 на 3?","o":["for (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= 3; j++) cout << i * j << \" \";\n    cout << endl;\n}","for (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= 3; j++) cout << i * i << \" \";\n    cout << endl;\n}","for (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= 3; j++;) cout << i * j << \" \";\n    cout << endl;\n}","for (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= 3; j++) cout << i * j << \" \" cout << endl;\n}"],"e":"В таблице перемножаются номер строки и номер столбца; после изменения счётчика в заголовке for нет точки с запятой."},
{"l":11,"k":"code","q":"Какой фрагмент правильно определяет, простое ли введённое число (1 - простое, 0 - нет)?","o":["int n;\ncin >> n;\nbool prime = n > 1;\nfor (int d = 2; d * d <= n; d++) if (n % d == 0) prime = false;\ncout << prime;","int n;\ncin >> n;\nbool prime = n > 1;\nfor (int d = 1; d * d <= n; d++) if (n % d == 0) prime = false;\ncout << prime;","int n;\ncin >> n;\nbool prime = n > 1;\nfor (int d = 2; d * d <= n; d++) if (n / d == 0) prime = false;\ncout << prime;","int n;\ncin >> n;\nbool prime = n > 1;\nfor (int d = 2; d * d <= n; d++) if (n % d == 0) prime == false;\ncout << prime;"],"e":"Делители перебирают с 2 (на 1 делится любое число); делимость проверяют остатком; == не изменяет переменную."},
{"l":11,"k":"code","q":"Какой фрагмент компилируется и выводит сумму нечётных чисел от 1 до 9 (25)?","o":["int sum = 0;\nfor (int i = 1; i <= 9; i += 2) sum += i;\ncout << sum;","int sum = 0;\nfor (int i = 1; i <= 9; i =+ 2) sum += i;\ncout << sum;","int sum = 0;\nfor (int i = 0; i <= 9; i += 2) sum += i;\ncout << sum;","int sum = 0;\nfor (int i = 1; i =< 9; i += 2) sum += i;\ncout << sum;"],"e":"i =+ 2 каждый раз присваивает 2 - цикл бесконечный; начинать нужно с 1; оператор пишется <=."},
{"l":11,"k":"code","q":"Какой фрагмент компилируется и выводит значение счётчика после цикла (4)?","o":["int i;\nfor (i = 0; i < 4; i++) {\n}\ncout << i;","for (int i = 0; i < 4; i++) {\n}\ncout << i;","int i;\nfor (i = 0; i <= 4; i++) {\n}\ncout << i;","int i;\nfor (i = 0; i < 4; i++) cout << i;"],"e":"Счётчик, объявленный в заголовке for, после цикла недоступен; без пустого тела вывод попадает внутрь цикла."},

{"l":12,"k":"theory","q":"Что делает оператор break внутри цикла?","o":["Немедленно завершает ближайший цикл","Пропускает одну итерацию","Завершает программу","Переходит к началу цикла"],"e":"После break выполняется код, стоящий за циклом."},
{"l":12,"k":"theory","q":"Оператор break стоит во внутреннем из двух вложенных циклов. Что он завершит?","o":["Только внутренний цикл","Оба цикла","Только внешний цикл","Всю функцию"],"e":"break выходит из одного, ближайшего цикла."},
{"l":12,"k":"theory","q":"Что делает оператор goto?","o":["Выполняет безусловный переход к метке","Завершает цикл","Вызывает функцию","Проверяет условие"],"e":"goto label; переносит выполнение к метке label."},
{"l":12,"k":"theory","q":"Как записывается метка для оператора goto?","o":["Имя и двоеточие: label:","Имя и точка с запятой: label;","Имя в кавычках: \"label\"","Решётка и имя: #label"],"e":"Метка - это имя с двоеточием."},
{"l":12,"k":"theory","q":"Почему оператор goto не рекомендуют использовать в реальных программах?","o":["Он делает программу запутанной и трудной для отладки","Он работает медленнее циклов","Он запрещён стандартом C++","Он не компилируется в современных компиляторах"],"e":"Вместо goto применяют циклы, функции и условия."},
{"l":12,"k":"theory","q":"Чем опасен continue в цикле while?","o":["Если счётчик изменяется после continue, цикл может стать бесконечным","continue всегда завершает программу","continue нельзя использовать в while","continue обнуляет счётчик"],"e":"continue пропускает остаток тела, включая изменение счётчика, стоящее ниже."},
{"l":12,"k":"theory","q":"Как выйти сразу из двух вложенных циклов без goto?","o":["Завести логический флаг и проверять его в условии внешнего цикла","Написать break два раза подряд","Написать continue во внешнем цикле","Это невозможно"],"e":"Второй break после первого никогда не выполнится - нужен флаг."},
{"l":12,"k":"code","q":"Пользователь вводит 3 7 8 5 10. Какой фрагмент выводит только первое чётное число (8)?","o":["int x;\nwhile (cin >> x) {\n    if (x % 2 == 0) {\n        cout << x;\n        break;\n    }\n}","int x;\nwhile (cin >> x) {\n    if (x % 2 == 0) {\n        cout << x;\n        continue;\n    }\n}","int x;\nwhile (cin >> x) {\n    if (x % 2 == 0) {\n        break;\n        cout << x;\n    }\n}","int x;\nwhile (cin >> x) {\n    if (x % 2 == 0) cout << x;\n    break;\n}"],"e":"continue не останавливает поиск; вывод после break не выполняется; без { } break срабатывает на первом же числе."},
{"l":12,"k":"code","q":"Какой фрагмент компилируется и выводит 1 2 3 4, останавливаясь на числе 5?","o":["for (int i = 1; i <= 10; i++) {\n    if (i == 5) break;\n    cout << i << \" \";\n}","for (int i = 1; i <= 10; i++) {\n    if (i = 5) break;\n    cout << i << \" \";\n}","for (int i = 1; i <= 10; i++) {\n    if (i == 5) break cout << i << \" \";\n}","for (int i = 1; i <= 10; i++) {\n    cout << i << \" \";\n    if (i == 5) break;\n}"],"e":"i = 5 - присваивание, цикл прерывается сразу; после break нужна ; проверка должна стоять до вывода."},
{"l":12,"k":"code","q":"Какой фрагмент компилируется и выводит числа от 1 до 5, пропуская 3?","o":["for (int i = 1; i <= 5; i++) {\n    if (i == 3) continue;\n    cout << i << \" \";\n}","for (int i = 1; i <= 5; i++) {\n    if (i == 3) break;\n    cout << i << \" \";\n}","for (int i = 1; i <= 5; i++) {\n    if (i == 3) skip;\n    cout << i << \" \";\n}","for (int i = 1; i <= 5; i++) {\n    if (i == 3);\n    continue;\n    cout << i << \" \";\n}"],"e":"break завершает цикл, а не пропускает число; оператора skip нет; ; после условия делает continue безусловным."},
{"l":12,"k":"code","q":"Пользователь вводит 4 -2 5 0 1. Какой фрагмент выводит сумму только положительных чисел (10)?","o":["int sum = 0;\nfor (int i = 0; i < 5; i++) {\n    int x;\n    cin >> x;\n    if (x <= 0) continue;\n    sum += x;\n}\ncout << sum;","int sum = 0;\nfor (int i = 0; i < 5; i++) {\n    int x;\n    cin >> x;\n    if (x > 0) continue;\n    sum += x;\n}\ncout << sum;","int sum = 0;\nfor (int i = 0; i < 5; i++) {\n    int x;\n    cin >> x;\n    if (x <= 0) break;\n    sum += x;\n}\ncout << sum;","int sum = 0;\nfor (int i = 0; i < 5; i++) {\n    int x;\n    cin >> x;\n    sum += x;\n    if (x <= 0) continue;\n}\ncout << sum;"],"e":"Пропускать нужно неположительные числа; break прекращает ввод; проверка должна стоять до прибавления."},
{"l":12,"k":"code","q":"Пользователь вводит 1 2 0. Какой фрагмент компилируется и выводит 2 4 bye?","o":["int choice;\nwhile (true) {\n    cin >> choice;\n    if (choice == 0) break;\n    cout << choice * 2 << \" \";\n}\ncout << \"bye\";","int choice;\nwhile (true) {\n    cin >> choice;\n    cout << choice * 2 << \" \";\n}\ncout << \"bye\";","int choice;\nwhile (true) {\n    cin >> choice;\n    if (choice == 0) return 0;\n    cout << choice * 2 << \" \";\n}\ncout << \"bye\";","int choice;\nwhile (1 = 1) {\n    cin >> choice;\n    if (choice == 0) break;\n    cout << choice * 2 << \" \";\n}\ncout << \"bye\";"],"e":"Без break бесконечный цикл не завершится; return 0 завершает всю программу, и bye не выводится; сравнение пишется ==."},
{"l":12,"k":"code","q":"Какой фрагмент компилируется и выводит 1245 (числа от 1 до 5 без тройки)?","o":["int i = 0;\nwhile (i < 5) {\n    i++;\n    if (i == 3) continue;\n    cout << i;\n}","int i = 0;\nwhile (i < 5) {\n    if (i == 3) continue;\n    cout << i;\n    i++;\n}","int i = 1;\nwhile (i < 5) {\n    i++;\n    if (i == 3) continue;\n    cout << i;\n}","int i = 0;\nwhile (i < 5) {\n    i++;\n    if (i == 3) continue i;\n    cout << i;\n}"],"e":"Счётчик нужно изменить до continue, иначе цикл зависнет на тройке; у continue нет аргументов."},
{"l":12,"k":"code","q":"Какой фрагмент выводит 11 21 31 (внутренний цикл прерывается при j = 2)?","o":["for (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= 3; j++) {\n        if (j == 2) break;\n        cout << i << j << \" \";\n    }\n}","for (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= 3; j++) {\n        if (i == 2) break;\n        cout << i << j << \" \";\n    }\n}","for (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= 3; j++) {\n        if (j == 2) continue;\n        cout << i << j << \" \";\n    }\n}","for (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= 3; j++) {\n        cout << i << j << \" \";\n        if (j == 2) break;\n    }\n}"],"e":"Проверяется счётчик внутреннего цикла; continue только пропускает одну пару; проверка должна стоять до вывода."},
{"l":12,"k":"code","q":"Нужно найти первую пару чисел от 1 до 3, произведение которых равно 6, и остановить оба цикла. Какой фрагмент компилируется и выводит только 2 3?","o":["bool found = false;\nfor (int i = 1; i <= 3 && !found; i++) {\n    for (int j = 1; j <= 3; j++) {\n        if (i * j == 6) {\n            cout << i << \" \" << j;\n            found = true;\n            break;\n        }\n    }\n}","bool found = false;\nfor (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= 3; j++) {\n        if (i * j == 6) {\n            cout << i << \" \" << j;\n            found = true;\n            break;\n        }\n    }\n}","bool found = false;\nfor (int i = 1; i <= 3 && !found; i++) {\n    for (int j = 1; j <= 3; j++) {\n        if (i * j == 6) {\n            cout << i << \" \" << j;\n            break;\n            found = true;\n        }\n    }\n}","bool found = false;\nfor (int i = 1; i <= 3 && found!; i++) {\n    for (int j = 1; j <= 3; j++) {\n        if (i * j == 6) {\n            cout << i << \" \" << j;\n            found = true;\n            break;\n        }\n    }\n}"],"e":"break выходит только из внутреннего цикла, внешний останавливает флаг; флаг нужно установить до break."},
{"l":12,"k":"code","q":"Какой фрагмент с goto компилируется и выводит 123?","o":["int i = 1;\nstart: if (i <= 3) {\n    cout << i;\n    i++;\n    goto start;\n}","int i = 1;\nstart;\nif (i <= 3) {\n    cout << i;\n    i++;\n    goto start;\n}","int i = 1;\nstart: if (i <= 3) {\n    cout << i;\n    i++;\n    goto begin;\n}","int i = 1;\nstart: if (i <= 3) {\n    cout << i;\n    goto start;\n    i++;\n}"],"e":"Метка заканчивается двоеточием; переходить можно только к существующей метке; i++ после goto не выполняется - цикл бесконечный."},
{"l":12,"k":"code","q":"Пользователь вводит -3 0 8. Какой фрагмент компилируется и повторяет ввод, пока число не станет положительным (выводит 8)?","o":["int n;\nagain: cin >> n;\nif (n <= 0) goto again;\ncout << n;","int n;\nagain: cin >> n;\nif (n <= 0) goto again cout << n;","int n;\nagain cin >> n;\nif (n <= 0) goto again;\ncout << n;","int n;\nagain: cin >> n;\nif (n > 0) goto again;\ncout << n;"],"e":"После goto нужна ; метка пишется с двоеточием; повторять ввод нужно при неположительном числе."},
{"l":12,"k":"code","q":"Пользователь вводит делители 5 0 4. Какой фрагмент пропускает деление на ноль и выводит 20 skip 25?","o":["for (int i = 0; i < 3; i++) {\n    int d;\n    cin >> d;\n    if (d == 0) {\n        cout << \"skip \";\n        continue;\n    }\n    cout << 100 / d << \" \";\n}","for (int i = 0; i < 3; i++) {\n    int d;\n    cin >> d;\n    if (d == 0) {\n        cout << \"skip \";\n    }\n    cout << 100 / d << \" \";\n}","for (int i = 0; i < 3; i++) {\n    int d;\n    cin >> d;\n    if (d == 0) {\n        cout << \"skip \";\n        break;\n    }\n    cout << 100 / d << \" \";\n}","for (int i = 0; i < 3; i++) {\n    int d;\n    cin >> d;\n    if (d = 0) {\n        cout << \"skip \";\n        continue;\n    }\n    cout << 100 / d << \" \";\n}"],"e":"Без continue деление на ноль всё равно выполнится; break прекращает обработку остальных чисел; d = 0 - присваивание."},
{"l":12,"k":"code","q":"Пользователь вводит 5 3 8 0 4. Какой фрагмент выводит количество чисел до первого нуля (3)?","o":["int x, cnt = 0;\nwhile (cin >> x) {\n    if (x == 0) break;\n    cnt++;\n}\ncout << cnt;","int x, cnt = 0;\nwhile (cin >> x) {\n    cnt++;\n    if (x == 0) break;\n}\ncout << cnt;","int x, cnt = 0;\nwhile (cin >> x) {\n    if (x == 0) continue;\n    cnt++;\n}\ncout << cnt;","int x, cnt = 0;\nwhile (cin >> x) {\n    if (x != 0) break;\n    cnt++;\n}\ncout << cnt;"],"e":"Проверка на ноль должна стоять до увеличения счётчика; continue не прекращает подсчёт."},
{"l":12,"k":"code","q":"Какой фрагмент компилируется и выводит строку без пробелов (abc)?","o":["string s = \"a b c\";\nfor (int i = 0; i < s.size(); i++) {\n    if (s[i] == ' ') continue;\n    cout << s[i];\n}","string s = \"a b c\";\nfor (int i = 0; i < s.size(); i++) {\n    if (s[i] == \" \") continue;\n    cout << s[i];\n}","string s = \"a b c\";\nfor (int i = 0; i < s.size(); i++) {\n    if (s[i] == ' ') break;\n    cout << s[i];\n}","string s = \"a b c\";\nfor (int i = 0; i < s.size(); i++) {\n    if (s[i] == '') continue;\n    cout << s[i];\n}"],"e":"Символ сравнивают с литералом в одинарных кавычках; пустого символьного литерала не существует; break остановит вывод на первом пробеле."},
{"l":12,"k":"code","q":"Какой фрагмент компилируется и выводит 1 two 3?","o":["for (int i = 1; i <= 3; i++) {\n    switch (i) {\n        case 2: cout << \"two \";\n        break;\n        default: cout << i << \" \";\n    }\n}","for (int i = 1; i <= 3; i++) {\n    switch (i) {\n        case 2: cout << \"two \";\n        default: cout << i << \" \";\n    }\n}","for (int i = 1; i <= 3; i++) {\n    switch (i) {\n        case 2: cout << \"two \";\n        break;\n        default;\n        cout << i << \" \";\n    }\n}","for (int i = 1; i <= 3; i++) {\n    switch (i) {\n        case i == 2: cout << \"two \";\n        break;\n        default: cout << i << \" \";\n    }\n}"],"e":"Без break после case 2 выполнится и default; после default ставят двоеточие; метка case должна быть константой."},
{"l":12,"k":"out","q":"Что выведет этот код?","o":["0123","01234","012356789","4"],"e":"Цикл прерывается при i = 4 до вывода.","c":"for (int i = 0; i < 10; i++) {\n    if (i == 4) break;\n    cout << i;\n}"},
{"l":12,"k":"out","q":"Что выведет этот код?","o":["024","135","0246","012345"],"e":"Нечётные числа пропускаются.","c":"for (int i = 0; i < 6; i++) {\n    if (i % 2) continue;\n    cout << i;\n}"},
{"l":12,"k":"out","q":"Что выведет этот код?","o":["3","1","9","6"],"e":"В каждой из трёх строк счётчик увеличивается только при j = 0.","c":"int c = 0;\nfor (int i = 0; i < 3; i++) {\n    for (int j = 0; j < 3; j++) {\n        if (j == 1) break;\n        c++;\n    }\n}\ncout << c;"},
{"l":12,"k":"out","q":"Что выведет этот код?","o":["8","6","7","2"],"e":"2, 4, 6, 8: при 8 условие ложно.","c":"int i = 0;\nloop: i += 2;\nif (i < 7) goto loop;\ncout << i;"},
{"l":12,"k":"out","q":"Что выведет этот код?","o":["4","6","13","9"],"e":"Складываются 1 и 3: двойка пропущена, на четвёрке цикл прерван.","c":"int s = 0;\nfor (int i = 1; i <= 5; i++) {\n    if (i == 2) continue;\n    if (i == 4) break;\n    s += i;\n}\ncout << s;"},
{"l":12,"k":"out","q":"Что выведет этот код?","o":["12","9","10","11"],"e":"3, 6, 9, 12: первое значение больше 10.","c":"int n = 0;\nwhile (true) {\n    n += 3;\n    if (n > 10) break;\n}\ncout << n;"},

{"l":13,"k":"theory","q":"Какой индекс имеет первый элемент массива в C++?","o":["0","1","-1","Зависит от размера массива"],"e":"Индексация начинается с нуля."},
{"l":13,"k":"theory","q":"Какой индекс имеет последний элемент массива из N элементов?","o":["N - 1","N","N + 1","0"],"e":"Индексы идут от 0 до N - 1."},
{"l":13,"k":"theory","q":"Что произойдёт при обращении к элементу a[N] массива из N элементов?","o":["Выход за границы массива: поведение программы не определено","Компилятор всегда выдаст ошибку","Будет получен последний элемент","Массив автоматически увеличится"],"e":"C++ не проверяет границы массива; программа может вывести мусор или завершиться аварийно."},
{"l":13,"k":"theory","q":"Каким должен быть размер классического массива int a[N]?","o":["Известным во время компиляции (константой)","Вводимым с клавиатуры","Любым выражением типа double","Обязательно чётным"],"e":"Размер обычно задают константой: const int N = 10;"},
{"l":13,"k":"theory","q":"Какие элементы может хранить один массив?","o":["Элементы одного типа","Элементы любых типов вперемешку","Только целые числа","Только константы"],"e":"Массив - набор однотипных элементов."},
{"l":13,"k":"theory","q":"Чему равны элементы a[2], a[3], a[4] после объявления int a[5] = {1, 2}; ?","o":["Нулю","Двум","Случайным значениям","Это ошибка компиляции"],"e":"Элементы без явных значений в списке инициализации обнуляются."},
{"l":13,"k":"theory","q":"Как скопировать массив a в массив b того же размера?","o":["Поэлементно в цикле: b[i] = a[i]","Одним присваиванием b = a","Оператором b == a","Массивы копировать нельзя"],"e":"Классические массивы не присваиваются целиком."},
{"l":13,"k":"code","q":"Какой фрагмент компилируется и правильно выводит все элементы массива?","o":["int a[4] = {5, 8, 2, 7};\nfor (int i = 0; i < 4; i++) cout << a[i] << \" \";","int a[4] = {5, 8, 2, 7};\nfor (int i = 0; i <= 4; i++) cout << a[i] << \" \";","int a[4] = (5, 8, 2, 7);\nfor (int i = 0; i < 4; i++) cout << a[i] << \" \";","int a[4] = {5, 8, 2, 7};\nfor (int i = 0; i < 4; i++) cout << a(i) << \" \";"],"e":"Индексы массива из 4 элементов - от 0 до 3; значения записывают в фигурных скобках, индекс - в квадратных."},
{"l":13,"k":"code","q":"Какой фрагмент с константой размера компилируется и правильно выводит последний элемент?","o":["const int N = 3;\nint a[N] = {1, 2, 3};\ncout << a[N - 1];","const int N = 3;\nint a[N] = {1, 2, 3, 4};\ncout << a[N - 1];","const int N = 3;\nint a[N] = {1, 2, 3};\ncout << a[N];","const int N;\nint a[N] = {1, 2, 3};\ncout << a[N - 1];"],"e":"Значений не может быть больше размера массива; последний элемент - a[N - 1]; константу нужно инициализировать."},
{"l":13,"k":"code","q":"Пользователь вводит 1 2 3. Какой фрагмент компилируется и правильно вводит массив (выводит сумму 6)?","o":["int a[3];\nfor (int i = 0; i < 3; i++) cin >> a[i];\ncout << a[0] + a[1] + a[2];","int a[3];\nfor (int i = 0; i < 3; i++) cin >> a;\ncout << a[0] + a[1] + a[2];","int a;\nfor (int i = 0; i < 3; i++) cin >> a[i];\ncout << a[0] + a[1] + a[2];","int a[3];\nfor (int i = 0; i < 3; i++) cin >> a[3];\ncout << a[0] + a[1] + a[2];"],"e":"Массив вводят поэлементно: cin >> a[i]; элемента a[3] в массиве из трёх элементов нет."},
{"l":13,"k":"code","q":"Какой фрагмент правильно находит сумму элементов массива (15)?","o":["int a[5] = {1, 2, 3, 4, 5};\nint sum = 0;\nfor (int i = 0; i < 5; i++) sum += a[i];\ncout << sum;","int a[5] = {1, 2, 3, 4, 5};\nint sum = 0;\nfor (int i = 0; i < 5; i++) sum += i;\ncout << sum;","int a[5] = {1, 2, 3, 4, 5};\nint sum = 0;\nfor (int i = 1; i < 5; i++) sum += a[i];\ncout << sum;","int a[5] = {1, 2, 3, 4, 5};\nint sum = 0;\nfor (int i = 0; i < 5; i++) sum = a[i];\ncout << sum;"],"e":"Складывать нужно элементы a[i], а не индексы; цикл начинается с индекса 0; сумму накапливают оператором +=."},
{"l":13,"k":"code","q":"Какой фрагмент компилируется и выводит среднее арифметическое элементов (3.75)?","o":["int a[4] = {3, 4, 4, 4};\nint sum = 0;\nfor (int i = 0; i < 4; i++) sum += a[i];\ncout << sum / 4.0;","int a[4] = {3, 4, 4, 4};\nint sum = 0;\nfor (int i = 0; i < 4; i++) sum += a[i];\ncout << sum / 4;","int a[4] = {3, 4, 4, 4};\nint sum = 0;\nfor (int i = 0; i < 4; i++) sum += a[i];\ncout << a / 4.0;","int a[4] = {3, 4, 4, 4};\nint sum;\nfor (int i = 0; i < 4; i++) sum += a[i];\ncout << sum / 4.0;"],"e":"Деление двух целых отбрасывает дробную часть; делить нужно сумму, а не сам массив; сумму обнуляют."},
{"l":13,"k":"code","q":"Какой фрагмент правильно находит максимальный элемент массива (-2)?","o":["int a[5] = {-4, -9, -2, -7, -5};\nint mx = a[0];\nfor (int i = 1; i < 5; i++) if (a[i] > mx) mx = a[i];\ncout << mx;","int a[5] = {-4, -9, -2, -7, -5};\nint mx = 0;\nfor (int i = 1; i < 5; i++) if (a[i] > mx) mx = a[i];\ncout << mx;","int a[5] = {-4, -9, -2, -7, -5};\nint mx = a[0];\nfor (int i = 1; i < 5; i++) if (a[i] < mx) mx = a[i];\ncout << mx;","int a[5] = {-4, -9, -2, -7, -5};\nint mx = a[0];\nfor (int i = 1; i < 5; i++) if (a[i] > mx) mx = i;\ncout << mx;"],"e":"Начальный максимум - первый элемент, а не 0; знак сравнения >; в mx записывают значение элемента, а не индекс."},
{"l":13,"k":"code","q":"Какой фрагмент правильно находит индекс минимального элемента (2)?","o":["int a[5] = {4, 9, 1, 7, 3};\nint idx = 0;\nfor (int i = 1; i < 5; i++) if (a[i] < a[idx]) idx = i;\ncout << idx;","int a[5] = {4, 9, 1, 7, 3};\nint idx = 0;\nfor (int i = 1; i < 5; i++) if (a[i] < idx) idx = i;\ncout << idx;","int a[5] = {4, 9, 1, 7, 3};\nint idx = 0;\nfor (int i = 1; i < 5; i++) if (a[i] < a[idx]) idx = a[i];\ncout << idx;","int a[5] = {4, 9, 1, 7, 3};\nint idx = 0;\nfor (int i = 1; i < 5; i++) if (a[i] < a[idx]) idx = i;\ncout << a[idx];"],"e":"Сравнивают элементы a[i] и a[idx]; в idx хранится индекс, а не значение; вывести нужно индекс."},
{"l":13,"k":"code","q":"Какой фрагмент компилируется и правильно проверяет, есть ли в массиве число 7 (выводит 1)?","o":["int a[5] = {4, 9, 1, 7, 3};\nint key = 7;\nbool found = false;\nfor (int i = 0; i < 5; i++) if (a[i] == key) found = true;\ncout << found;","int a[5] = {4, 9, 1, 7, 3};\nint key = 7;\nbool found = false;\nfor (int i = 0; i < 5; i++) if (a[i] == key) found = true;\nelse found = false;\ncout << found;","int a[5] = {4, 9, 1, 7, 3};\nint key = 7;\nbool found = false;\nfor (int i = 0; i < 5; i++) if (a == key) found = true;\ncout << found;","int a[5] = {4, 9, 1, 7, 3};\nint key = 7;\nbool found = false;\nfor (int i = 0; i < 5; i++) if (a[i] == key) found == true;\ncout << found;"],"e":"Ветвь else сбрасывает флаг на следующих элементах; сравнивать нужно элемент a[i]; == не изменяет флаг."},
{"l":13,"k":"code","q":"Какой фрагмент правильно выводит массив в обратном порядке (4 3 2 1)?","o":["int a[4] = {1, 2, 3, 4};\nfor (int i = 3; i >= 0; i--) cout << a[i] << \" \";","int a[4] = {1, 2, 3, 4};\nfor (int i = 4; i >= 0; i--) cout << a[i] << \" \";","int a[4] = {1, 2, 3, 4};\nfor (int i = 3; i > 0; i--) cout << a[i] << \" \";","int a[4] = {1, 2, 3, 4};\nfor (int i = 3; i >= 0; i++) cout << a[i] << \" \";"],"e":"Последний индекс - 3; элемент a[0] тоже нужно вывести; при обратном обходе индекс уменьшается."},
{"l":13,"k":"code","q":"Какой фрагмент компилируется и заменяет отрицательные элементы нулями (3 0 5 0)?","o":["int a[4] = {3, -1, 5, -8};\nfor (int i = 0; i < 4; i++) if (a[i] < 0) a[i] = 0;\nfor (int i = 0; i < 4; i++) cout << a[i] << \" \";","int a[4] = {3, -1, 5, -8};\nfor (int i = 0; i < 4; i++) if (a[i] < 0) a[i] == 0;\nfor (int i = 0; i < 4; i++) cout << a[i] << \" \";","int a[4] = {3, -1, 5, -8};\nfor (int i = 0; i < 4; i++) if (i < 0) a[i] = 0;\nfor (int i = 0; i < 4; i++) cout << a[i] << \" \";","int a[4] = {3, -1, 5, -8};\nfor (int i = 0; i < 4; i++) if (a[i] < 0) a = 0;\nfor (int i = 0; i < 4; i++) cout << a[i] << \" \";"],"e":"Замена - это присваивание =; проверять нужно элемент, а не индекс; массиву целиком нельзя присвоить число."},
{"l":13,"k":"code","q":"Какой фрагмент компилируется и правильно копирует массив a в массив b?","o":["int a[3] = {1, 2, 3};\nint b[3];\nfor (int i = 0; i < 3; i++) b[i] = a[i];\ncout << b[2];","int a[3] = {1, 2, 3};\nint b[3];\nb = a;\ncout << b[2];","int a[3] = {1, 2, 3};\nint b[3];\nfor (int i = 0; i < 3; i++) a[i] = b[i];\ncout << b[2];","int a[3] = {1, 2, 3};\nint b[];\nfor (int i = 0; i < 3; i++) b[i] = a[i];\ncout << b[2];"],"e":"Массивы копируют поэлементно; направление: b[i] = a[i]; при объявлении нужен размер."},
{"l":13,"k":"code","q":"Какой фрагмент компилируется и складывает два массива поэлементно (выводит 11 33)?","o":["int a[3] = {1, 2, 3}, b[3] = {10, 20, 30}, c[3];\nfor (int i = 0; i < 3; i++) c[i] = a[i] + b[i];\ncout << c[0] << \" \" << c[2];","int a[3] = {1, 2, 3}, b[3] = {10, 20, 30}, c[3];\nc = a + b;\ncout << c[0] << \" \" << c[2];","int a[3] = {1, 2, 3}, b[3] = {10, 20, 30}, c[3];\nfor (int i = 0; i < 3; i++) c[i] = a[i] + b[3];\ncout << c[0] << \" \" << c[2];","int a[3] = {1, 2, 3}, b[3] = {10, 20, 30}, c[3];\nfor (int i = 0; i < 3; i++) c[i] = a + b[i];\ncout << c[0] << \" \" << c[2];"],"e":"Массивы нельзя складывать целиком - только поэлементно в цикле с одинаковым индексом i."},
{"l":13,"k":"code","q":"Какой фрагмент компилируется и выводит среднюю температуру 37.3?","o":["double t[3] = {36.6, 37.2, 38.1};\ndouble sum = 0;\nfor (int i = 0; i < 3; i++) sum += t[i];\ncout << sum / 3;","int t[3] = {36.6, 37.2, 38.1};\ndouble sum = 0;\nfor (int i = 0; i < 3; i++) sum += t[i];\ncout << sum / 3;","double t[3] = {36.6, 37.2, 38.1};\nint sum = 0;\nfor (int i = 0; i < 3; i++) sum += t[i];\ncout << sum / 3;","double t[3] = {36.6, 37.2, 38.1};\ndouble sum = 0;\nfor (int i = 0; i < 3; i++) sum += t[i];\ncout << sum / t;"],"e":"Дробные значения хранят в массиве double; сумма тоже должна быть double, иначе дробные части теряются."},
{"l":13,"k":"code","q":"Какой фрагмент компилируется и правильно считает количество чётных элементов (4)?","o":["const int N = 6;\nint a[N] = {2, 5, 8, 11, 14, 4};\nint cnt = 0;\nfor (int i = 0; i < N; i++) if (a[i] % 2 == 0) cnt++;\ncout << cnt;","const int N = 6;\nint a[N] = {2, 5, 8, 11, 14, 4};\nint cnt = 0;\nfor (int i = 0; i < N; i++) if (i % 2 == 0) cnt++;\ncout << cnt;","const int N = 6;\nint a[N] = {2, 5, 8, 11, 14, 4};\nint cnt = 0;\nfor (int i = 0; i < a; i++) if (a[i] % 2 == 0) cnt++;\ncout << cnt;","const int N = 6;\nint a[n] = {2, 5, 8, 11, 14, 4};\nint cnt = 0;\nfor (int i = 0; i < N; i++) if (a[i] % 2 == 0) cnt++;\ncout << cnt;"],"e":"Проверять нужно значение элемента, а не его индекс; граница цикла - размер N; имена N и n различаются."},
{"l":13,"k":"out","q":"Что выведет этот код?","o":["60","40","80","50"],"e":"a[1] = 20, a[3] = 40: индексы считаются с нуля.","c":"int a[5] = {10, 20, 30, 40, 50};\ncout << a[1] + a[3];"},
{"l":13,"k":"out","q":"Что выведет этот код?","o":["3","6","случайное число","2"],"e":"Элементы без значений в списке равны нулю.","c":"int a[4] = {1, 2};\ncout << a[0] + a[1] + a[2] + a[3];"},
{"l":13,"k":"out","q":"Что выведет этот код?","o":["12","6","13","11"],"e":"5 + 7 = 12.","c":"int a[3] = {5, 6, 7};\na[1] = a[0] + a[2];\ncout << a[1];"},
{"l":13,"k":"out","q":"Что выведет этот код?","o":["2","1","5","3"],"e":"Единица встречается в массиве дважды.","c":"int a[5] = {3, 1, 4, 1, 5};\nint c = 0;\nfor (int i = 0; i < 5; i++) if (a[i] == 1) c++;\ncout << c;"},

{"l":13,"k":"out","q":"Что выведет этот код?","o":["5","20","4","1"],"e":"Размер массива в байтах, делённый на размер одного элемента, даёт количество элементов.","c":"int a[5] = {1, 2, 3, 4, 5};\ncout << sizeof(a) / sizeof(a[0]);"},
{"l":13,"k":"out","q":"Что выведет этот код?","o":["149","123","246","136"],"e":"Каждый элемент возводится в квадрат.","c":"int a[3] = {1, 2, 3};\nfor (int i = 0; i < 3; i++) a[i] *= a[i];\ncout << a[0] << a[1] << a[2];"},

{"l":14,"k":"theory","q":"В какой задаче массив обязателен?","o":["Вывести все введённые числа, которые больше их среднего","Найти сумму вводимых чисел","Найти максимум из вводимых чисел","Посчитать количество положительных чисел при вводе"],"e":"Среднее известно только после ввода всех чисел, а затем числа нужны повторно."},
{"l":14,"k":"theory","q":"Нужен ли массив, чтобы найти сумму чисел, вводимых с клавиатуры?","o":["Нет, достаточно одной переменной для суммы","Да, обязательно","Да, если чисел больше десяти","Да, если числа отрицательные"],"e":"Каждое число используется один раз и хранить его не нужно."},
{"l":14,"k":"theory","q":"Что хранит элемент p[i] массива префиксных сумм?","o":["Сумму элементов исходного массива с индексами от 0 до i","Сумму всех элементов массива","Разность соседних элементов","Произведение первых i элементов"],"e":"p[i] = p[i - 1] + a[i]."},
{"l":14,"k":"theory","q":"Что нужно, чтобы поменять местами два элемента массива?","o":["Временная переменная","Второй массив такого же размера","Два вложенных цикла","Сортировка массива"],"e":"t = a[i]; a[i] = a[j]; a[j] = t;"},
{"l":14,"k":"theory","q":"Сколько обменов нужно, чтобы развернуть массив из n элементов?","o":["n / 2","n","n * n","n - 1"],"e":"Меняются местами пары: первый с последним, второй с предпоследним и так далее до середины."},
{"l":14,"k":"theory","q":"Сколько элементов должно быть в массиве для подсчёта частот цифр от 0 до 9?","o":["10","9","2","100"],"e":"По одному счётчику на каждую цифру, индексы от 0 до 9."},
{"l":14,"k":"theory","q":"Цены хранятся в массиве price, количества - в массиве qty. Как связаны данные об одном товаре?","o":["Они находятся под одним и тем же индексом","Они находятся в соседних элементах одного массива","Никак не связаны","Через сумму индексов"],"e":"price[i] и qty[i] описывают один и тот же товар."},
{"l":14,"k":"code","q":"Какой фрагмент правильно выводит элементы, которые больше среднего арифметического (8 10)?","o":["int a[5] = {2, 8, 4, 10, 6};\ndouble avg = 0;\nfor (int i = 0; i < 5; i++) avg += a[i];\navg /= 5;\nfor (int i = 0; i < 5; i++) if (a[i] > avg) cout << a[i] << \" \";","int a[5] = {2, 8, 4, 10, 6};\ndouble avg = 0;\nfor (int i = 0; i < 5; i++) avg += a[i];\nfor (int i = 0; i < 5; i++) if (a[i] > avg) cout << a[i] << \" \";","int a[5] = {2, 8, 4, 10, 6};\ndouble avg = 0;\nfor (int i = 0; i < 5; i++) avg += a[i];\navg /= 5;\nfor (int i = 0; i < 5; i++) if (i > avg) cout << a[i] << \" \";","int a[5] = {2, 8, 4, 10, 6};\ndouble avg;\nfor (int i = 0; i < 5; i++) avg += a[i];\navg /= 5;\nfor (int i = 0; i < 5; i++) if (a[i] > avg) cout << a[i] << \" \";"],"e":"Сумму нужно разделить на количество; сравнивают элемент, а не индекс; накопитель обнуляют."},
{"l":14,"k":"code","q":"Какой фрагмент компилируется и считает количество дней с температурой выше 24 градусов (3)?","o":["double t[7] = {18, 22, 25, 19, 27, 30, 21};\nint cnt = 0;\nfor (int i = 0; i < 7; i++) if (t[i] > 24) cnt++;\ncout << cnt;","double t[7] = {18, 22, 25, 19, 27, 30, 21};\nint cnt = 0;\nfor (int i = 0; i < 7; i++) if (t[i] > 24) cnt = i;\ncout << cnt;","double t[7] = {18, 22, 25, 19, 27, 30, 21};\nint cnt = 0;\nfor (int i = 0; i < 7; i++) if (i > 24) cnt++;\ncout << cnt;","double t[7] = {18, 22, 25, 19, 27, 30, 21};\nint cnt = 0;\nfor (int i = 0; i < 7; i++) if (t > 24) cnt++;\ncout << cnt;"],"e":"Счётчик увеличивают на 1; сравнивают элемент t[i], а не индекс и не весь массив."},
{"l":14,"k":"code","q":"Какой фрагмент правильно находит индекс товара с кодом 310 (выводит 2)?","o":["int codes[4] = {101, 205, 310, 412};\nint key = 310, pos = -1;\nfor (int i = 0; i < 4; i++) if (codes[i] == key) {\n    pos = i;\n    break;\n}\ncout << pos;","int codes[4] = {101, 205, 310, 412};\nint key = 310, pos = -1;\nfor (int i = 0; i < 4; i++) if (codes[i] == key) {\n    pos = codes[i];\n    break;\n}\ncout << pos;","int codes[4] = {101, 205, 310, 412};\nint key = 310, pos = -1;\nfor (int i = 0; i < 4; i++) if (codes[i] == key) pos = i;\nbreak;\ncout << pos;","int codes[4] = {101, 205, 310, 412};\nint key = 310, pos = -1;\nfor (int i = 0; i < 4; i++) if (codes[i] = key) {\n    pos = i;\n    break;\n}\ncout << pos;"],"e":"В pos записывают индекс; без { } оператор break оказывается вне цикла - это ошибка компиляции; = вместо == изменяет массив."},
{"l":14,"k":"code","q":"Какой фрагмент правильно выводит разности соседних элементов (5 -2 4)?","o":["int a[4] = {3, 8, 6, 10};\nfor (int i = 1; i < 4; i++) cout << a[i] - a[i - 1] << \" \";","int a[4] = {3, 8, 6, 10};\nfor (int i = 0; i < 4; i++) cout << a[i] - a[i - 1] << \" \";","int a[4] = {3, 8, 6, 10};\nfor (int i = 1; i < 4; i++) cout << a[i - 1] - a[i] << \" \";","int a[4] = {3, 8, 6, 10};\nfor (int i = 1; i < 4; i++) cout << a[i] - a[i] - 1 << \" \";"],"e":"При i = 0 получится индекс -1; из текущего элемента вычитают предыдущий; a[i - 1] и a[i] - 1 - разные выражения."},
{"l":14,"k":"code","q":"Какой фрагмент правильно считает, сколько раз число 4 встречается в массиве (3)?","o":["int a[6] = {4, 7, 4, 2, 4, 7};\nint x = 4, cnt = 0;\nfor (int i = 0; i < 6; i++) if (a[i] == x) cnt++;\ncout << cnt;","int a[6] = {4, 7, 4, 2, 4, 7};\nint x = 4, cnt = 0;\nfor (int i = 0; i < 6; i++) if (a[i] = x) cnt++;\ncout << cnt;","int a[6] = {4, 7, 4, 2, 4, 7};\nint x = 4, cnt = 0;\nfor (int i = 0; i < 6; i++) if (a[i] == x) cnt += a[i];\ncout << cnt;","int a[6] = {4, 7, 4, 2, 4, 7};\nint x = 4, cnt = 0;\nfor (int i = 0; i < 6; i++) if (i == x) cnt++;\ncout << cnt;"],"e":"Сравнение - это ==; считают количество, а не сумму; сравнивают значение элемента, а не индекс."},
{"l":14,"k":"code","q":"Какой фрагмент правильно считает частоты цифр числа 122333 (выводит 123)?","o":["int n = 122333, freq[10] = {0};\nwhile (n > 0) {\n    freq[n % 10]++;\n    n /= 10;\n}\ncout << freq[1] << freq[2] << freq[3];","int n = 122333, freq[10];\nwhile (n > 0) {\n    freq[n % 10]++;\n    n /= 10;\n}\ncout << freq[1] << freq[2] << freq[3];","int n = 122333, freq[10] = {0};\nwhile (n > 0) {\n    freq[n / 10]++;\n    n /= 10;\n}\ncout << freq[1] << freq[2] << freq[3];","int n = 122333, freq[10] = {0};\nwhile (n > 0) {\n    freq[n % 10] = 1;\n    n /= 10;\n}\ncout << freq[1] << freq[2] << freq[3];"],"e":"Счётчики нужно обнулить; индексом служит последняя цифра n % 10; счётчик увеличивают, а не приравнивают к 1."},
{"l":14,"k":"code","q":"Какой фрагмент правильно строит префиксные суммы и выводит сумму всех элементов (12)?","o":["int a[4] = {2, 5, 1, 4}, p[4];\np[0] = a[0];\nfor (int i = 1; i < 4; i++) p[i] = p[i - 1] + a[i];\ncout << p[3];","int a[4] = {2, 5, 1, 4}, p[4];\np[0] = a[0];\nfor (int i = 1; i < 4; i++) p[i] = a[i - 1] + a[i];\ncout << p[3];","int a[4] = {2, 5, 1, 4}, p[4];\nfor (int i = 1; i < 4; i++) p[i] = p[i - 1] + a[i];\ncout << p[3];","int a[4] = {2, 5, 1, 4}, p[4];\np[0] = a[0];\nfor (int i = 1; i < 4; i++) p[i] = p[i] + a[i];\ncout << p[3];"],"e":"Новая сумма - предыдущая префиксная сумма плюс текущий элемент; p[0] нужно задать до цикла."},
{"l":14,"k":"code","q":"Какой фрагмент правильно меняет местами первый и последний элементы (выводит 321)?","o":["int a[3] = {1, 2, 3};\nint t = a[0];\na[0] = a[2];\na[2] = t;\ncout << a[0] << a[1] << a[2];","int a[3] = {1, 2, 3};\na[0] = a[2];\na[2] = a[0];\ncout << a[0] << a[1] << a[2];","int a[3] = {1, 2, 3};\nint t = a[0];\na[0] = a[2];\na[2] = a[0];\ncout << a[0] << a[1] << a[2];","int a[3] = {1, 2, 3};\nint t = a[0];\na[0] = a[2];\nt = a[2];\ncout << a[0] << a[1] << a[2];"],"e":"Без временной переменной старое значение a[0] теряется; в конце в a[2] записывают сохранённое значение t."},
{"l":14,"k":"code","q":"Какой фрагмент правильно разворачивает массив (выводит 54321)?","o":["int a[5] = {1, 2, 3, 4, 5};\nfor (int i = 0; i < 5 / 2; i++) {\n    int t = a[i];\n    a[i] = a[4 - i];\n    a[4 - i] = t;\n}\nfor (int i = 0; i < 5; i++) cout << a[i];","int a[5] = {1, 2, 3, 4, 5};\nfor (int i = 0; i < 5; i++) {\n    int t = a[i];\n    a[i] = a[4 - i];\n    a[4 - i] = t;\n}\nfor (int i = 0; i < 5; i++) cout << a[i];","int a[5] = {1, 2, 3, 4, 5};\nfor (int i = 0; i < 5 / 2; i++) {\n    int t = a[i];\n    a[i] = a[5 - i];\n    a[5 - i] = t;\n}\nfor (int i = 0; i < 5; i++) cout << a[i];","int a[5] = {1, 2, 3, 4, 5};\nfor (int i = 0; i < 5 / 2; i++) {\n    a[i] = a[4 - i];\n    a[4 - i] = a[i];\n}\nfor (int i = 0; i < 5; i++) cout << a[i];"],"e":"Обмены делают только до середины, иначе массив вернётся в исходный вид; парный индекс равен n - 1 - i; для обмена нужна временная переменная."},
{"l":14,"k":"code","q":"Какой фрагмент правильно сортирует массив выбором по возрастанию (выводит 1234)?","o":["int a[4] = {3, 1, 4, 2};\nfor (int i = 0; i < 3; i++) {\n    int m = i;\n    for (int j = i + 1; j < 4; j++) if (a[j] < a[m]) m = j;\n    int t = a[i];\n    a[i] = a[m];\n    a[m] = t;\n}\nfor (int i = 0; i < 4; i++) cout << a[i];","int a[4] = {3, 1, 4, 2};\nfor (int i = 0; i < 3; i++) {\n    int m = i;\n    for (int j = i + 1; j < 4; j++) if (a[j] > a[m]) m = j;\n    int t = a[i];\n    a[i] = a[m];\n    a[m] = t;\n}\nfor (int i = 0; i < 4; i++) cout << a[i];","int a[4] = {3, 1, 4, 2};\nfor (int i = 0; i < 3; i++) {\n    int m = i;\n    for (int j = i + 1; j < 4; j++) if (a[j] < a[m]) m = i;\n    int t = a[i];\n    a[i] = a[m];\n    a[m] = t;\n}\nfor (int i = 0; i < 4; i++) cout << a[i];","int a[4] = {3, 1, 4, 2};\nfor (int i = 0; i < 3; i++) {\n    int m = 0;\n    for (int j = i + 1; j < 4; j++) if (a[j] < a[m]) m = j;\n    int t = a[i];\n    a[i] = a[m];\n    a[m] = t;\n}\nfor (int i = 0; i < 4; i++) cout << a[i];"],"e":"Ищут индекс минимума в неотсортированной части: сравнение <, запоминается j, поиск начинается с позиции i."},
{"l":14,"k":"code","q":"Цены 2.5, 4.0, 1.25 и количества 1, 1, 2. Какой фрагмент компилируется и выводит общую стоимость 9?","o":["double price[3] = {2.5, 4.0, 1.25};\nint qty[3] = {1, 1, 2};\ndouble total = 0;\nfor (int i = 0; i < 3; i++) total += price[i] * qty[i];\ncout << total;","double price[3] = {2.5, 4.0, 1.25};\nint qty[3] = {1, 1, 2};\ndouble total = 0;\nfor (int i = 0; i < 3; i++) total += price[i] + qty[i];\ncout << total;","double price[3] = {2.5, 4.0, 1.25};\nint qty[3] = {1, 1, 2};\nint total = 0;\nfor (int i = 0; i < 3; i++) total += price[i] * qty[i];\ncout << total;","double price[3] = {2.5, 4.0, 1.25};\nint qty[3] = {1, 1, 2};\ndouble total = 0;\nfor (int i = 0; i < 3; i++) total += price * qty;\ncout << total;"],"e":"Стоимость - произведение цены на количество; сумму денег хранят в double; массивы перемножают поэлементно."},
{"l":14,"k":"code","q":"Продажи по месяцам: 120, 340, 290, 310. Какой фрагмент правильно выводит номер лучшего месяца при нумерации с 1 (2)?","o":["int sales[4] = {120, 340, 290, 310};\nint best = 0;\nfor (int i = 1; i < 4; i++) if (sales[i] > sales[best]) best = i;\ncout << best + 1;","int sales[4] = {120, 340, 290, 310};\nint best = 0;\nfor (int i = 1; i < 4; i++) if (sales[i] > sales[best]) best = i;\ncout << best;","int sales[4] = {120, 340, 290, 310};\nint best = 0;\nfor (int i = 1; i < 4; i++) if (sales[i] > best) best = i;\ncout << best + 1;","int sales[4] = {120, 340, 290, 310};\nint best = 0;\nfor (int i = 1; i < 4; i++) if (sales[i] > sales[best]) best = sales[i];\ncout << best + 1;"],"e":"Индекс на 1 меньше номера месяца; сравнивают продажи, а не продажи с индексом; в best хранится индекс."},
{"l":14,"k":"code","q":"Какой фрагмент выводит массив без нулевых элементов (4 7 9)?","o":["int a[5] = {4, 0, 7, 0, 9};\nfor (int i = 0; i < 5; i++) {\n    if (a[i] == 0) continue;\n    cout << a[i] << \" \";\n}","int a[5] = {4, 0, 7, 0, 9};\nfor (int i = 0; i < 5; i++) {\n    if (a[i] == 0) break;\n    cout << a[i] << \" \";\n}","int a[5] = {4, 0, 7, 0, 9};\nfor (int i = 0; i < 5; i++) {\n    if (a[i] != 0) continue;\n    cout << a[i] << \" \";\n}","int a[5] = {4, 0, 7, 0, 9};\nfor (int i = 0; i < 5; i++) {\n    if (a[i] = 0) continue;\n    cout << a[i] << \" \";\n}"],"e":"break остановит вывод на первом нуле; пропускать нужно именно нули; = вместо == обнуляет весь массив."},
{"l":14,"k":"code","q":"Какой фрагмент компилируется и выводит максимум и количество его повторений (9 3)?","o":["int a[5] = {3, 9, 9, 2, 9};\nint mx = a[0], cnt = 0;\nfor (int i = 1; i < 5; i++) if (a[i] > mx) mx = a[i];\nfor (int i = 0; i < 5; i++) if (a[i] == mx) cnt++;\ncout << mx << \" \" << cnt;","int a[5] = {3, 9, 9, 2, 9};\nint mx = a[0], cnt = 0;\nfor (int i = 1; i < 5; i++) if (a[i] > mx) mx = a[i];\nfor (int i = 0; i < 5; i++) if (a[i] == mx) cnt = i;\ncout << mx << \" \" << cnt;","int a[5] = {3, 9, 9, 2, 9};\nint mx = a[0], cnt = 0;\nfor (int i = 1; i < 5; i++) if (a[i] > mx)) mx = a[i]; for (int i = 0;\ni < 5;\ni++) if (a[i] == mx) cnt++; cout << mx << \" \" << cnt;","int a[5] = {3, 9, 9, 2, 9};\nint mx = a[0], cnt;\nfor (int i = 1; i < 5; i++) if (a[i] > mx) mx = a[i];\nfor (int i = 0; i < 5; i++) if (a[i] == mx) cnt++;\ncout << mx << \" \" << cnt;"],"e":"Сначала находят максимум, затем вторым проходом считают совпадения; счётчик обнуляют и увеличивают на 1."},
{"l":14,"k":"out","q":"Что выведет этот код?","o":["9","6","15","8"],"e":"Складываются элементы с индексами 0, 2, 4: 1 + 3 + 5.","c":"int a[5] = {1, 2, 3, 4, 5};\nint s = 0;\nfor (int i = 0; i < 5; i += 2) s += a[i];\ncout << s;"},
{"l":14,"k":"out","q":"Что выведет этот код?","o":["15","51","11","55"],"e":"Первый и последний элементы меняются местами.","c":"int a[4] = {5, 3, 8, 1};\nint t = a[0];\na[0] = a[3];\na[3] = t;\ncout << a[0] << a[3];"},
{"l":14,"k":"out","q":"Что выведет этот код?","o":["10","7","4","6"],"e":"Массив превращается в префиксные суммы: 1, 3, 6, 10.","c":"int a[4] = {1, 2, 3, 4};\nfor (int i = 1; i < 4; i++) a[i] += a[i - 1];\ncout << a[3];"},
{"l":14,"k":"out","q":"Что выведет этот код?","o":["3","8","1","4"],"e":"Выводится индекс максимального элемента, а не его значение.","c":"int a[5] = {2, 7, 1, 8, 2};\nint m = 0;\nfor (int i = 1; i < 5; i++) if (a[i] >= a[m]) m = i;\ncout << m;"},
{"l":14,"k":"out","q":"Что выведет этот код?","o":["3214","1234","4321","3241"],"e":"За один проход наибольший элемент 4 перемещается в конец.","c":"int a[4] = {4, 3, 2, 1};\nfor (int i = 0; i < 3; i++) if (a[i] > a[i + 1]) {\n    int t = a[i];\n    a[i] = a[i + 1];\n    a[i + 1] = t;\n}\ncout << a[0] << a[1] << a[2] << a[3];"},
{"l":14,"k":"out","q":"Что выведет этот код?","o":["213","123","222","321"],"e":"Ноль встречается 2 раза, единица 1 раз, двойка 3 раза.","c":"int f[3] = {0};\nint a[6] = {0, 2, 1, 2, 2, 0};\nfor (int i = 0; i < 6; i++) f[a[i]]++;\ncout << f[0] << f[1] << f[2];"},
{"l":14,"k":"out","q":"Что выведет этот код?","o":["531","135","513","535"],"e":"Массив развёрнут: 5 4 3 2 1.","c":"int a[5] = {1, 2, 3, 4, 5};\nfor (int i = 0; i < 2; i++) {\n    int t = a[i];\n    a[i] = a[4 - i];\n    a[4 - i] = t;\n}\ncout << a[0] << a[2] << a[4];"},

{"l":15,"k":"code","q":"Какой фрагмент правильно сортирует массив пузырьком по возрастанию (выводит 1234)?","o":["int a[4] = {4, 2, 3, 1};\nfor (int i = 0; i < 3; i++) for (int j = 0; j < 3 - i; j++) if (a[j] > a[j + 1]) {\n    int t = a[j];\n    a[j] = a[j + 1];\n    a[j + 1] = t;\n}\nfor (int i = 0; i < 4; i++) cout << a[i];","int a[4] = {4, 2, 3, 1};\nfor (int i = 0; i < 3; i++) for (int j = 0; j < 3 - i; j++) if (a[j] < a[j + 1]) {\n    int t = a[j];\n    a[j] = a[j + 1];\n    a[j + 1] = t;\n}\nfor (int i = 0; i < 4; i++) cout << a[i];","int a[4] = {4, 2, 3, 1};\nfor (int i = 0; i < 3; i++) for (int j = 0; j < 4; j++) if (a[j] > a[j + 1]) {\n    int t = a[j];\n    a[j] = a[j + 1];\n    a[j + 1] = t;\n}\nfor (int i = 0; i < 4; i++) cout << a[i];","int a[4] = {4, 2, 3, 1};\nfor (int i = 0; i < 3; i++) for (int j = 0; j < 3 - i; j++) if (a[j] > a[j + 1]) {\n    int t = a[j];\n    a[j + 1] = t;\n    a[j] = a[j + 1];\n}\nfor (int i = 0; i < 4; i++) cout << a[i];"],"e":"Для возрастания меняют местами, если левый больше правого; при j = 3 индекс j + 1 выходит за границы; порядок обмена важен."},
{"l":15,"k":"code","q":"Какой фрагмент правильно сортирует массив вставками по возрастанию (выводит 1234)?","o":["int a[4] = {3, 1, 4, 2};\nfor (int i = 1; i < 4; i++) {\n    int key = a[i], j = i - 1;\n    while (j >= 0 && a[j] > key) {\n        a[j + 1] = a[j];\n        j--;\n    }\n    a[j + 1] = key;\n}\nfor (int i = 0; i < 4; i++) cout << a[i];","int a[4] = {3, 1, 4, 2};\nfor (int i = 1; i < 3; i++) {\n    int key = a[i], j = i - 1;\n    while (j >= 0 && a[j] > key) {\n        a[j + 1] = a[j];\n        j--;\n    }\n    a[j + 1] = key;\n}\nfor (int i = 0; i < 4; i++) cout << a[i];","int a[4] = {3, 1, 4, 2};\nfor (int i = 1; i < 4; i++) {\n    int key = a[i], j = i - 1;\n    while (j >= 0 && a[j] < key) {\n        a[j + 1] = a[j];\n        j--;\n    }\n    a[j + 1] = key;\n}\nfor (int i = 0; i < 4; i++) cout << a[i];","int a[4] = {3, 1, 4, 2};\nfor (int i = 1; i < 4; i++) {\n    int key = a[i], j = i - 1;\n    while (j >= 0 && a[j] > key) {\n        j--;\n    }\n    a[j + 1] = key;\n}\nfor (int i = 0; i < 4; i++) cout << a[i];"],"e":"Вставлять нужно все элементы, включая последний; для возрастания сдвигают элементы, большие key; сдвиг a[j + 1] = a[j] обязателен."},
{"l":15,"k":"code","q":"Какой фрагмент компилируется и сортирует весь массив (выводит наименьший и наибольший: 15)?","o":["int a[5] = {5, 2, 4, 1, 3};\nsort(a, a + 5);\ncout << a[0] << a[4];","int a[5] = {5, 2, 4, 1, 3};\nsort(a);\ncout << a[0] << a[4];","int a[5] = {5, 2, 4, 1, 3};\nsort(a, 5);\ncout << a[0] << a[4];","int a[5] = {5, 2, 4, 1, 3};\nsort(a, a + 4);\ncout << a[0] << a[4];"],"e":"std::sort получает начало и конец диапазона: sort(a, a + n); при a + 4 последний элемент не сортируется."},
{"l":15,"k":"code","q":"Какая программа компилируется и сортирует массив по убыванию (выводит 41)?","o":["bool desc(int x, int y) {\n    return x > y;\n}\n\nint main() {\n    int a[4] = {2, 4, 1, 3};\n    sort(a, a + 4, desc);\n    cout << a[0] << a[3];\n    return 0;\n}","bool desc(int x, int y) {\n    return x > y;\n}\n\nint main() {\n    int a[4] = {2, 4, 1, 3};\n    sort(a, a + 4, desc());\n    cout << a[0] << a[3];\n    return 0;\n}","bool desc(int x, int y) {\n    return x < y;\n}\n\nint main() {\n    int a[4] = {2, 4, 1, 3};\n    sort(a, a + 4, desc);\n    cout << a[0] << a[3];\n    return 0;\n}","bool desc(int x) {\n    return x > y;\n}\n\nint main() {\n    int a[4] = {2, 4, 1, 3};\n    sort(a, a + 4, desc);\n    cout << a[0] << a[3];\n    return 0;\n}"],"e":"В sort передают имя функции без скобок; для убывания правило сравнения x > y; функция сравнения принимает два элемента."},
{"l":15,"k":"code","q":"Какой фрагмент компилируется и сортирует вектор (выводит 13)?","o":["vector<int> v = {3, 1, 2};\nsort(v.begin(), v.end());\ncout << v[0] << v[2];","vector<int> v = {3, 1, 2};\nsort(v);\ncout << v[0] << v[2];","vector<int> v = {3, 1, 2};\nv.sort();\ncout << v[0] << v[2];","vector<int> v = {3, 1, 2};\nsort(v.begin(), v.begin());\ncout << v[0] << v[2];"],"e":"Для вектора диапазон задают как v.begin(), v.end(); у вектора нет метода sort."},
{"l":15,"k":"code","q":"В массиве нет числа 5. Какой фрагмент линейного поиска правильно выводит -1?","o":["int a[5] = {7, 3, 9, 4, 6};\nint key = 5, pos = -1;\nfor (int i = 0; i < 5; i++) if (a[i] == key) {\n    pos = i;\n    break;\n}\ncout << pos;","int a[5] = {7, 3, 9, 4, 6};\nint key = 5, pos = 0;\nfor (int i = 0; i < 5; i++) if (a[i] == key) {\n    pos = i;\n    break;\n}\ncout << pos;","int a[5] = {7, 3, 9, 4, 6};\nint key = 5, pos = -1;\nfor (int i = 0; i < 5; i++) if (a[i] = key) {\n    pos = i;\n    break;\n}\ncout << pos;","int a[5] = {7, 3, 9, 4, 6};\nint key = 5, pos = -1;\nfor (int i = 0; i < 5; i++) if (a[i] != key) {\n    pos = i;\n    break;\n}\ncout << pos;"],"e":"Признак «не найдено» - значение -1, заданное до цикла; сравнение на равенство пишется ==."},
{"l":15,"k":"code","q":"Какой фрагмент бинарного поиска правильно находит индекс числа 11 (выводит 5)?","o":["int a[6] = {1, 3, 5, 7, 9, 11};\nint key = 11, l = 0, r = 5, pos = -1;\nwhile (l <= r) {\n    int m = (l + r) / 2;\n    if (a[m] == key) {\n        pos = m;\n        break;\n    }\n    if (a[m] < key) l = m + 1;\n    else r = m - 1;\n}\ncout << pos;","int a[6] = {1, 3, 5, 7, 9, 11};\nint key = 11, l = 0, r = 5, pos = -1;\nwhile (l <= r) {\n    int m = (l + r) / 2;\n    if (a[m] == key) {\n        pos = m;\n        break;\n    }\n    if (a[m] < key) r = m - 1;\n    else l = m + 1;\n}\ncout << pos;","int a[6] = {1, 3, 5, 7, 9, 11};\nint key = 11, l = 0, r = 5, pos = -1;\nwhile (l <= r) {\n    int m = (l + r) / 2;\n    if (a[m] == key) {\n        pos = m;\n        break;\n    }\n    if (a[m] < key) l = m;\n    else r = m - 1;\n}\ncout << pos;","int a[6] = {1, 3, 5, 7, 9, 11};\nint key = 11, l = 0, r = 5, pos = -1;\nwhile (l < r) {\n    int m = (l + r) / 2;\n    if (a[m] == key) {\n        pos = m;\n        break;\n    }\n    if (a[m] < key) l = m + 1;\n    else r = m - 1;\n}\ncout << pos;"],"e":"Если средний элемент меньше ключа, сдвигают левую границу: l = m + 1; при l = m цикл зацикливается; условие l <= r нужно, чтобы проверить последний элемент."},
{"l":15,"k":"code","q":"Какой фрагмент компилируется и выводит длину C-строки (5)?","o":["char s[] = \"Hello\";\ncout << strlen(s);","char s[] = \"Hello\";\ncout << s.length();","char s[5] = \"Hello\";\ncout << strlen(s);","char s[] = \"Hello\";\ncout << sizeof(s);"],"e":"У массива char нет методов; для \"Hello\" нужно 6 ячеек с учётом \\0; sizeof возвращает размер массива (6), а не длину строки."},
{"l":15,"k":"code","q":"Какой фрагмент компилируется и правильно сравнивает две C-строки (выводит equal)?","o":["char a[] = \"cat\", b[] = \"cat\";\nif (strcmp(a, b) == 0) cout << \"equal\";\nelse cout << \"different\";","char a[] = \"cat\", b[] = \"cat\";\nif (a == b) cout << \"equal\";\nelse cout << \"different\";","char a[] = \"cat\", b[] = \"cat\";\nif (strcmp(a, b)) cout << \"equal\";\nelse cout << \"different\";","char a[] = \"cat\", b[] = \"cat\";\nif (strcmp(a == b)) cout << \"equal\";\nelse cout << \"different\";"],"e":"a == b сравнивает адреса массивов, а не текст; strcmp возвращает 0 для равных строк, поэтому результат сравнивают с нулём."},
{"l":15,"k":"code","q":"Какой фрагмент компилируется и правильно копирует C-строку?","o":["char src[] = \"C++\";\nchar dst[10];\nstrcpy(dst, src);\ncout << dst;","char src[] = \"C++\";\nchar dst[10];\ndst = src;\ncout << dst;","char src[] = \"C++\";\nchar dst[10];\nstrcpy(src, dst);\ncout << dst;","char src[] = \"C++\";\nchar dst;\nstrcpy(dst, src);\ncout << dst;"],"e":"Массивы char копируют функцией strcpy(куда, откуда), а не присваиванием; приёмник должен быть массивом достаточного размера."},
{"l":15,"k":"code","q":"Какой фрагмент компилируется и сортирует все символы строки (выводит abc)?","o":["string s = \"cab\";\nsort(s.begin(), s.end());\ncout << s;","string s = \"cab\";\nsort(s);\ncout << s;","string s = \"cab\";\ns.sort();\ncout << s;","string s = \"cab\";\nsort(s.begin(), s.end() - 1);\ncout << s;"],"e":"Символы std::string сортируют так же, как вектор: sort(s.begin(), s.end())."},
{"l":15,"k":"code","q":"Какой фрагмент компилируется и правильно находит позицию слова world (выводит 6)?","o":["string s = \"hello world\";\nsize_t p = s.find(\"world\");\nif (p != string::npos) cout << p;\nelse cout << \"none\";","string s = \"hello world\";\nsize_t p = s.find(\"world\");\nif (p == string::npos) cout << p;\nelse cout << \"none\";","string s = \"hello world\";\nsize_t p = s.find('world');\nif (p != string::npos) cout << p;\nelse cout << \"none\";","string s = \"hello world\";\nsize_t p = find(s, \"world\");\nif (p != string::npos) cout << p;\nelse cout << \"none\";"],"e":"find возвращает string::npos, если подстрока не найдена; подстроку пишут в двойных кавычках; find - метод строки."},
{"l":15,"k":"code","q":"Какой фрагмент компилируется и считает буквы a в C-строке (3)?","o":["char s[] = \"banana\";\nint cnt = 0;\nfor (int i = 0; s[i] != '\\0'; i++) if (s[i] == 'a') cnt++;\ncout << cnt;","char s[] = \"banana\";\nint cnt = 0;\nfor (int i = 0; s[i] != \"\\0\"; i++) if (s[i] == 'a') cnt++;\ncout << cnt;","char s[] = \"banana\";\nint cnt = 0;\nfor (int i = 0; s[i] != '\\0'; i++) if (s[i] == \"a\") cnt++;\ncout << cnt;","char s[] = \"banana\";\nint cnt = 0;\nfor (int i = 0; s[i] != '\\0'; i++) if (s[i] = 'a') cnt++;\ncout << cnt;"],"e":"Символы сравнивают с литералами в одинарных кавычках; = вместо == заменяет все буквы на a."},

{"l":15,"k":"out","q":"Что выведет этот код?","o":["3","7","2","4"],"e":"Проверяются элементы 4, 6 и 7 - три шага вместо семи при линейном поиске.","c":"int a[8] = {1, 2, 3, 4, 5, 6, 7, 8};\nint l = 0, r = 7, steps = 0;\nwhile (l <= r) {\n    steps++;\n    int m = (l + r) / 2;\n    if (a[m] == 7) break;\n    if (a[m] < 7) l = m + 1;\n    else r = m - 1;\n}\ncout << steps;"},

{"l":16,"k":"code","q":"Какой фрагмент компилируется и выводит C++ 17?","o":["string s = \"C\";\ns += \"++\";\ns.append(\" 17\");\ncout << s;","string s = \"C\";\ns =+ \"++\";\ns.append(\" 17\");\ncout << s;","string s = \"C\";\ns += \"++\";\ns.append \" 17\";\ncout << s;","string s = \"C\";\ns += \"++\";\nappend(s, \" 17\");\ncout << s;"],"e":"Добавление в конец - оператор +=; запись =+ заменяет строку; append - метод, его вызывают через точку со скобками."},

{"l":16,"k":"code","q":"Какой фрагмент компилируется и правильно проверяет, что в строке есть символ @ (выводит ok)?","o":["string s = \"@mail.uz\";\nif (s.find('@') != string::npos) cout << \"ok\";\nelse cout << \"bad\";","string s = \"@mail.uz\";\nif (s.find('@')) cout << \"ok\";\nelse cout << \"bad\";","string s = \"@mail.uz\";\nif (s.find('@') == true) cout << \"ok\";\nelse cout << \"bad\";","string s = \"@mail.uz\";\nif (s.find(@) != string::npos) cout << \"ok\";\nelse cout << \"bad\";"],"e":"find возвращает позицию, которая может быть равна 0, поэтому результат сравнивают с string::npos, а не используют как условие."},
{"l":16,"k":"code","q":"Какой фрагмент компилируется и правильно сравнивает строки abc и abd (выводит less)?","o":["string a = \"abc\", b = \"abd\";\nif (a == b) cout << \"same\";\nelse if (a < b) cout << \"less\";\nelse cout << \"greater\";","string a = \"abc\", b = \"abd\";\nif (a = b) cout << \"same\";\nelse if (a < b) cout << \"less\";\nelse cout << \"greater\";","string a = \"abc\", b = \"abd\";\nif (a == b) cout << \"same\";\nelse if (a.size() < b.size()) cout << \"less\";\nelse cout << \"greater\";","string a = \"abc\", b = \"abd\";\nif (strcmp(a, b) == 0) cout << \"same\";\nelse if (a < b) cout << \"less\";\nelse cout << \"greater\";"],"e":"Строки string сравнивают операторами == и <; длины у строк одинаковые; strcmp работает только с C-строками."},
{"l":16,"k":"code","q":"Пользователь вводит возраст 18 и на следующей строке Ali Valiev. Какой фрагмент компилируется и выводит Ali Valiev 18?","o":["int age;\nstring name;\ncin >> age;\ncin.ignore();\ngetline(cin, name);\ncout << name << \" \" << age;","int age;\nstring name;\ncin >> age;\ngetline(cin, name);\ncout << name << \" \" << age;","int age;\nstring name;\ncin >> age;\ncin.ignore();\ncin >> name;\ncout << name << \" \" << age;","int age;\nstring name;\ncin >> age;\ncin.ignore();\ngetline(name, cin);\ncout << name << \" \" << age;"],"e":"После cin >> в буфере остаётся Enter: без cin.ignore() getline прочитает пустую строку; cin >> name читает только одно слово."},
{"l":16,"k":"code","q":"Какой фрагмент компилируется и выводит 42! ?","o":["string a = \"12\", b = \"30\";\nint sum = stoi(a) + stoi(b);\ncout << to_string(sum) + \"!\";","string a = \"12\", b = \"30\";\nint sum = a + b;\ncout << to_string(sum) + \"!\";","string a = \"12\", b = \"30\";\nint sum = stoi(a) + stoi(b);\ncout << sum + \"!\";","string a = \"12\", b = \"30\";\nint sum = stoi(a + b);\ncout << to_string(sum) + \"!\";"],"e":"Строки превращают в числа функцией stoi до сложения; a + b склеивает строки в \"1230\"; число превращают в строку функцией to_string."},
{"l":16,"k":"code","q":"Какой фрагмент компилируется и переводит строку в верхний регистр (выводит ABC)?","o":["string s = \"abc\";\nfor (int i = 0; i < s.size(); i++) s[i] = toupper(s[i]);\ncout << s;","string s = \"abc\";\nfor (int i = 0; i < s.size(); i++) toupper(s[i]);\ncout << s;","string s = \"abc\";\nfor (int i = 0; i < s.size(); i++) s = toupper(s);\ncout << s;","string s = \"abc\";\nfor (int i = 0; i < s.size(); i++) s[i] = s[i].toupper();\ncout << s;"],"e":"toupper возвращает новый символ, его нужно записать обратно в s[i]; функция работает с одним символом, а не со строкой."},
{"l":16,"k":"code","q":"Какой фрагмент компилируется и считает цифры в строке a1b22c (3)?","o":["string s = \"a1b22c\";\nint cnt = 0;\nfor (int i = 0; i < s.size(); i++) if (isdigit(s[i])) cnt++;\ncout << cnt;","string s = \"a1b22c\";\nint cnt = 0;\nfor (int i = 0; i < s.size(); i++) if (isdigit(s)) cnt++;\ncout << cnt;","string s = \"a1b22c\";\nint cnt = 0;\nfor (int i = 0; i < s.size(); i++) if (s[i] >= 0 && s[i] <= 9) cnt++;\ncout << cnt;","string s = \"a1b22c\";\nint cnt = 0;\nfor (int i = 0; i < s.size(); i++) if (isdigit(i)) cnt++;\ncout << cnt;"],"e":"isdigit проверяет один символ s[i]; символы-цифры имеют коды от '0' до '9', а не от 0 до 9."},
{"l":16,"k":"code","q":"Какой фрагмент правильно проверяет, является ли введённое слово палиндромом (1 - да, 0 - нет)?","o":["string s;\ncin >> s;\nbool ok = true;\nfor (int i = 0; i < s.size() / 2; i++) if (s[i] != s[s.size() - 1 - i]) ok = false;\ncout << ok;","string s;\ncin >> s;\nbool ok = true;\nfor (int i = 0; i < s.size() / 2; i++) if (s[i] != s[s.size() - i]) ok = false;\ncout << ok;","string s;\ncin >> s;\nbool ok = true;\nfor (int i = 0; i < s.size() / 2; i++) if (s[i] != s[s.size() - 1 - i]) ok == false;\ncout << ok;","string s;\ncin >> s;\nbool ok = true;\nfor (int i = 0; i < s.size() / 2; i++) if (s[i] = s[s.size() - 1 - i]) ok = false;\ncout << ok;"],"e":"Парный символ имеет индекс size() - 1 - i; == не изменяет флаг; = вместо != портит строку и всегда даёт истину."},
{"l":16,"k":"code","q":"Какой фрагмент компилируется и считает слова в строке, разделённые одним пробелом (3)?","o":["string s = \"one two three\";\nint words = 1;\nfor (int i = 0; i < s.size(); i++) if (s[i] == ' ') words++;\ncout << words;","string s = \"one two three\";\nint words = 0;\nfor (int i = 0; i < s.size(); i++) if (s[i] == ' ') words++;\ncout << words;","string s = \"one two three\";\nint words = 1;\nfor (int i = 0; i < s.size(); i++) if (s[i] == \" \") words++;\ncout << words;","string s = \"one two three\";\nint words = 1;\nfor (int i = 0; i < s.size(); i++) if (s == ' ') words++;\ncout << words;"],"e":"Слов на одно больше, чем пробелов; символ сравнивают с литералом в одинарных кавычках; сравнивать нужно s[i]."},
{"l":16,"k":"code","q":"Какой фрагмент компилируется и безопасно добавляет текст к C-строке (выводит Hello, C 8)?","o":["char a[20] = \"Hello\";\nstrcat(a, \", C\");\ncout << a << \" \" << strlen(a);","char a[] = \"Hello\";\nstrcat(a, \", C\");\ncout << a << \" \" << strlen(a);","char a[20] = \"Hello\";\na = a + \", C\";\ncout << a << \" \" << strlen(a);","char a[20] = \"Hello\";\nstrcat(a + \", C\");\ncout << a << \" \" << strlen(a);"],"e":"В массиве должно быть место для добавляемого текста: char a[] вмещает только \"Hello\"; C-строки соединяют функцией strcat(куда, что)."},
{"l":16,"k":"out","q":"Что выведет этот код?","o":["cde","bcd","cdef","abc"],"e":"Три символа, начиная с индекса 2.","c":"string s = \"abcdef\";\ncout << s.substr(2, 3);"},
{"l":16,"k":"out","q":"Что выведет этот код?","o":["C++ ello","C++ hello","C++hello","C++ hllo"],"e":"После вставки символ с индексом 4 - это буква h, она удаляется.","c":"string s = \"hello\";\ns.insert(0, \"C++ \");\ns.erase(4, 1);\ncout << s;"},
{"l":16,"k":"out","q":"Что выведет этот код?","o":["57 12","12 12","57 57","12 57"],"e":"Строки склеиваются, числа складываются.","c":"string a = \"5\", b = \"7\";\ncout << a + b << \" \" << stoi(a) + stoi(b);"},
{"l":16,"k":"out","q":"Что выведет этот код?","o":["624","622","634","724"],"e":"Длина 6, первое вхождение na с индекса 2, последнее с индекса 4.","c":"string s = \"banana\";\ncout << s.size() << s.find(\"na\") << s.rfind(\"na\");"},
{"l":16,"k":"out","q":"Что выведет этот код?","o":["25","35","24","26"],"e":"Две прописные буквы, длина строки 5.","c":"string s = \"aXbXc\";\nint k = 0;\nfor (int i = 0; i < s.size(); i++) if (isupper(s[i])) k++;\ncout << k << s.length();"},
{"l":16,"k":"out","q":"Что выведет этот код?","o":["helloo","Helloo","hello","hello4"],"e":"Первая буква становится строчной, в конец добавляется символ с индексом 4.","c":"string s = \"Hello\";\ns[0] = tolower(s[0]);\ns += s[4];\ncout << s;"},
{"l":16,"k":"out","q":"Что выведет этот код?","o":["a+b-c3","a+b+c3","a+b-c1","a-b-c1"],"e":"Заменяется один символ с индексом 1; оставшийся дефис имеет индекс 3.","c":"string s = \"a-b-c\";\ns.replace(1, 1, \"+\");\ncout << s << s.find('-');"},

{"l":17,"k":"theory","q":"Что хранит указатель?","o":["Адрес объекта в памяти","Копию значения переменной","Имя переменной","Размер переменной в байтах"],"e":"Указатель - это адрес, а не значение объекта."},
{"l":17,"k":"theory","q":"Что возвращает операция &x?","o":["Адрес переменной x","Значение переменной x","Ссылку на копию x","Размер переменной x"],"e":"& - операция взятия адреса."},
{"l":17,"k":"theory","q":"Что означает запись *p в выражении, если p - указатель?","o":["Значение, которое находится по адресу p","Адрес указателя p","Умножение p на следующее значение","Размер объекта"],"e":"* - операция разыменования."},
{"l":17,"k":"theory","q":"Что такое nullptr?","o":["Значение указателя, который никуда не указывает","Указатель на число 0","Указатель на первый элемент массива","Удалённый указатель"],"e":"Перед разыменованием указатель проверяют на nullptr."},
{"l":17,"k":"theory","q":"На сколько сдвигается адрес при выполнении p + 1 для указателя int* p?","o":["На один элемент типа int","Ровно на 1 байт","На размер всего массива","Адрес не изменяется"],"e":"Арифметика указателей считает в элементах, а не в байтах."},
{"l":17,"k":"theory","q":"Что означает объявление const int* p?","o":["Через p нельзя изменять значение, на которое он указывает","Нельзя переназначить сам указатель p","Указатель p всегда равен nullptr","p указывает только на константу 0"],"e":"int* const p - наоборот: нельзя переназначить сам указатель."},
{"l":17,"k":"theory","q":"Что такое «висячий» указатель (dangling pointer)?","o":["Указатель на память, которая уже освобождена или больше не существует","Указатель, равный nullptr","Указатель на константу","Указатель на первый элемент массива"],"e":"Обращение по такому указателю - опасная ошибка."},
{"l":17,"k":"code","q":"Какой фрагмент компилируется и изменяет x через указатель (выводит 20)?","o":["int x = 10;\nint* p = &x;\n*p = 20;\ncout << x;","int x = 10;\nint* p = x;\n*p = 20;\ncout << x;","int x = 10;\nint* p = &x;\np = 20;\ncout << x;","int x = 10;\nint p = &x;\n*p = 20;\ncout << x;"],"e":"В указатель записывают адрес &x; значение изменяют через разыменование *p; тип указателя - int*."},
{"l":17,"k":"code","q":"Какой фрагмент выводит значение переменной, увеличенное на 1 (8)?","o":["int x = 7;\nint* p = &x;\ncout << *p + 1;","int x = 7;\nint* p = &x;\ncout << p + 1;","int x = 7;\nint* p = &x;\ncout << &p + 1;","int x = 7;\nint* p;\ncout << *p + 1;"],"e":"Без разыменования выводится адрес; &p - адрес самого указателя; неинициализированный указатель разыменовывать нельзя."},
{"l":17,"k":"code","q":"Какой фрагмент компилируется и безопасно работает с пустым указателем (выводит empty)?","o":["int* p = nullptr;\nif (p != nullptr) cout << *p;\nelse cout << \"empty\";","int* p = nullptr;\nif (p == nullptr) cout << *p;\nelse cout << \"empty\";","int* p = nullptr;\ncout << *p;","int* p = null;\nif (p != nullptr) cout << *p;\nelse cout << \"empty\";"],"e":"Разыменовывать можно только ненулевой указатель; литерал называется nullptr."},
{"l":17,"k":"code","q":"Какой фрагмент компилируется и находит сумму элементов через указатель (14)?","o":["int a[4] = {5, 2, 3, 4};\nint* p = a;\nint sum = 0;\nfor (int i = 0; i < 4; i++) sum += *(p + i);\ncout << sum;","int a[4] = {5, 2, 3, 4};\nint* p = a;\nint sum = 0;\nfor (int i = 0; i < 4; i++) sum += *p + i;\ncout << sum;","int a[4] = {5, 2, 3, 4};\nint* p = &a;\nint sum = 0;\nfor (int i = 0; i < 4; i++) sum += *(p + i);\ncout << sum;","int a[4] = {5, 2, 3, 4};\nint* p = a;\nint sum = 0;\nfor (int i = 0; i < 4; i++) sum += (p + i);\ncout << sum;"],"e":"*(p + i) - это элемент a[i]; *p + i прибавляет i к первому элементу; имя массива уже является адресом первого элемента."},
{"l":17,"k":"code","q":"Какой фрагмент компилируется и правильно проходит по массиву указателем (выводит 456)?","o":["int a[3] = {4, 5, 6};\nfor (int* p = a; p < a + 3; p++) cout << *p;","int a[3] = {4, 5, 6};\nfor (int* p = a; p <= a + 3; p++) cout << *p;","int a[3] = {4, 5, 6};\nfor (int* p = a; p < a + 3; p++) cout << p;","int a[3] = {4, 5, 6};\nfor (int p = a; p < a + 3; p++) cout << *p;"],"e":"Адрес a + 3 находится уже за массивом; для вывода значения нужно разыменование; тип переменной - int*."},
{"l":17,"k":"code","q":"Какая программа компилируется и меняет значения переменных местами (выводит 21)?","o":["void swapValues(int* a, int* b) {\n    int t = *a;\n    *a = *b;\n    *b = t;\n}\n\nint main() {\n    int x = 1, y = 2;\n    swapValues(&x, &y);\n    cout << x << y;\n    return 0;\n}","void swapValues(int* a, int* b) {\n    int t = *a;\n    *a = *b;\n    *b = t;\n}\n\nint main() {\n    int x = 1, y = 2;\n    swapValues(x, y);\n    cout << x << y;\n    return 0;\n}","void swapValues(int* a, int* b) {\n    int* t = a;\n    a = b;\n    b = t;\n}\n\nint main() {\n    int x = 1, y = 2;\n    swapValues(&x, &y);\n    cout << x << y;\n    return 0;\n}","void swapValues(int a, int b) {\n    int t = *a;\n    *a = *b;\n    *b = t;\n}\n\nint main() {\n    int x = 1, y = 2;\n    swapValues(&x, &y);\n    cout << x << y;\n    return 0;\n}"],"e":"В функцию передают адреса; менять нужно значения по адресам (*a, *b), а не локальные копии указателей."},
{"l":17,"k":"code","q":"Какая программа компилируется и правильно находит сумму массива в функции (6)?","o":["int sum(int* a, int n) {\n    int s = 0;\n    for (int i = 0; i < n; i++) s += a[i];\n    return s;\n}\n\nint main() {\n    int a[3] = {1, 2, 3};\n    cout << sum(a, 3);\n    return 0;\n}","int sum(int* a, int n) {\n    int s = 0;\n    for (int i = 0; i < n; i++) s += a[i];\n    return s;\n}\n\nint main() {\n    int a[3] = {1, 2, 3};\n    cout << sum(a);\n    return 0;\n}","int sum(int* a, int n) {\n    int s = 0;\n    for (int i = 0; i < n; i++) s += a[i];\n    return s;\n}\n\nint main() {\n    int a[3] = {1, 2, 3};\n    cout << sum(&a, 3);\n    return 0;\n}","int sum(int* a, int n) {\n    int s = 0;\n    for (int i = 0; i < sizeof(a) / sizeof(a[0]); i++) s += a[i];\n    return s;\n}\n\nint main() {\n    int a[3] = {1, 2, 3};\n    cout << sum(a, 3);\n    return 0;\n}"],"e":"При передаче в функцию массив превращается в указатель и теряет размер, поэтому n передают отдельно; sizeof(a) внутри функции - размер указателя."},
{"l":17,"k":"code","q":"Какой фрагмент с указателем на константу компилируется (выводит 9)?","o":["int x = 5, y = 9;\nconst int* p = &x;\np = &y;\ncout << *p;","int x = 5, y = 9;\nconst int* p = &x;\n*p = y;\ncout << *p;","int x = 5, y = 9;\nint* const p = &x;\np = &y;\ncout << *p;","int x = 5, y = 9;\nconst int* const p = &x;\np = &y;\ncout << *p;"],"e":"const int* p запрещает менять значение через p, но разрешает переназначить p; int* const p запрещает переназначение."},
{"l":17,"k":"code","q":"Какой фрагмент компилируется и правильно работает с динамической переменной (выводит 6)?","o":["int* p = new int(5);\n*p += 1;\ncout << *p;\ndelete p;","int* p = new int[5];\n*p += 1;\ncout << *p;\ndelete p;","int p = new int(5);\n*p += 1;\ncout << *p;\ndelete p;","int* p = new int(5);\n*p += 1;\ncout << *p;\ndelete *p;"],"e":"new int(5) создаёт одно число со значением 5, new int[5] - массив из 5 чисел без значений; new возвращает указатель; delete применяют к указателю."},
{"l":17,"k":"code","q":"Какой фрагмент компилируется и правильно работает с динамическим массивом (выводит 4)?","o":["int n = 3;\nint* a = new int[n];\nfor (int i = 0; i < n; i++) a[i] = i * i;\ncout << a[2];\ndelete[] a;","int n = 3;\nint* a = new int[];\nfor (int i = 0; i < n; i++) a[i] = i * i;\ncout << a[2];\ndelete[] a;","int n = 3;\nint a = new int[n];\nfor (int i = 0; i < n; i++) a[i] = i * i;\ncout << a[2];\ndelete[] a;","int n = 3;\nint* a = new int[n];\nfor (int i = 0; i < n; i++) a[i] = i * i;\ndelete[] a;\ncout << a[2];"],"e":"Массив создают через new int[n] с указанием размера и освобождают через delete[]; после освобождения памяти обращаться к ней нельзя."},
{"l":17,"k":"code","q":"Какой фрагмент с умным указателем компилируется (выводит 42)?","o":["unique_ptr<int> p = make_unique<int>(42);\ncout << *p;","unique_ptr<int> p = 42;\ncout << *p;","unique_ptr<int> p = make_unique<int>(42);\nunique_ptr<int> q = p;\ncout << *q;","unique_ptr<int> p = make_unique(42);\ncout << *p;"],"e":"unique_ptr создают через make_unique<тип>(значение); его нельзя копировать - владелец у памяти один."},
{"l":17,"k":"code","q":"Какая программа компилируется и увеличивает переменную через ссылку (выводит 6)?","o":["void inc(int& v) {\n    v++;\n}\n\nint main() {\n    int x = 5;\n    inc(x);\n    cout << x;\n    return 0;\n}","void inc(int v) {\n    v++;\n}\n\nint main() {\n    int x = 5;\n    inc(x);\n    cout << x;\n    return 0;\n}","void inc(int& v) {\n    v++;\n}\n\nint main() {\n    int x = 5;\n    inc(&x);\n    cout << x;\n    return 0;\n}","void inc(int& v) {\n    v++;\n}\n\nint main() {\n    int x = 5;\n    inc(5);\n    cout << x;\n    return 0;\n}"],"e":"Без & функция изменяет копию; в параметр-ссылку передают саму переменную, а не адрес и не литерал."},
{"l":17,"k":"code","q":"Какой фрагмент компилируется и правильно обращается к двумерному массиву через указатель (выводит 6)?","o":["int m[2][3] = {{1, 2, 3}, {4, 5, 6}};\nint (*row)[3] = m;\ncout << row[1][2];","int m[2][3] = {{1, 2, 3}, {4, 5, 6}};\nint* row[3] = m;\ncout << row[1][2];","int m[2][3] = {{1, 2, 3}, {4, 5, 6}};\nint** row = m;\ncout << row[1][2];","int m[2][3] = {{1, 2, 3}, {4, 5, 6}};\nint (*row)[3] = m;\ncout << row[2][1];"],"e":"Имя двумерного массива - указатель на строку из трёх int: int (*row)[3]; индексы: сначала строка (0-1), затем столбец (0-2)."},
